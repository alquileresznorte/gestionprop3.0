<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Cuentas Personales</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0B1120;color:#E2E8F0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;padding-bottom:60px}
  .wrap{max-width:900px;margin:0 auto;padding:12px}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#111827;border-bottom:1px solid #1F2937;position:sticky;top:0;z-index:20}
  .brand{font-weight:800;font-size:16px;color:#A78BFA;letter-spacing:.5px}
  .nav{display:flex;gap:4px;flex-wrap:wrap;padding:8px 12px;background:#0F172A;position:sticky;top:44px;z-index:19;border-bottom:1px solid #1F2937}
  .nbtn{background:#1E293B;color:#94A3B8;border:none;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
  .nbtn.on{background:#7C3AED;color:#fff}
  .sec{font-size:16px;font-weight:800;margin:14px 0 8px;color:#E2E8F0}
  .sub{font-size:12px;color:#94A3B8;margin-bottom:8px;line-height:1.5}
  .card{background:#111827;border:1px solid #1F2937;border-radius:12px;padding:14px;margin-bottom:12px}
  .btn{background:#7C3AED;color:#fff;border:none;border-radius:8px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer}
  .btn.g{background:#334155;color:#CBD5E1}
  .btn.ok{background:#065F46;color:#A7F3D0}
  .btn.dz{background:#7F1D1D;color:#FCA5A5}
  .btn.sm{padding:5px 10px;font-size:11px}
  input,select{width:100%;background:#0F172A;border:1px solid #334155;border-radius:8px;padding:10px;color:#E2E8F0;font-size:15px}
  label{font-size:12px;color:#94A3B8;display:block;margin-bottom:4px}
  .fg{margin-bottom:12px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #1E293B}
  .row:last-child{border-bottom:none}
  .pill{font-size:10px;background:#1E293B;color:#93C5FD;border-radius:6px;padding:2px 7px}
  .pill.tj{color:#F0ABFC}
  .muted{color:#64748B;font-size:11px}
  .empty{color:#64748B;font-size:13px;padding:16px;text-align:center}
  .ctab{width:100%;border-collapse:collapse;font-size:13px}
  .ctab th,.ctab td{padding:6px 8px;border-bottom:1px solid #1E293B;vertical-align:top}
  .spin{position:fixed;top:8px;right:8px;width:14px;height:14px;border:2px solid #7C3AED;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:none;z-index:50}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="spin" id="spin"></div>
<div class="topbar"><span class="brand">CUENTAS</span><span class="muted" id="hoy"></span></div>
<div class="nav" id="nav"></div>
<div class="wrap" id="app"><div class="empty">Cargando…</div></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({apiKey:'AIzaSyDhuSP_WTWI3hqf5GqgFExkptFfpqJUn50',authDomain:'gestion-prop.firebaseapp.com',databaseURL:'https://gestion-prop-default-rtdb.firebaseio.com',projectId:'gestion-prop'});
var DB=firebase.database();

// ── Estado ─ nodos cn_* (lo nuevo) + nodos viejos solo para Capital e importar
var D={cuentas:{},rubros:{},gastos:{},gastosVj:{},aho:{},cfgAho:{},ahoWho:{},inv:{},invWho:{},usdMovs:{},capOld:{},descartados:{}};
var TAB='cargar';
var CTIPO='gasto';
var PAGOTJ='';
var EDITTJ=null;
var RESEXP='';
var EDIT=null;
var SHOWHIST=false;
var cM='2026-08';
var MESES=['2026-06','2026-07','2026-08','2026-09'];

function spin(on){document.getElementById('spin').style.display=on?'block':'none';}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fbSet(p,v){spin(true);DB.ref(p).set(v,function(){spin(false);});}
function fbRm(p){spin(true);DB.ref(p).remove(function(){spin(false);});}
function arr(o){o=o||{};return Object.keys(o).map(function(k){var x=Object.assign({},o[k]);x._k=k;return x;});}
function p$(n){n=Math.round(+n||0);return (n<0?'−$':'$')+Math.abs(n).toLocaleString('es-AR');}
function diaLabel(d){if(!d||d.length<10)return d||'sin fecha';var y=+d.slice(0,4),m=+d.slice(5,7),dy=+d.slice(8,10);var dias=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];var dt=new Date(y,m-1,dy);var dn=isNaN(dt.getTime())?'':dias[dt.getDay()]+' ';return dn+String(dy).padStart(2,'0')+'/'+String(m).padStart(2,'0');}
function pU(n){return 'U$S '+Math.round(+n||0).toLocaleString('es-AR');}
function money2num(v){return Math.round(Number(String(v||'').replace(/[^\d]/g,''))||0);}
function byOrden(a,b){return (a.orden||0)-(b.orden||0);}
function opt(v,lbl,cur){return '<option value="'+esc(v)+'"'+(String(cur)===String(v)?' selected':'')+'>'+esc(lbl)+'</option>';}

function bind(node,key){DB.ref(node).on('value',function(s){D[key]=s.exists()?s.val():{};render();});}
document.addEventListener('input',function(e){var el=e.target;if(el&&el.getAttribute&&el.getAttribute('data-money')!=null){var raw=String(el.value).replace(/[^\d]/g,'');el.value=raw?Number(raw).toLocaleString('es-AR'):'';}});
bind('cn_cuentas','cuentas');
bind('cn_rubros','rubros');
bind('cn_descartados','descartados');
bind('cn_gastos','gastos');
bind('fin_gastos','gastosVj');
bind('aho','aho');bind('cfg_aho','cfgAho');bind('fin_aho_who','ahoWho');
bind('inv','inv');bind('fin_inv_who','invWho');bind('fin_usdMovs','usdMovs');bind('fin_capital','capOld');
document.getElementById('hoy').textContent=new Date().toLocaleDateString('es-AR');

// ── Personas / cuentas / rubros ────────────────────────────────────────────
var ADULTOS=['loli','hugo'];
function persLbl(p){p=String(p||'').toLowerCase();return p==='loli'?'💜 Loli':p==='hugo'?'💙 Hugo':(p==='familia'||p==='shared')?'👪 Familia':p==='empresa'?'🏢 Empresa':p==='casa'?'🏠 Casa':'—';}
function quienOpts(sel){return ADULTOS.map(function(p){return opt(p,persLbl(p),sel);}).join('');}
function corrOpts(sel){return ADULTOS.map(function(p){return opt(p,persLbl(p),sel);}).join('')+opt('familia','👪 Familia (50/50)',sel)+opt('empresa','🏢 Empresa',sel);}
function cuentasCaja(){return arr(D.cuentas).filter(function(c){return c.tipo==='caja';}).sort(byOrden);}
function cuentasTarj(){return arr(D.cuentas).filter(function(c){return c.tipo==='tarjeta';}).sort(byOrden);}
function cuentasEmp(){return arr(D.cuentas).filter(function(c){return c.tipo==='empresa';}).sort(byOrden);}
function cuentaById(k){return D.cuentas[k];}
function rubrosList(){return arr(D.rubros).sort(byOrden);}
function ctaOpts(sel){var o='<optgroup label="Cajas">'+cuentasCaja().map(function(c){return opt(c._k,c.nombre,sel);}).join('')+'</optgroup>';var t=cuentasTarj();if(t.length)o+='<optgroup label="Tarjetas">'+t.map(function(c){return opt(c._k,'💳 '+c.nombre,sel);}).join('')+'</optgroup>';var e=cuentasEmp();if(e.length)o+='<optgroup label="Retiro empresa">'+e.map(function(c){return opt(c._k,'🏢 '+c.nombre,sel);}).join('')+'</optgroup>';return o;}

// Movimientos del mes (solo lo cargado en la app nueva)
function movsMes(mes){return (D.gastos&&D.gastos[mes])?arr(D.gastos[mes]):[];}

// ── Navegación ────────────────────────────────────────────────────────────
var TABS=[['cargar','➕ Cargar'],['mov','Movimientos'],['tj','💳 TJ'],['capital','Capital'],['resumen','Resumen'],['config','⚙ Config']];
function go(t){if(t!=='cargar')EDIT=null;TAB=t;render();}
function selMes(){return '<div class="fg"><label>Mes</label><select onchange="cM=this.value;render()">'+MESES.map(function(m){return '<option'+(m===cM?' selected':'')+'>'+m+'</option>';}).join('')+'</select></div>';}
function render(){
  document.getElementById('nav').innerHTML=TABS.map(function(t){return '<button class="nbtn'+(TAB===t[0]?' on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>';}).join('');
  var app=document.getElementById('app');
  if(TAB==='cargar')app.innerHTML=vCargar();
  else if(TAB==='mov')app.innerHTML=vMov();
  else if(TAB==='tj')app.innerHTML=vTJ();
  else if(TAB==='capital')app.innerHTML=vCapital();
  else if(TAB==='resumen')app.innerHTML=vResumen();
  else if(TAB==='config')app.innerHTML=vConfig();
}

// ── CARGAR (el cuadro único) ───────────────────────────────────────────────
function vCargar(){
  var hoy=new Date().toISOString().split('T')[0];
  var ed=EDIT?((D.gastos[EDIT.mes]||{})[EDIT.key]||null):null;
  var v=ed||{};
  var o='<div class="sec">'+(ed?'✏ Editar movimiento':'➕ Cargar movimiento')+'</div>';
  if(!rubrosList().length||!cuentasCaja().length) o+='<div class="card"><div class="sub">⚠ Antes de cargar, andá a <b>⚙ Config</b> y creá tus <b>rubros</b> y <b>cuentas</b> (hay botones para cargar los sugeridos).</div></div>';
  o+='<div class="card">';
  o+='<div class="g2"><div><label>Tipo</label><select id="c-tipo" onchange="CTIPO=this.value;render()">'+opt('gasto','🔴 Gasto',CTIPO)+opt('ingreso','🟢 Ingreso',CTIPO)+opt('transfer','🔄 Mov. entre cuentas',CTIPO)+'</select></div><div><label>Fecha</label><input type="date" id="c-fecha" value="'+(v.fecha||hoy)+'"/></div></div>';
  if(CTIPO==='transfer'){
    o+='<div class="g2"><div><label>Sale de</label><select id="c-out"><option value="">— elegí —</option>'+ctaOpts(v.ctaOut||'')+'</select></div><div><label>Entra a</label><select id="c-in"><option value="">— elegí —</option>'+ctaOpts(v.ctaIn||'')+'</select></div></div>';
    o+='<div class="g2"><div><label>Monto $</label><input id="c-monto" inputmode="numeric" data-money="1" value="'+(v.monto?Number(v.monto).toLocaleString("es-AR"):"")+'" placeholder="0"/></div><div><label>Nota (opcional)</label><input id="c-desc" value="'+esc(v.desc&&v.desc!=='Movimiento entre cuentas'?v.desc:'')+'" placeholder="Ej: paso plata a MP"/></div></div>';
    o+='<div class="sub">Mueve el saldo de una cuenta a la otra. No cuenta como gasto de nadie.</div>';
  } else {
    o+='<div class="g2"><div><label>Qué (detalle)</label><input id="c-desc" value="'+esc(v.desc||'')+'" placeholder="Ej: shampoo, colegio Max, nafta"/></div><div><label>Monto $</label><input id="c-monto" inputmode="numeric" data-money="1" value="'+(v.monto?Number(v.monto).toLocaleString("es-AR"):"")+'" placeholder="0"/></div></div>';
    o+='<div class="fg"><label>Rubro (en qué / para quién)</label><select id="c-rubro"><option value="">— elegí —</option>'+rubrosList().map(function(r){return opt(r.nombre,r.nombre,v.rubro||'');}).join('')+'</select></div>';
    o+='<div class="g3">';
    o+='<div><label>Quién lo hizo</label><select id="c-quien"><option value="">—</option>'+quienOpts(v.quien||'')+'</select></div>';
    o+='<div><label>Corresponde (división)</label><select id="c-corr">'+corrOpts(v.corresponde||'familia')+'</select></div>';
    o+='<div><label>'+(CTIPO==='ingreso'?'A qué cuenta entró':'Con qué se pagó')+'</label><select id="c-cta"><option value="">— elegí —</option>'+ctaOpts(v.cuenta||'')+'</select></div>';
    o+='</div>';
    if(CTIPO==='gasto'&&cuentasTarj().length){
      o+='<div class="fg"><label>En cuántas cuotas <span class="muted">(solo si pagás con tarjeta)</span></label><select id="c-cuotas">'+[1,2,3,4,6,9,12,18,24].map(function(n){return opt(n,n===1?'1 cuota (un pago)':n+' cuotas',v.cuotas||1);}).join('')+'</select><div class="muted" style="margin-top:4px">La cuota 1 cae en la fecha de la compra; el resto, un mes por cuota.</div></div>';
      o+='<div class="fg"><label>Moneda <span class="muted">(solo si pagás con tarjeta)</span></label><select id="c-moneda">'+opt('ars','$ pesos',(v.moneda==='usd'?'usd':'ars'))+opt('usd','USD dólares',(v.moneda==='usd'?'usd':'ars'))+'</select></div>';
    }
  }
  o+='<button class="btn" style="width:100%" onclick="guardarMov()">'+(ed?'Guardar cambios':'Guardar')+'</button>';
  if(ed)o+='<button class="btn g" style="width:100%;margin-top:6px" onclick="cancelEdit()">Cancelar edición</button>';
  o+='</div>';
  if(!ed){
    var ult=movsMes(cM).filter(function(g){return g.tipo!=='empresa';}).sort(function(a,b){return String(b.fecha||'').localeCompare(String(a.fecha||''));}).slice(0,6);
    if(ult.length){
      o+='<div class="sec" style="font-size:13px">Últimos cargados en '+cM+' <span class="muted">(tocá para editar)</span></div><div class="card">';
      ult.forEach(function(g){o+=movRow(g,true);});
      o+='</div>';
    }
  }
  return o;
}
function editMov(mes,key){
  var g=(D.gastos[mes]||{})[key];if(!g)return;
  if(g.tipo==='pagotj'){editPagoTJ(mes,key);return;}
  EDIT={mes:mes,key:key};
  if(g.tipo==='empresa'){var st=(g.subtipo||'').toLowerCase();CTIPO=(st==='aporte')?'gasto':'ingreso';}
  else CTIPO=(g.tipo==='ingreso'||g.tipo==='transfer')?g.tipo:'gasto';
  TAB='cargar';render();
}
function cancelEdit(){EDIT=null;TAB='mov';render();}
function guardarMov(){
  var tipo=(document.getElementById('c-tipo')||{}).value||'gasto';
  var f=(document.getElementById('c-fecha')||{}).value;
  var m=money2num((document.getElementById('c-monto')||{}).value);
  var d=((document.getElementById('c-desc')||{}).value||'').trim();
  if(!m){alert('Poné el monto');return;}
  var mes=(f&&f.length>=7)?f.slice(0,7):cM;
  var key=DB.ref('cn_gastos/'+mes).push().key;
  var obj;
  if(tipo==='transfer'){
    var out=(document.getElementById('c-out')||{}).value||'';
    var inn=(document.getElementById('c-in')||{}).value||'';
    if(!out||!inn){alert('Elegí de qué cuenta sale y a qué cuenta entra');return;}
    if(out===inn){alert('Tienen que ser cuentas distintas');return;}
    obj={fecha:f||(mes+'-01'),tipo:'transfer',monto:m,ctaOut:out,ctaIn:inn,desc:d||'Movimiento entre cuentas'};
  } else {
    if(!d){alert('Poné el detalle (Qué)');return;}
    obj={fecha:f||(mes+'-01'),desc:d,monto:m,tipo:tipo,rubro:(document.getElementById('c-rubro')||{}).value||'',quien:(document.getElementById('c-quien')||{}).value||'',corresponde:(document.getElementById('c-corr')||{}).value||'familia',cuenta:(document.getElementById('c-cta')||{}).value||''};
    var _mon=(document.getElementById('c-moneda')||{}).value||'ars';
    if(tipo==='gasto'&&_mon==='usd')obj.moneda='usd';
  }
  if(EDIT){
    var oldMes=EDIT.mes,oldKey=EDIT.key,prev=(D.gastos[oldMes]||{})[oldKey]||{};
    if(prev._imp)obj._imp=prev._imp;if(prev._emp)obj._emp=prev._emp;
    if(mes===oldMes){
      spin(true);DB.ref('cn_gastos/'+oldMes+'/'+oldKey).set(obj,function(){spin(false);EDIT=null;TAB='mov';render();});
    } else {
      var nk=DB.ref('cn_gastos/'+mes).push().key,ups={};ups['cn_gastos/'+oldMes+'/'+oldKey]=null;ups['cn_gastos/'+mes+'/'+nk]=obj;
      spin(true);DB.ref('/').update(ups,function(){spin(false);EDIT=null;TAB='mov';render();});
    }
    return;
  }
  var cuotasN=1;
  if(tipo==='gasto'){var ce=document.getElementById('c-cuotas');if(ce)cuotasN=parseInt(ce.value)||1;}
  var esTj=obj.cuenta&&cuentaById(obj.cuenta)&&cuentaById(obj.cuenta).tipo==='tarjeta';
  if(tipo==='gasto'&&esTj&&cuotasN>1){
    var por=Math.round(obj.monto/cuotasN),resto=obj.monto-por*cuotasN,ups={};
    for(var c=0;c<cuotasN;c++){
      var fc=_addMeses(obj.fecha,c),mesc=fc.slice(0,7),monto=por+(c===cuotasN-1?resto:0);
      var o=Object.assign({},obj);o.fecha=fc;o.monto=monto;o.desc=obj.desc+' ('+(c+1)+'/'+cuotasN+')';o.cuotaN=c+1;o.cuotasTot=cuotasN;
      ups['cn_gastos/'+mesc+'/'+DB.ref('cn_gastos/'+mesc).push().key]=o;
    }
    spin(true);DB.ref('/').update(ups,function(){spin(false);['c-desc','c-monto'].forEach(function(id){var e=document.getElementById(id);if(e)e.value='';});render();});
    return;
  }
  spin(true);DB.ref('cn_gastos/'+mes+'/'+key).set(obj,function(){spin(false);
    ['c-desc','c-monto'].forEach(function(id){var e=document.getElementById(id);if(e)e.value='';});
    var e=document.getElementById('c-desc');if(e)e.focus();
    render();
  });
}
function _addMeses(fecha,n){var d=new Date(fecha+'T00:00:00');if(isNaN(d.getTime()))return fecha;d.setMonth(d.getMonth()+n);return d.toISOString().split('T')[0];}

function delMov(mes,key){if(!confirm('Borrar este movimiento?'))return;fbRm('cn_gastos/'+mes+'/'+key);}

// Fila de un movimiento
function movRow(g,showDel){
  var mesK=cM;
  var clk=(g.tipo==='gasto'||g.tipo==='ingreso'||!g.tipo||g.tipo==='transfer')?' onclick="editMov(\''+mesK+'\',\''+g._k+'\')" style="cursor:pointer"':'';
  var trash=showDel?'<button class="btn dz sm" style="margin-left:8px" onclick="event.stopPropagation();delMov(\''+mesK+'\',\''+g._k+'\')">🗑</button>':'';
  if(g.tipo==='transfer'){
    var no=g.ctaOut&&cuentaById(g.ctaOut)?cuentaById(g.ctaOut).nombre:'?';
    var ni=g.ctaIn&&cuentaById(g.ctaIn)?cuentaById(g.ctaIn).nombre:'?';
    return '<div class="row"'+clk+'><div style="flex:1"><div style="font-weight:600">🔄 '+esc(no)+' → '+esc(ni)+'</div><div class="muted">'+esc(String(g.fecha||'').slice(5))+(g.desc&&g.desc!=='Movimiento entre cuentas'?' · '+esc(g.desc):'')+'</div></div><div style="text-align:right;font-weight:700;color:#93C5FD">'+p$(g.monto)+'</div>'+trash+'</div>';
  }
  if(g.tipo==='ajuste'){
    var cnj=g.cuenta&&cuentaById(g.cuenta)?cuentaById(g.cuenta).nombre:'';
    var posj=(+g.monto||0)>=0;
    return '<div class="row"><div style="flex:1"><div style="font-weight:600">⚖ Ajuste conciliatorio</div><div class="muted">'+esc(String(g.fecha||'').slice(5))+(cnj?' · '+esc(cnj):'')+'</div></div><div style="text-align:right;font-weight:700;color:'+(posj?'#10B981':'#EF4444')+'">'+(posj?'+':'−')+p$(Math.abs(g.monto))+'</div>'+trash+'</div>';
  }
  if(g.tipo==='pagotj'){
    var tn=g.tjCta&&cuentaById(g.tjCta)?cuentaById(g.tjCta).nombre:'Tarjeta';
    var cn=g.cuenta&&cuentaById(g.cuenta)?cuentaById(g.cuenta).nombre:'';
    return '<div class="row" onclick="editPagoTJ(\''+mesK+'\',\''+g._k+'\')" style="cursor:pointer"><div style="flex:1"><div style="font-weight:600">💳✅ Pago resumen '+esc(tn)+'</div><div class="muted">'+esc(String(g.fecha||'').slice(5))+(cn?' · sale de '+esc(cn):'')+' · tocá para editar</div></div><div style="text-align:right;font-weight:700">'+p$(g.monto)+'</div>'+trash+'</div>';
  }
  var ing=g.tipo==='ingreso';
  var ctaN=g.cuenta&&cuentaById(g.cuenta)?cuentaById(g.cuenta).nombre:'';
  var tj=g.cuenta&&cuentaById(g.cuenta)&&cuentaById(g.cuenta).tipo==='tarjeta';
  return '<div class="row"'+clk+'><div style="flex:1"><div style="font-weight:600">'+(ing?'🟢 ':'')+esc(g.desc||'')+(g.rubro?' <span class="pill">'+esc(g.rubro)+'</span>':'')+(tj?' <span class="pill tj">💳</span>':'')+(g.moneda==='usd'?' <span class="pill" style="background:#0EA5E922;color:#38BDF8">USD</span>':'')+'</div><div class="muted">'+esc(String(g.fecha||'').slice(5))+(g.quien?' · hizo '+persLbl(g.quien):'')+' · '+persLbl(g.corresponde)+(ctaN?' · '+esc(ctaN):'')+'</div></div><div style="text-align:right;font-weight:700;color:'+(ing?'#10B981':'#EF4444')+'">'+(ing?'+':'−')+(g.moneda==='usd'?pUsd(g.monto):p$(g.monto))+'</div>'+trash+'</div>';
}

// ── MOVIMIENTOS (lista + saldos) ───────────────────────────────────────────
function netMes(ck,mes){
  var g=(D.gastos&&D.gastos[mes])?D.gastos[mes]:{},n=0;
  Object.keys(g).forEach(function(k){var x=g[k],m=Math.round(+x.monto||0);
    if(x.tipo==='ajuste'){if(x.cuenta===ck)n+=m;return;}
    if(x.tipo==='transfer'){if(x.ctaOut===ck)n-=m;if(x.ctaIn===ck)n+=m;return;}
    if(x.tipo==='empresa')return;
    if(x.cuenta!==ck)return;
    n+=(x.tipo==='ingreso'?m:-m);
  });
  return n;
}
function prevMes(mes){var y=+mes.slice(0,4),m=+mes.slice(5,7)-1;if(m<1){m=12;y--;}return y+'-'+String(m).padStart(2,'0');}
function saldoCajaHasta(ck,mes){
  var s=Number((D.cuentas[ck]||{}).saldoIni||0);
  Object.keys(D.gastos||{}).forEach(function(m){if(m<=mes)s+=netMes(ck,m);});
  return s;
}
function saldoCaja(ck){return saldoCajaHasta(ck,cM);}

function fijarInicio(ck){
  var el=document.getElementById('ini-'+ck);if(!el||String(el.value).trim()===''){alert('Escribí el saldo inicial');return;}

}

// ── TARJETAS (por cierre + conciliación) ───────────────────────────────────
function deudaTarjeta(tk){
  var d=Number((D.cuentas[tk]||{}).deudaIni||0);
  Object.keys(D.gastos||{}).forEach(function(mes){var g=D.gastos[mes]||{};Object.keys(g).forEach(function(k){var x=g[k];
    if(x.cuenta===tk&&(x.tipo==='gasto'||!x.tipo)&&x.moneda!=='usd')d+=Math.round(+x.monto||0);
    if(x.tipo==='pagotj'&&x.tjCta===tk&&x.moneda!=='usd')d-=Math.round(+x.monto||0);
  });});
  return d;
}
function deudaTarjetaUsd(tk){
  var d=Number((D.cuentas[tk]||{}).deudaIniUsd||0);
  Object.keys(D.gastos||{}).forEach(function(mes){var g=D.gastos[mes]||{};Object.keys(g).forEach(function(k){var x=g[k];
    if(x.cuenta===tk&&(x.tipo==='gasto'||!x.tipo)&&x.moneda==='usd')d+=Math.round(+x.monto||0);
    if(x.tipo==='pagotj'&&x.tjCta===tk&&x.moneda==='usd')d-=Math.round(+x.monto||0);
  });});
  return d;
}
function pUsd(n){n=Math.round(+n||0);return (n<0?'−US$':'US$')+Math.abs(n).toLocaleString('es-AR');}
function faltaItemizar(tk){
  var pag=0,comp=Number((D.cuentas[tk]||{}).deudaIni||0);
  Object.keys(D.gastos||{}).forEach(function(mes){var g=D.gastos[mes]||{};Object.keys(g).forEach(function(k){var x=g[k];
    if(x.moneda==='usd')return;
    if(x.cuenta===tk&&(x.tipo==='gasto'||!x.tipo))comp+=Math.round(+x.monto||0);
    if(x.tipo==='pagotj'&&x.tjCta===tk)pag+=Math.round(+x.monto||0);
  });});
  return Math.max(0,pag-comp);
}
function comprasTarjeta(tk){
  var out=[];
  Object.keys(D.gastos||{}).forEach(function(mes){var g=D.gastos[mes]||{};Object.keys(g).forEach(function(k){var x=g[k];if(x.cuenta===tk&&(x.tipo==='gasto'||!x.tipo)){x=Object.assign({},x);x._k=k;x._mes=mes;out.push(x);}});});
  Object.keys(D.gastos||{}).forEach(function(mes){var g=D.gastos[mes]||{};Object.keys(g).forEach(function(k){var x=g[k];if(x.tipo==='pagotj'&&x.tjCta===tk){x=Object.assign({},x);x._k=k;x._mes=mes;out.push(x);}});});
  out.sort(function(a,b){return String(a.fecha||'').localeCompare(String(b.fecha||''));});
  return out;
}

function registradoTJ(tk,cierre){
  var comp=Number((D.cuentas[tk]||{}).deudaIni||0),pag=0;
  Object.keys(D.gastos||{}).forEach(function(mes){var g=D.gastos[mes]||{};Object.keys(g).forEach(function(k){var x=g[k];
    if(x.cuenta===tk&&(x.tipo==='gasto'||!x.tipo)&&x.moneda!=='usd'){if((x.fecha||'')<=cierre)comp+=Math.round(+x.monto||0);}
    if(x.tipo==='pagotj'&&x.tjCta===tk&&x.moneda!=='usd')pag+=Math.round(+x.monto||0);
  });});
  return comp-pag;
}
function editPagoTJ(mes,key){var g=(D.gastos[mes]||{})[key];if(!g||g.tipo!=='pagotj')return;EDITTJ={mes:mes,key:key,pagoid:g._pagoid||null,oldMonto:Math.round(+g.monto||0)};PAGOTJ=g.tjCta;TAB='tj';render();}
function cancelarPagoTJ(){EDITTJ=null;PAGOTJ='';render();}
function pagarTJ(tk){
  var cierre=(document.getElementById('tj-cierre')||{}).value;
  var f=(document.getElementById('tj-fecha')||{}).value;
  var m=money2num((document.getElementById('tj-monto')||{}).value);
  var caja=(document.getElementById('tj-caja')||{}).value||'';
  if(!cierre){alert('Poné la fecha de cierre del resumen');return;}
  if(!m){alert('Poné el monto pagado');return;}
  if(!caja){alert('Elegí de qué caja sale');return;}
  var editing=!!(EDITTJ&&(D.gastos[EDITTJ.mes]||{})[EDITTJ.key]&&D.gastos[EDITTJ.mes][EDITTJ.key].tjCta===tk);
  var reg=registradoTJ(tk,cierre);if(editing)reg+=EDITTJ.oldMonto;
  var dif=m-reg;
  var mes=(f&&f.length>=7)?f.slice(0,7):cM;
  var tname=cuentaById(tk)?cuentaById(tk).nombre:'Tarjeta';
  var pagoid=(editing&&EDITTJ.pagoid)?EDITTJ.pagoid:('tj'+Date.now()+Math.floor(Math.random()*1000));
  var ups={};
  var pagoRec={fecha:f||(mes+'-01'),tipo:'pagotj',monto:m,cuenta:caja,tjCta:tk,cierre:cierre,desc:'Pago resumen '+tname+' (cierre '+cierre+')',_pagoid:pagoid};
  if(editing){
    if(EDITTJ.mes!==mes){ups['cn_gastos/'+EDITTJ.mes+'/'+EDITTJ.key]=null;ups['cn_gastos/'+mes+'/'+DB.ref('cn_gastos/'+mes).push().key]=pagoRec;}
    else ups['cn_gastos/'+mes+'/'+EDITTJ.key]=pagoRec;
    Object.keys(D.gastos||{}).forEach(function(mm){var gg=D.gastos[mm]||{};Object.keys(gg).forEach(function(kk){if(gg[kk].tipo==='gasto'&&gg[kk]._pagoid===pagoid)ups['cn_gastos/'+mm+'/'+kk]=null;});});
  } else {
    ups['cn_gastos/'+mes+'/'+DB.ref('cn_gastos/'+mes).push().key]=pagoRec;
  }
  var msg='Resumen al '+cierre+':\nRegistrado (compras/cuotas hasta esa fecha, menos pagos previos): '+p$(reg)+'\nPagaste: '+p$(m);
  if(dif>0){
    msg+='\n\nPagaste '+p$(dif)+' más de lo que tenés detallado. Esos gastos los vas cargando cuando te llegue el resumen: mirá "⚠ Falta detallar" en la tarjeta. A medida que los cargás, ese número baja solo.';
  } else if(dif<0){
    msg+='\n\nPagaste '+p$(-dif)+' menos que lo registrado: queda esa deuda pendiente.';
  } else {
    msg+='\n\nCerró justo.';
  }
  alert(msg);
  spin(true);DB.ref('/').update(ups,function(){spin(false);PAGOTJ='';EDITTJ=null;render();});
}

function vResumen(){
  var o='<div class="sec">Resumen — '+cM+'</div>'+selMes();

  if(!gs.length) return o+'<div class="card"><div class="empty">No hay gastos en '+cM+'.</div></div>';
  var corr={},rub={},quien={},caja={},retiro={loli:0,hugo:0},total=0;
  gs.forEach(function(g){var m=Math.round(+g.monto||0);total+=m;
    var c=g.corresponde||'familia';corr[c]=(corr[c]||0)+m;
    var r=g.rubro||'(sin rubro)';rub[r]=(rub[r]||0)+m;
    var q=g.quien||'(sin dato)';quien[q]=(quien[q]||0)+m;
    var ck=g.cuenta,cta2=ck&&cuentaById(ck)?cuentaById(ck):null,nm=cta2?cta2.nombre:'(sin cuenta)';caja[nm]=(caja[nm]||0)+m;
    if(cta2&&cta2.tipo==='empresa'){var qz=(g.quien||'').toLowerCase();
      if(qz==='loli')retiro.loli+=m;else if(qz==='hugo')retiro.hugo+=m;
      else if(c==='loli')retiro.loli+=m;else if(c==='hugo')retiro.hugo+=m;
      else{retiro.loli+=m/2;retiro.hugo+=m/2;}}
  });
  // Pagos de TJ hechos con plata de la empresa = retiro
  movsMes(cM).forEach(function(g){if(g.tipo!=='pagotj')return;var ct=g.cuenta&&cuentaById(g.cuenta)?cuentaById(g.cuenta):null;if(!ct||ct.tipo!=='empresa')return;var m=Math.round(+g.monto||0);var d=(ct.dueno||'').toLowerCase();if(d==='loli')retiro.loli+=m;else if(d==='hugo')retiro.hugo+=m;else{retiro.loli+=m/2;retiro.hugo+=m/2;}});
  function gastosDeResumen(dim,key){
    var gg=movsMes(cM).filter(function(g){return g.tipo!=='ingreso'&&g.tipo!=='transfer'&&g.tipo!=='pagotj'&&g.tipo!=='empresa'&&g.tipo!=='ajuste'&&g.moneda!=='usd'&&g.rubro!=='Diferencia tarjeta';});
    if(dim==='retiro'){
      var out=[];

        var qz=(g.quien||'').toLowerCase(),c=(g.corresponde||'familia');
        var adj=(qz==='loli'||qz==='hugo')?qz:((c==='loli'||c==='hugo')?c:'familia');
        if(adj===key||adj==='familia')out.push(g);});
      movsMes(cM).forEach(function(g){if(g.tipo!=='pagotj')return;var ct=g.cuenta&&cuentaById(g.cuenta)?cuentaById(g.cuenta):null;if(!ct||ct.tipo!=='empresa')return;var d=(ct.dueno||'').toLowerCase();if(d===key||(d!=='loli'&&d!=='hugo'))out.push(g);});

      }
    });return x+'</table></div>';}

  if(retiro.loli||retiro.hugo)o+=tabla('🏢 Retirado de la empresa',{loli:retiro.loli,hugo:retiro.hugo},persLbl,'retiro');

function splitW(who,pct,amt){if(who==='loli')return{l:amt,h:0};if(who==='hugo')return{l:0,h:amt};var p=(+pct||50)/100;return{l:amt*p,h:amt*(1-p)};}

function vCapital(){
  var ahoList=arr(D.aho),cfgA=D.cfgAho||{};
  var stockL=+cfgA.stock_usd_loli||0,stockH=+cfgA.stock_usd_hugo||0,stockSplit=(stockL>0||stockH>0);
  var stock=stockSplit?(stockL+stockH):(cfgA.stock_usd?+cfgA.stock_usd:0),stockFecha=cfgA.stock_fecha||'';
  function ahoOwner(a){return (D.ahoWho||{})[a._k]||'shared';}
  var comprasPost=0,comprasL=0,comprasH=0;
  ahoList.forEach(function(a){if(stock>0&&stockFecha&&(a.fecha||'')<=stockFecha)return;var u=+a.usd||0;comprasPost+=u;var s=splitW(ahoOwner(a),50,u);comprasL+=s.l;comprasH+=s.h;});
  var usdGP=stock+comprasPost;
  var invList=arr(D.inv).filter(function(i){return !i.vendido;});
  function invOwner(i){return (D.invWho||{})[i._k]||'shared';}
  var invGP=0,invL=0,invH=0;invList.forEach(function(i){var u=+i.usd||0;invGP+=u;var s=splitW(invOwner(i),50,u);invL+=s.l;invH+=s.h;});
  var capAct=arr(D.capOld).filter(function(c){return !c.vendido;});
  var capUSD=0,capL=0,capH=0,capARS=0;capAct.forEach(function(c){var u=+c.usd||0;capUSD+=u;var s=splitW(c.who||'shared',50,u);capL+=s.l;capH+=s.h;capARS+=(+c.ars||0);});
  var usdMovs=arr(D.usdMovs),gastadoUSD=0,gastL=0,gastH=0;usdMovs.forEach(function(m){if(stockFecha&&(m.fec||'')<=stockFecha)return;var u=+m.usd||0;gastadoUSD+=u;var s=splitW(m.who||'shared',50,u);gastL+=s.l;gastH+=s.h;});
  var teoricoUSD=usdGP-gastadoUSD;
  var conteoUSD=(cfgA.conteo_usd!=null&&cfgA.conteo_usd!=='')?+cfgA.conteo_usd:null;
  var conteoFecha=cfgA.conteo_fecha||'';
  var difUSD=(conteoUSD!=null)?(conteoUSD-teoricoUSD):null;
  var totalUSD=usdGP+invGP+capUSD-gastadoUSD;
  var totL=(stockSplit?stockL:0)+comprasL+invL+capL-gastL,totH=(stockSplit?stockH:0)+comprasH+invH+capH-gastH,sinAsig=stockSplit?0:stock;
  var o='<div class="sec">Capital</div>';
  o+='<div class="card" style="text-align:center"><div class="muted">Capital total</div><div style="font-size:26px;font-weight:800;color:#22D3EE">'+pU(totalUSD)+'</div>';
  o+='<div style="display:flex;justify-content:center;gap:16px;margin-top:6px;font-size:13px;flex-wrap:wrap"><span style="color:#C4B5FD">💜 Loli <b>'+pU(totL)+'</b></span><span style="color:#93C5FD">💙 Hugo <b>'+pU(totH)+'</b></span>'+(sinAsig>0?'<span style="color:#F59E0B">⚪ sin repartir <b>'+pU(sinAsig)+'</b></span>':'')+'</div>'+(capARS>0?'<div class="muted" style="margin-top:6px">+ '+p$(capARS)+' en pesos</div>':'')+'</div>';
  o+='<div class="sec">💵 Dólares GP ('+pU(usdGP)+')</div><div class="card">';
  if(stock>0){o+='<div class="row"><span style="flex:1;font-weight:700">Stock declarado'+(stockFecha?' al '+esc(stockFecha):'')+'</span><span style="color:#22D3EE;font-weight:700">'+pU(stock)+'</span><button class="btn g sm" onclick="capStockCfg()">✏</button></div>';o+=stockSplit?'<div class="muted">💜 Loli '+pU(stockL)+' · 💙 Hugo '+pU(stockH)+'</div>':'<div class="sub" style="color:#F59E0B">Stock sin repartir: tocá ✏.</div>';}
  else o+='<div class="sub" style="color:#64748B">Sin stock declarado. <button class="btn g sm" onclick="capStockCfg()">Declarar stock</button></div>';
  o+='<div class="row" style="margin-top:4px"><span style="flex:1;font-weight:700">Deberías tener hoy</span><span style="color:#22D3EE;font-weight:800;font-size:16px">'+pU(teoricoUSD)+'</span></div>';
  o+='<div class="muted" style="margin-top:-4px">comprado '+pU(usdGP)+' − movido '+pU(gastadoUSD)+'</div>';
  var _nHist=ahoList.filter(function(a){return stockFecha&&(a.fecha||'')<=stockFecha;}).length+usdMovs.filter(function(m){return stockFecha&&(m.fec||'')<=stockFecha;}).length;
  o+='<div style="margin:8px 0"><button class="btn ok sm" onclick="cerrarDolares()">🔒 Cerrar mes de dólares</button>'+(_nHist?' <button class="btn g sm" onclick="SHOWHIST=!SHOWHIST;render()">'+(SHOWHIST?'ocultar':'ver')+' histórico ('+_nHist+')</button>':'')+'</div>';
  if(ahoList.length)ahoList.sort(function(a,b){return (a.fecha||'').localeCompare(b.fecha||'');}).forEach(function(a){var inc=stockFecha&&(a.fecha||'')<=stockFecha;if(inc&&!SHOWHIST)return;o+='<div class="row" style="'+(inc?'opacity:.5;':'')+'font-size:12px"><span style="color:#64748B;min-width:74px">'+esc(a.fecha||'')+'</span><span style="flex:1;color:#22D3EE">'+pU(+a.usd||0)+'</span>'+(inc?'<span class="muted">incluida</span>':'<span style="'+wTag(ahoOwner(a))+'" onclick="capCycleAho(\''+a._k+'\')">'+wLbl(ahoOwner(a))+'</span>')+'</div>';});
  else o+='<div class="muted">Sin compras en GP.</div>';
  o+='</div>';
  o+='<div class="card"><div style="font-weight:700;margin-bottom:6px">🔎 Verificar (arqueo)</div>';
  o+='<div class="sub">Deberías tener: <b style="color:#22D3EE">'+pU(teoricoUSD)+'</b></div>';
  o+='<div class="g2" style="margin-top:8px"><div><label>Contaste (real)</label><input id="conteo-usd" inputmode="numeric" data-money="1" value="'+(conteoUSD!=null?Math.abs(conteoUSD).toLocaleString('es-AR'):'')+'" placeholder="0"/></div><div style="display:flex;align-items:flex-end"><button class="btn sm" style="width:100%" onclick="guardarConteoUsd()">Guardar conteo</button></div></div>';
  if(conteoUSD!=null){var okC=difUSD===0;o+='<div style="margin-top:8px;padding:8px;border-radius:8px;background:'+(okC?'#065F4633':(difUSD<0?'#7F1D1D33':'#78350F33'))+'"><b style="color:'+(okC?'#10B981':(difUSD<0?'#FCA5A5':'#FBBF24'))+'">'+(okC?'✅ Cuadra':(difUSD<0?'⚠ Falta '+pU(-difUSD):'⚠ Sobra '+pU(difUSD)))+'</b>'+(conteoFecha?'<div class="muted" style="margin-top:2px">último conteo: '+esc(conteoFecha)+'</div>':'')+'</div>';}
  o+='</div>';
  if(invList.length){o+='<div class="sec">🏗 Inversiones GP ('+pU(invGP)+')</div><div class="card">';invList.forEach(function(i){var ow=invOwner(i);o+='<div class="row"><span style="flex:1">'+esc(i.desc||'')+(i.fecha?' <span class="muted">'+esc(i.fecha)+'</span>':'')+'</span><span style="color:#F59E0B;font-weight:700;margin-right:6px">'+pU(+i.usd||0)+'</span><span style="'+wTag(ow)+'" onclick="capCycleInv(\''+i._k+'\')">'+wLbl(ow)+'</span></div>';});o+='</div>';}
  if(usdMovs.length){o+='<div class="sec">Movimientos en dólares (−'+pU(gastadoUSD)+')</div><div class="card">';usdMovs.sort(function(a,b){return (a.fec||'').localeCompare(b.fec||'');}).forEach(function(m){if(stockFecha&&(m.fec||'')<=stockFecha&&!SHOWHIST)return;var v=m.tipo==='venta';var neg=(+m.usd||0)<0;o+='<div class="row" style="font-size:12px'+(stockFecha&&(m.fec||'')<=stockFecha?';opacity:.5':'')+'"><div style="flex:1"><div>'+esc(m.desc||'')+'</div><div class="muted">'+esc(m.fec||'')+' · '+wLbl(m.who)+'</div></div><div style="text-align:right"><div style="color:'+(neg?'#10B981':'#EF4444')+'">'+(neg?'+':'−')+pU(Math.abs(+m.usd||0))+'</div>'+(v&&m.ars?'<div style="color:#10B981;font-size:11px">+'+p$(+m.ars)+'</div>':'')+'</div><button class="btn bg sm" style="margin-left:4px" onclick="capEditUsd(\''+m._k+'\')">✏</button><button class="btn dz sm" style="margin-left:4px" onclick="capDelUsd(\''+m._k+'\')">🗑</button></div>';});o+='</div>';}
  o+='<div style="display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px"><div class="sec" style="margin:0">Activos adicionales</div><div style="display:flex;gap:6px"><button class="btn g sm" onclick="capAddUsdMov()">💱 Mover USD</button><button class="btn sm" onclick="capAddActivo()">+ Agregar</button></div></div>';
  if(capAct.length){
    var grp={propiedad:[],vehiculo:[],otro:[]};
    capAct.forEach(function(c){var cl=(c.clase||'propiedad');if(!grp[cl])cl='otro';grp[cl].push(c);});
    [['propiedad','🏠 Propiedades'],['vehiculo','🚗 Vehículos'],['otro','📦 Otros']].forEach(function(gp){var lst=grp[gp[0]];if(!lst.length)return;
      o+='<div style="font-weight:700;color:#94A3B8;margin:8px 0 4px;font-size:13px">'+gp[1]+'</div>';
      lst.forEach(function(c){o+='<div class="card" style="padding:10px"><div class="row" style="border:none;padding:0"><div style="flex:1"><div style="font-weight:600">'+esc(c.desc||'')+'</div><div class="muted">'+wLbl(c.who||'shared')+(c.fecha?' · '+esc(c.fecha):'')+'</div></div><div style="text-align:right"><div style="color:#22D3EE;font-weight:700">'+pU(+c.usd||0)+'</div>'+(c.ars?'<div class="muted">'+p$(+c.ars)+'</div>':'')+'</div><button class="btn ok sm" style="margin-left:4px" onclick="capVenderActivo(\''+c._k+'\')">💵 Vender</button><button class="btn bg sm" style="margin-left:4px" onclick="capEditActivo(\''+c._k+'\')">✏</button><button class="btn dz sm" style="margin-left:4px" onclick="capDelActivo(\''+c._k+'\')">🗑</button></div></div>';});
    });
  } else o+='<div class="muted" style="padding:8px 0">Sin activos adicionales.</div>';
  return o;
}
function capCycleAho(k){var c=(D.ahoWho||{})[k]||'shared';fbSet('fin_aho_who/'+k,c==='shared'?'loli':c==='loli'?'hugo':'shared');}
function capCycleInv(k){var c=(D.invWho||{})[k]||'shared';fbSet('fin_inv_who/'+k,c==='shared'?'loli':c==='loli'?'hugo':'shared');}
function _finMes(mes){var y=parseInt(mes.slice(0,4)),m=parseInt(mes.slice(5,7));return mes+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0');}
function computeStockDol(upto){
  var c=D.cfgAho||{},sL=+c.stock_usd_loli||0,sH=+c.stock_usd_hugo||0,sF=c.stock_fecha||'';
  var nL=sL,nH=sH;
  arr(D.aho).forEach(function(a){var f=a.fecha||'';if(sF&&f<=sF)return;if(f>upto)return;var s=splitW((D.ahoWho||{})[a._k]||'shared',50,+a.usd||0);nL+=s.l;nH+=s.h;});
  arr(D.usdMovs).forEach(function(m){var f=m.fec||'';if(sF&&f<=sF)return;if(f>upto)return;var s=splitW(m.who||'shared',50,+m.usd||0);nL-=s.l;nH-=s.h;});
  return {l:Math.round(nL),h:Math.round(nH)};
}
function cerrarDolares(){
  var f=prompt('Fecha de cierre de dólares (AAAA-MM-DD).\nLas compras y gastos hasta esa fecha quedan absorbidos en el stock y se pliega el detalle:',_finMes(cM));
  if(f===null)return;f=String(f).trim();if(!/^\d{4}-\d{2}-\d{2}$/.test(f)){alert('Fecha inválida (AAAA-MM-DD)');return;}
  var r=computeStockDol(f);
  if(!confirm('Cerrar dólares al '+f+'?\n\nNuevo stock:\n💜 Loli '+pU(r.l)+'\n💙 Hugo '+pU(r.h)+'\n\nEl detalle anterior se pliega (podés verlo con "ver histórico").'))return;
  var ups={};ups['cfg_aho/stock_usd_loli']=r.l;ups['cfg_aho/stock_usd_hugo']=r.h;ups['cfg_aho/stock_fecha']=f;ups['cfg_aho/stock_usd']=r.l+r.h;
  spin(true);DB.ref('/').update(ups,function(){spin(false);SHOWHIST=false;render();});
}
function capStockCfg(){var c=D.cfgAho||{};var l=prompt('Stock U$S de LOLI:',c.stock_usd_loli!=null?c.stock_usd_loli:'');if(l===null)return;l=Number(String(l).replace(/[^0-9.]/g,''));if(isNaN(l)||l<0){alert('Inválido');return;}var h=prompt('Stock U$S de HUGO:',c.stock_usd_hugo!=null?c.stock_usd_hugo:'');if(h===null)return;h=Number(String(h).replace(/[^0-9.]/g,''));if(isNaN(h)||h<0){alert('Inválido');return;}var f=prompt('Fecha del stock (AAAA-MM-DD):',c.stock_fecha||new Date().toISOString().split('T')[0]);if(f===null)return;f=String(f).trim();if(!/^\d{4}-\d{2}-\d{2}$/.test(f)){alert('Fecha inválida');return;}var ups={};ups['cfg_aho/stock_usd_loli']=l;ups['cfg_aho/stock_usd_hugo']=h;ups['cfg_aho/stock_fecha']=f;ups['cfg_aho/stock_usd']=l+h;spin(true);DB.ref('/').update(ups,function(){spin(false);});}
function capAddActivo(){
  var cl=(prompt('Tipo de bien (propiedad/vehiculo/otro):','propiedad')||'propiedad').trim().toLowerCase();if(['propiedad','vehiculo','otro'].indexOf(cl)<0)cl='otro';
  var d=prompt('Descripción:');if(!d)return;
  var usd=Number(String(prompt('U$S (0 si no):','0')||'0').replace(/[^0-9.]/g,''))||0;
  var ars=Number(String(prompt('Pesos $ (0 si no):','0')||'0').replace(/[^0-9.]/g,''))||0;
  var w=(prompt('De quién (loli/hugo/shared):','shared')||'shared').trim().toLowerCase();if(['loli','hugo','shared'].indexOf(w)<0)w='shared';
  var fecha=new Date().toISOString().split('T')[0];
  var deDolares=false;
  if(usd>0)deDolares=/^s/i.test((prompt('¿Salió de tus dólares en efectivo (Dólares GP)? (si/no):','si')||'').trim());
  var actKey=DB.ref('fin_capital').push().key;
  var actObj={desc:d.trim(),clase:cl,tipo:usd?'usd':'otro',usd:usd,ars:ars,fecha:fecha,who:w,obs:'',vendido:false};
  var ups={};
  if(deDolares){var movKey=DB.ref('fin_usdMovs').push().key;actObj._linkUsd=movKey;ups['fin_usdMovs/'+movKey]={desc:'Compra: '+d.trim(),tipo:'gasto',usd:usd,ars:0,fec:fecha,who:w,_linkActivo:actKey};}
  ups['fin_capital/'+actKey]=actObj;
  spin(true);DB.ref('/').update(ups,function(){spin(false);render();});
}
function capEditActivo(k){
  var c=(D.capOld||{})[k];if(!c)return;
  var cl=(prompt('Tipo (propiedad/vehiculo/otro):',c.clase||'propiedad')||'propiedad').trim().toLowerCase();if(['propiedad','vehiculo','otro'].indexOf(cl)<0)cl='otro';
  var d=prompt('Descripción:',c.desc||'');if(d===null)return;
  var usd=Number(String(prompt('U$S (0 si no):',c.usd||0)||'0').replace(/[^0-9.]/g,''))||0;
  var ars=Number(String(prompt('Pesos $ (0 si no):',c.ars||0)||'0').replace(/[^0-9.]/g,''))||0;
  var w=(prompt('De quién (loli/hugo/shared):',c.who||'shared')||'shared').trim().toLowerCase();if(['loli','hugo','shared'].indexOf(w)<0)w='shared';
  var o2=Object.assign({},c);delete o2._k;o2.desc=d.trim();o2.clase=cl;o2.usd=usd;o2.ars=ars;o2.tipo=usd?'usd':'otro';o2.who=w;
  var ups={};ups['fin_capital/'+k]=o2;
  if(c._linkUsd){
    if(usd>0){var oldMov=(D.usdMovs||{})[c._linkUsd]||{};ups['fin_usdMovs/'+c._linkUsd]={desc:'Compra: '+d.trim(),tipo:'gasto',usd:usd,ars:0,fec:oldMov.fec||o2.fecha,who:w,_linkActivo:k};}
    else if(confirm('El activo ya no tiene valor en USD. ¿Borrar el movimiento en dólares vinculado?'))ups['fin_usdMovs/'+c._linkUsd]=null;
  }
  spin(true);DB.ref('/').update(ups,function(){spin(false);render();});
}
function capDelActivo(k){
  var c=(D.capOld||{})[k];
  var msg=(c&&c._linkUsd)?('Borrar activo?\nTambién se borra el movimiento en dólares vinculado ('+pU(c.usd||0)+').'):'Borrar activo?';
  if(!confirm(msg))return;
  var ups={};ups['fin_capital/'+k]=null;if(c&&c._linkUsd)ups['fin_usdMovs/'+c._linkUsd]=null;
  spin(true);DB.ref('/').update(ups,function(){spin(false);render();});
}
function capVenderActivo(k){
  var c=(D.capOld||{})[k];if(!c)return;
  var monS=(prompt('¿La venta fue en dólares o en pesos? (usd/pesos):','usd')||'usd').trim().toLowerCase();
  var esUsd=monS!=='pesos';
  var valorReg=esUsd?Number(c.usd||0):Number(c.ars||0);
  var precio=Number(String(prompt('Precio de venta ('+(esUsd?'U$S':'$')+'):',valorReg||0)||'0').replace(/[^0-9.]/g,''))||0;
  if(!precio){alert('Falta el precio de venta');return;}
  var resultado=precio-valorReg;
  var destCaja=null;
  if(!esUsd){
    var dn=(prompt('¿A qué caja entró la plata? Escribí el nombre (ej. Ef. Loli):','')||'').trim();
    destCaja=cuentasCaja().filter(function(x){return x.nombre.toLowerCase().indexOf(dn.toLowerCase())>=0;})[0];
    if(!dn||!destCaja){alert('No encontré esa caja. Cancelado.');return;}
  }
  var f=(prompt('Fecha de la venta (AAAA-MM-DD):',new Date().toISOString().split('T')[0])||'').trim();if(!f)return;
  var resTxt=(resultado>=0?'GANANCIA ':'PÉRDIDA ')+(esUsd?pUsd(Math.abs(resultado)):p$(Math.abs(resultado)));
  if(!confirm('Vender "'+(c.desc||'')+'" por '+(esUsd?pUsd(precio):p$(precio))+'?\n\nValor registrado: '+(esUsd?pUsd(valorReg):p$(valorReg))+'\nResultado: '+resTxt+'\n\nLa plata entra en: '+(esUsd?'stock de dólares':destCaja.nombre)+'\nEl activo sale del patrimonio.'))return;
  var ups={};
  var resNota=' (resultado '+(resultado>=0?'+':'−')+(esUsd?pUsd(Math.abs(resultado)):p$(Math.abs(resultado)))+')';
  if(esUsd){
    ups['fin_usdMovs/'+DB.ref('fin_usdMovs').push().key]={desc:'Venta '+(c.desc||'')+resNota,tipo:'venta',usd:-precio,ars:0,fec:f,who:c.who||'shared'};
  } else {
    var mesV=f.slice(0,7);
    ups['cn_gastos/'+mesV+'/'+DB.ref('cn_gastos/'+mesV).push().key]={fecha:f,tipo:'ingreso',desc:'Venta '+(c.desc||'')+resNota,monto:precio,cuenta:destCaja._k,rubro:'Venta de bien',quien:'',corresponde:(c.who==='loli'||c.who==='hugo')?c.who:'familia'};
  }
  ups['fin_capital/'+k]=null;
  spin(true);DB.ref('/').update(ups,function(){spin(false);alert('✅ Vendido. '+resTxt+'.\nLa plata entró en '+(esUsd?'dólares':destCaja.nombre)+' y el activo salió del patrimonio.');render();});
}
function capAddUsdMov(){var t=(prompt('Tipo (gasto/venta/ajuste):','gasto')||'gasto').trim().toLowerCase();if(['gasto','venta','ajuste'].indexOf(t)<0)t='gasto';var d=prompt('Descripción:'+(t==='ajuste'?' (por qué el ajuste)':''));if(!d)return;var usd=Number(String(prompt('U$S:','0')||'0').replace(/[^0-9.]/g,''))||0;if(!usd){alert('Falta el monto');return;}if(t==='ajuste'){var dir=(prompt('El ajuste ¿RESTA o SUMA dólares al stock? (resta/suma):','resta')||'resta').trim().toLowerCase();if(dir==='suma')usd=-usd;d='Ajuste: '+d;}var ars=t==='venta'?(Number(String(prompt('Pesos recibidos $:','0')||'0').replace(/[^0-9.]/g,''))||0):0;var f=prompt('Fecha (AAAA-MM-DD):',new Date().toISOString().split('T')[0]);if(!f)return;var w=(prompt('De quién (loli/hugo/shared):','shared')||'shared').trim().toLowerCase();if(['loli','hugo','shared'].indexOf(w)<0)w='shared';fbSet('fin_usdMovs/'+DB.ref('fin_usdMovs').push().key,{desc:d.trim(),tipo:t,usd:usd,ars:ars,fec:f.trim(),who:w});}
function capEditUsd(k){var m=(D.usdMovs||{})[k];if(!m)return;var d=prompt('Descripción:',m.desc||'');if(d===null)return;var usd=Number(String(prompt('U$S:',Math.abs(+m.usd||0))||'0').replace(/[^0-9.]/g,''))||0;var f=prompt('Fecha (AAAA-MM-DD):',m.fec||'');if(!f)return;var w=(prompt('De quién (loli/hugo/shared):',m.who||'shared')||'shared').trim().toLowerCase();if(['loli','hugo','shared'].indexOf(w)<0)w='shared';var usdSigned=((+m.usd||0)<0)?-usd:usd;var ars=m.ars||0;if(m.tipo==='venta')ars=Number(String(prompt('Pesos recibidos $:',m.ars||0)||'0').replace(/[^0-9.]/g,''))||0;fbSet('fin_usdMovs/'+k,{desc:d.trim(),tipo:m.tipo||'gasto',usd:usdSigned,ars:ars,fec:f.trim(),who:w});}
function capDelUsd(k){if(!confirm('Borrar movimiento?'))return;fbRm('fin_usdMovs/'+k);}
function guardarConteoUsd(){var el=document.getElementById('conteo-usd');if(!el)return;var v=money2num(el.value);var hoy=new Date().toISOString().split('T')[0];var ups={};ups['cfg_aho/conteo_usd']=v;ups['cfg_aho/conteo_fecha']=hoy;spin(true);DB.ref('/').update(ups,function(){spin(false);render();});}
</script>
