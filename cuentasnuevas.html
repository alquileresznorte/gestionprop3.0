<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Cuentas Personales</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0B1120;color:#E2E8F0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;padding-bottom:60px}
  .wrap{max-width:960px;margin:0 auto;padding:12px}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#111827;border-bottom:1px solid #1F2937;position:sticky;top:0;z-index:20}
  .brand{font-weight:800;font-size:16px;color:#A78BFA;letter-spacing:.5px}
  .nav{display:flex;gap:4px;flex-wrap:wrap;padding:8px 12px;background:#0F172A;position:sticky;top:44px;z-index:19;border-bottom:1px solid #1F2937}
  .nbtn{background:#1E293B;color:#94A3B8;border:none;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
  .nbtn.on{background:#7C3AED;color:#fff}
  .sec{font-size:16px;font-weight:800;margin:14px 0 8px;color:#E2E8F0}
  .sub{font-size:12px;color:#94A3B8;margin-bottom:8px;line-height:1.5}
  .card{background:#111827;border:1px solid #1F2937;border-radius:12px;padding:14px;margin-bottom:12px}
  .btn{background:#7C3AED;color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer}
  .btn.g{background:#334155;color:#CBD5E1}
  .btn.sm{padding:5px 10px;font-size:11px}
  .btn.dz{background:#7F1D1D;color:#FCA5A5}
  .btn.ok{background:#065F46;color:#A7F3D0}
  input,select{width:100%;background:#0F172A;border:1px solid #334155;border-radius:8px;padding:9px;color:#E2E8F0;font-size:14px}
  label{font-size:12px;color:#94A3B8;display:block;margin-bottom:4px}
  .fg{margin-bottom:10px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
  .row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #1E293B}
  .row:last-child{border-bottom:none}
  .pill{font-size:10px;background:#1E293B;color:#93C5FD;border-radius:6px;padding:2px 7px}
  .pill.tj{color:#F0ABFC}
  .muted{color:#64748B;font-size:11px}
  .empty{color:#64748B;font-size:13px;padding:16px;text-align:center}
  .ctab{width:100%;border-collapse:collapse;font-size:13px}
  .ctab th,.ctab td{padding:6px 8px;border-bottom:1px solid #1E293B;vertical-align:top}
  .spin{position:fixed;top:8px;right:8px;width:14px;height:14px;border:2px solid #7C3AED;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:none;z-index:50}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="spin" id="spin"></div>
<div class="topbar"><span class="brand">CUENTAS</span><span class="muted" id="hoy"></span></div>
<div class="nav" id="nav"></div>
<div class="wrap" id="app"><div class="empty">Cargando…</div></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:'AIzaSyDhuSP_WTWI3hqf5GqgFExkptFfpqJUn50',
  authDomain:'gestion-prop.firebaseapp.com',
  databaseURL:'https://gestion-prop-default-rtdb.firebaseio.com',
  projectId:'gestion-prop'
});
var DB=firebase.database();

// ── Estado ─ Todo va a nodos cn_* (no toca las otras apps). fin_gastos/movs solo lectura.
var D={cuentas:{},rubros:{},subrubros:{},fijos:{},reclass:{},capital:{},gastos:{},movs:{}};
var TAB='caja';
var cM='2026-07';
var CAJAVIEW='cajas'; // 'lista' | 'cajas'
var MESES=['2026-06','2026-07','2026-08'];

function spin(on){document.getElementById('spin').style.display=on?'block':'none';}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fbSet(p,v){spin(true);DB.ref(p).set(v,function(){spin(false);});}
function fbPush(p,v){spin(true);return DB.ref(p).push(v,function(){spin(false);}).key;}
function fbRm(p){spin(true);DB.ref(p).remove(function(){spin(false);});}
function arr(o){o=o||{};return Object.keys(o).map(function(k){var x=Object.assign({},o[k]);x._k=k;return x;});}
function p$(n){n=Math.round(+n||0);return '$'+n.toLocaleString('es-AR');}
function byOrden(a,b){return (a.orden||0)-(b.orden||0);}

// ── Carga ─────────────────────────────────────────────────────────────────
function bind(node,key){DB.ref(node).on('value',function(s){D[key]=s.exists()?s.val():{};render();});}
bind('cn_cuentas','cuentas');
bind('cn_rubros','rubros');
bind('cn_subrubros','subrubros');
bind('cn_fijos','fijos');
bind('cn_reclass','reclass');
bind('cn_capital','capital');
DB.ref('fin_gastos').on('value',function(s){D.gastos=s.exists()?s.val():{};if(TAB==='caja'||TAB==='resumen'||TAB==='tj')render();});
DB.ref('movs').on('value',function(s){D.movs=s.exists()?s.val():{};});
document.getElementById('hoy').textContent=new Date().toLocaleDateString('es-AR');

// ── Navegación ────────────────────────────────────────────────────────────
var TABS=[['caja','Caja'],['tj','TJ'],['capital','Capital'],['resumen','Resumen'],['config','⚙ Config']];
function go(t){TAB=t;render();}
function render(){
  var nav=document.getElementById('nav');
  nav.innerHTML=TABS.map(function(t){return '<button class="nbtn'+(TAB===t[0]?' on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>';}).join('');
  var app=document.getElementById('app');
  if(TAB==='config') app.innerHTML=vConfig();
  else if(TAB==='caja') app.innerHTML=vCaja();
  else if(TAB==='tj') app.innerHTML=vTJ();
  else if(TAB==='capital') app.innerHTML=vCapital();
  else if(TAB==='resumen') app.innerHTML=vResumen();
}

// ── Helpers de cuentas / clasificación ─────────────────────────────────────
function cuentasCaja(){return arr(D.cuentas).filter(function(c){return c.tipo==='caja';}).sort(byOrden);}
function cuentasTarj(){return arr(D.cuentas).filter(function(c){return c.tipo==='tarjeta';}).sort(byOrden);}
function cuentaById(k){return D.cuentas[k];}
function rubrosList(){return arr(D.rubros).sort(byOrden);}
function subrubrosDe(rub){return arr(D.subrubros).filter(function(s){return s.rubro===rub;}).sort(byOrden);}
function dueLbl(w){return w==='loli'?'💜 Loli':w==='hugo'?'💙 Hugo':w==='empresa'?'🏢 Empresa':'🤝 Comp.';}
function opt(v,lbl,cur){return '<option value="'+esc(v)+'"'+(String(cur)===String(v)?' selected':'')+'>'+esc(lbl)+'</option>';}

function gastosDe(mes){return (D.gastos&&D.gastos[mes])?arr(D.gastos[mes]):[];}
function gastosArs(mes){return gastosDe(mes).filter(function(g){return (g.cur||'ARS')==='ARS';}).sort(function(a,b){return String(a.fecha||'').localeCompare(String(b.fecha||''));});}
function findGasto(k){var a=gastosDe(cM).filter(function(g){return g._k===k;});return a[0]||{};}
function rc(mes,key){return (D.reclass[mes]&&D.reclass[mes][key])||{};}

function effCorresponde(g){var r=rc(cM,g._k);if(r.corresponde)return r.corresponde;if(g.cuenta_nueva==='__empresa__')return 'empresa';return g.who==='hugo'?'hugo':(g.who==='shared'?'shared':'loli');}
function effCuenta(g){return rc(cM,g._k).cuenta||'';}          // guarda el _k de cn_cuentas
function effRubro(g){var r=rc(cM,g._k);if(r.rubro!=null)return r.rubro;if(g.cuenta_nueva&&g.cuenta_nueva!=='__empresa__'&&g.cuenta_nueva!=='__descartar__')return g.cuenta_nueva;return '';}
function effSub(g){return rc(cM,g._k).subrubro||'';}
function effDescartado(g){var r=rc(cM,g._k);if(r.descartado!=null)return !!r.descartado;return g.cuenta_nueva==='__descartar__';}

// Autocompletar clasificación desde los datos viejos (medio → cuenta, who → corresponde, cuenta_nueva → rubro)
function _norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");}
function _tok(s){var t=_norm(s),o={};if(/loli/.test(t))o.p="loli";if(/hugo/.test(t))o.p="hugo";
  if(/master/.test(t))o.tipo="master";else if(/visa/.test(t))o.tipo="visa";else if(/mp/.test(t))o.tipo="mp";
  else if(/ml/.test(t))o.tipo="ml";else if(/efect/.test(t))o.tipo="ef";else if(/transf|bco|banco/.test(t))o.tipo="ml";
  return o;}
function _matchCuenta(medio){var mt=_tok(medio);if(!mt.p||!mt.tipo)return "";var cs=arr(D.cuentas);
  for(var i=0;i<cs.length;i++){var ct=_tok(cs[i].nombre);if(ct.p===mt.p&&ct.tipo===mt.tipo)return cs[i]._k;}return "";}
function autoClasificar(){
  var gs=gastosArs(cM);
  if(!gs.length){alert("No hay gastos en pesos en "+cM+".");return;}
  var ups={},nCta=0,nCorr=0,nRub=0;
  gs.forEach(function(g){
    var r=rc(cM,g._k),base="cn_reclass/"+cM+"/"+g._k+"/";
    if(!r.corresponde){var corr=g.who==='hugo'?'hugo':(g.who==='shared'?'shared':(g.who==='loli'?'loli':''));if(g.cuenta_nueva==='__empresa__')corr='empresa';if(corr){ups[base+"corresponde"]=corr;nCorr++;}}
    if(!r.cuenta){var ck=_matchCuenta(g.medio);if(ck){ups[base+"cuenta"]=ck;nCta++;}}
    if(r.rubro==null&&g.cuenta_nueva&&g.cuenta_nueva!=='__empresa__'&&g.cuenta_nueva!=='__descartar__'){ups[base+"rubro"]=g.cuenta_nueva;nRub++;}
  });
  if(!Object.keys(ups).length){alert("No encontré nada nuevo para autocompletar (o ya está todo cargado). Tip: cargá tus cuentas en Config para que pueda mapear la que pagó.");return;}
  if(!confirm("Autocompleto desde tus datos viejos (solo lo que está vacío):\n· "+nCorr+" a quién corresponde\n· "+nCta+" cuenta que pagó\n· "+nRub+" rubro\n\nDespués revisás y editás lo que quieras. ¿Dale?"))return;
  spin(true);DB.ref('/').update(ups,function(){spin(false);});
}
function setCorr(k,v){fbSet('cn_reclass/'+cM+'/'+k+'/corresponde',v);}
function setCuenta(k,v){var p='cn_reclass/'+cM+'/'+k+'/cuenta';if(v)fbSet(p,v);else fbRm(p);}
function setRubro(k,v){var p='cn_reclass/'+cM+'/'+k+'/rubro';if(v)fbSet(p,v);else fbRm(p);fbRm('cn_reclass/'+cM+'/'+k+'/subrubro');}
function setSub(k,v){var p='cn_reclass/'+cM+'/'+k+'/subrubro';if(v)fbSet(p,v);else fbRm(p);}
function toggleDesc(k){var cur=effDescartado(findGasto(k));var p='cn_reclass/'+cM+'/'+k+'/descartado';if(cur)fbRm(p);else fbSet(p,true);}
function cambiarMes(m){cM=m;render();}
function setCajaView(v){CAJAVIEW=v;render();}
function selMes(){return '<div class="fg"><label>Mes</label><select onchange="cambiarMes(this.value)">'+MESES.map(function(m){return '<option'+(m===cM?' selected':'')+'>'+m+'</option>';}).join('')+'</select></div>';}

// ── CAJA ──────────────────────────────────────────────────────────────────
function vCaja(){
  var o='<div class="sec">Caja — '+cM+'</div>'+selMes();
  var cajas=cuentasCaja();
  if(!cajas.length) o+='<div class="card"><div class="sub">⚠ Primero creá tus <b>cuentas</b> en ⚙ Config (Ef. Loli, ML Hugo, etc.). Hay un botón para cargar las sugeridas.</div></div>';
  var raw=gastosDe(cM);
  var noArs=raw.filter(function(g){return (g.cur||'ARS')!=='ARS';}).length;
  var gs=gastosArs(cM);
  var descN=gs.filter(effDescartado).length;
  var sinCta=gs.filter(function(g){return !effDescartado(g)&&!effCuenta(g);}).length;

  o+='<div class="card">';
  o+='<div style="font-weight:700;margin-bottom:2px">🛒 Gastos de '+cM+' <span class="muted">('+gs.length+' en pesos'+(sinCta?' — faltan asignar '+sinCta:'')+(descN?' · '+descN+' descartados':'')+')</span></div>';
  o+='<div class="sub" style="border-left:3px solid #334155;padding-left:8px">En <code>fin_gastos/'+cM+'</code> hay <b>'+raw.length+'</b> registros; se muestran <b>'+gs.length+'</b> en pesos.'+(noArs?' <span style="color:#FBBF24">'+noArs+' en otra moneda quedan afuera.</span>':'')+'</div>';
  o+='<button class="btn ok" style="margin:10px 0" onclick="autoClasificar()">✨ Traer y autocompletar desde mis datos viejos</button>';
  o+='<div style="display:flex;gap:6px;margin:10px 0">'+
     '<button class="nbtn'+(CAJAVIEW==='cajas'?' on':'')+'" onclick="setCajaView(\'cajas\')">Por cajas</button>'+
     '<button class="nbtn'+(CAJAVIEW==='lista'?' on':'')+'" onclick="setCajaView(\'lista\')">Lista</button></div>';
  if(!gs.length) o+='<div class="empty">No hay gastos en pesos en '+cM+'.</div>';
  else if(CAJAVIEW==='cajas') o+=renderPorCajas(gs,cajas);
  else o+=renderLista(gs);
  o+='</div>';
  return o;
}

function renderLista(gs){
  var rubros=rubrosList();
  var o='';
  gs.forEach(function(g){
    var desc=effDescartado(g),cta=effCuenta(g),corr=effCorresponde(g),rub=effRubro(g),sub=effSub(g);
    var amber=(!desc&&!cta);
    o+='<div class="row" style="flex-direction:column;align-items:stretch;gap:8px;'+(desc?'opacity:.55;':amber?'background:#78350F14;':'')+'padding:10px 0">';
    o+='<div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">';
    o+='<div><div style="font-weight:600">'+(desc?'🚫 ':amber?'⚠ ':'')+esc(g.desc||'Gasto')+' <span class="muted">'+p$(g.monto)+'</span></div>';
    o+='<div class="muted">'+esc(String(g.fecha||'').slice(5))+' · original: '+dueLbl(g.who)+(g.medio?' · '+esc(g.medio):'')+'</div></div>';
    o+='<button class="btn '+(desc?'g':'dz')+' sm" onclick="toggleDesc(\''+g._k+'\')">'+(desc?'restaurar':'🚫')+'</button>';
    o+='</div>';
    if(!desc){
      o+='<div class="g3">';
      o+='<div><label>Corresponde</label><select onchange="setCorr(\''+g._k+'\',this.value)">'+opt('loli','💜 Loli',corr)+opt('hugo','💙 Hugo',corr)+opt('shared','🤝 Comp.',corr)+opt('empresa','🏢 Empresa',corr)+'</select></div>';
      o+='<div><label>Pagó (cuenta)</label><select onchange="setCuenta(\''+g._k+'\',this.value)"><option value="">— sin asignar —</option>';
      o+='<optgroup label="Cajas">'+cuentasCaja().map(function(c){return opt(c._k,c.nombre,cta);}).join('')+'</optgroup>';
      var tj=cuentasTarj();if(tj.length)o+='<optgroup label="Tarjetas">'+tj.map(function(c){return opt(c._k,'💳 '+c.nombre,cta);}).join('')+'</optgroup>';
      o+='</select></div>';
      o+='<div><label>Rubro</label><select onchange="setRubro(\''+g._k+'\',this.value)"><option value="">— rubro —</option>'+rubros.map(function(r){return opt(r.nombre,r.nombre,rub);}).join('')+'</select></div>';
      var subs=rub?subrubrosDe(rub):[];
      if(subs.length) o+='<div><label>Subrubro</label><select onchange="setSub(\''+g._k+'\',this.value)"><option value="">— subrubro —</option>'+subs.map(function(s){return opt(s.nombre,s.nombre,sub);}).join('')+'</select></div>';
      o+='</div>';
    }
    o+='</div>';
  });
  return o;
}

function renderPorCajas(gs,cajas){
  if(!cajas.length) return '<div class="empty">Cargá tus cuentas en Config para ver las columnas.</div>';
  var vis=gs.filter(function(g){return !effDescartado(g);});
  var totals={};cajas.forEach(function(c){totals[c._k]=0;});
  var tarj=0,sinAsig=0;
  var body='';
  vis.forEach(function(g){
    var cta=effCuenta(g),m=Math.round(+g.monto||0);
    var esTarj=cta&&cuentaById(cta)&&cuentaById(cta).tipo==='tarjeta';
    var enCaja=cta&&totals.hasOwnProperty(cta);
    var amber=!cta;
    if(esTarj) tarj+=m; else if(enCaja) totals[cta]+=m; else if(!cta) sinAsig+=m;
    body+='<tr style="'+(amber?'background:#78350F22;':'')+'">';
    body+='<td class="muted" style="white-space:nowrap">'+esc(String(g.fecha||'').slice(5))+'</td>';
    body+='<td>'+(amber?'⚠ ':'')+esc(g.desc||'Gasto')+(esTarj?' <span class="pill tj">💳 '+esc(cuentaById(cta).nombre)+'</span>':'')+'</td>';
    body+='<td><select onchange="setCuenta(\''+g._k+'\',this.value)" style="min-width:120px"><option value="">s/asignar</option>';
    body+='<optgroup label="Cajas">'+cajas.map(function(c){return opt(c._k,c.nombre,cta);}).join('')+'</optgroup>';
    var tj=cuentasTarj();if(tj.length)body+='<optgroup label="Tarjetas">'+tj.map(function(c){return opt(c._k,'💳 '+c.nombre,cta);}).join('')+'</optgroup>';
    body+='</select></td>';
    cajas.forEach(function(c){body+='<td style="text-align:right">'+(cta===c._k?p$(m):'<span class="muted">—</span>')+'</td>';});
    body+='</tr>';
  });
  var head='<tr><th style="text-align:left">Fecha</th><th style="text-align:left">Detalle</th><th style="text-align:left">Cuenta</th>'+cajas.map(function(c){return '<th style="text-align:right;color:#A78BFA">'+esc(c.nombre)+'</th>';}).join('')+'</tr>';
  var tot='<tr style="font-weight:700"><td colspan="3">Total por caja</td>'+cajas.map(function(c){return '<td style="text-align:right;color:#A78BFA">'+p$(totals[c._k])+'</td>';}).join('')+'</tr>';
  var note='';
  if(sinAsig) note+='<div class="sub" style="color:#FBBF24">⚠ '+p$(sinAsig)+' sin asignar (filas en ámbar).</div>';
  if(tarj) note+='<div class="sub">💳 '+p$(tarj)+' pagado con tarjeta → va a la solapa TJ, no toca estas cajas.</div>';
  return '<div style="overflow-x:auto"><table class="ctab">'+head+body+tot+'</table></div>'+note;
}

// ── TJ (Tarjetas) ─────────────────────────────────────────────────────────
function vTJ(){
  var o='<div class="sec">Tarjetas — '+cM+'</div>'+selMes();
  var tjs=cuentasTarj();
  if(!tjs.length){o+='<div class="card"><div class="sub">No hay tarjetas cargadas. En ⚙ Config → Cuentas, agregá cuentas de tipo <b>Tarjeta</b> (MP, Visa/Master BBVA), o usá "cargar sugeridas".</div></div>';return o;}
  var gs=gastosArs(cM).filter(function(g){return !effDescartado(g);});
  o+='<div class="sub">Cada compra con tarjeta es un gasto que <b>sube la deuda</b> (no toca la caja). El pago del resumen —que baja la deuda desde una caja— lo armamos en el próximo paso.</div>';
  tjs.forEach(function(c){
    var items=gs.filter(function(g){return effCuenta(g)===c._k;});
    var tot=items.reduce(function(s,g){return s+Math.round(+g.monto||0);},0);
    o+='<div class="card">';
    o+='<div style="font-weight:700">💳 '+esc(c.nombre)+' <span class="muted">'+dueLbl(c.dueno)+'</span></div>';
    o+='<div class="sub">Compras del mes: '+items.length+' · Deuda del período: <b style="color:#F0ABFC">'+p$(tot)+'</b></div>';
    if(!items.length) o+='<div class="empty">Sin compras asignadas a esta tarjeta en '+cM+'.</div>';
    else items.forEach(function(g){o+='<div class="row"><span style="flex:1">'+esc(g.desc||'Gasto')+' <span class="muted">'+esc(String(g.fecha||'').slice(5))+'</span></span><span>'+p$(g.monto)+'</span></div>';});
    o+='</div>';
  });
  return o;
}

// ── CAPITAL ───────────────────────────────────────────────────────────────
function vCapital(){
  var c=D.capital||{};
  var usdL=Number(c.usd_loli||0),usdH=Number(c.usd_hugo||0),tc=Number(c.tc||0);
  var pesosUsd=(usdL+usdH)*tc;
  var activos=arr(c.activos);
  var actL=activos.filter(function(a){return a.dueno==='loli';}).reduce(function(s,a){return s+Number(a.valor||0);},0);
  var actH=activos.filter(function(a){return a.dueno==='hugo';}).reduce(function(s,a){return s+Number(a.valor||0);},0);
  var actC=activos.filter(function(a){return a.dueno!=='loli'&&a.dueno!=='hugo';}).reduce(function(s,a){return s+Number(a.valor||0);},0);
  var totL=usdL*tc+actL+actC/2, totH=usdH*tc+actH+actC/2, tot=pesosUsd+actL+actH+actC;

  var o='<div class="sec">Capital</div>';
  o+='<div class="card">';
  o+='<div style="font-weight:700;margin-bottom:6px">💵 Dólares ahorrados (stock al cierre)</div>';
  o+='<div class="g3">';
  o+='<div><label>U$S de Loli</label><input type="number" value="'+usdL+'" onchange="setCap(\'usd_loli\',this.value)"/></div>';
  o+='<div><label>U$S de Hugo</label><input type="number" value="'+usdH+'" onchange="setCap(\'usd_hugo\',this.value)"/></div>';
  o+='<div><label>TC (pesos por U$S)</label><input type="number" value="'+tc+'" onchange="setCap(\'tc\',this.value)"/></div>';
  o+='</div>';
  o+='<div class="sub">En pesos: '+p$(pesosUsd)+' (Loli '+p$(usdL*tc)+' · Hugo '+p$(usdH*tc)+')</div>';
  o+='</div>';

  o+='<div class="card">';
  o+='<div style="font-weight:700;margin-bottom:4px">🏠 Otros activos (propiedades, inversiones, etc.)</div>';
  if(!activos.length) o+='<div class="empty">Sin activos cargados. Agregá el primero abajo.</div>';
  else o+=activos.map(function(a){return '<div class="row"><span style="flex:1">'+esc(a.nombre||'')+' <span class="pill">'+dueLbl(a.dueno)+'</span></span><span>'+p$(a.valor)+'</span><button class="btn dz sm" onclick="delActivo(\''+a._k+'\')">🗑</button></div>';}).join('');
  o+='<div style="margin-top:10px" class="g3">';
  o+='<div><label>Activo</label><input id="ac-n" placeholder="Ej: Depto Belgrano"/></div>';
  o+='<div><label>Valor $</label><input id="ac-v" type="number" placeholder="0"/></div>';
  o+='<div><label>¿De quién?</label><select id="ac-d"><option value="loli">💜 Loli</option><option value="hugo">💙 Hugo</option><option value="shared">🤝 Compartido</option></select></div>';
  o+='</div><button class="btn" onclick="addActivo()">+ Agregar activo</button>';
  o+='</div>';

  o+='<div class="card"><div style="font-weight:700;margin-bottom:6px">Totales</div>';
  o+='<table class="ctab"><tr><td>💜 Loli</td><td style="text-align:right;color:#A78BFA;font-weight:700">'+p$(totL)+'</td></tr>';
  o+='<tr><td>💙 Hugo</td><td style="text-align:right;color:#A78BFA;font-weight:700">'+p$(totH)+'</td></tr>';
  o+='<tr style="font-weight:800"><td>Total capital</td><td style="text-align:right;color:#10B981">'+p$(tot)+'</td></tr></table>';
  o+='<div class="sub">Los activos compartidos se reparten 50/50 en los totales por socio.</div>';
  o+='</div>';
  return o;
}
function setCap(f,v){fbSet('cn_capital/'+f,Number(v||0));}
function addActivo(){var n=(document.getElementById('ac-n').value||'').trim();if(!n){alert('Poné un nombre');return;}var v=Number(document.getElementById('ac-v').value||0);var d=document.getElementById('ac-d').value;fbPush('cn_capital/activos',{nombre:n,valor:v,dueno:d});}
function delActivo(k){if(!confirm('Borrar este activo?'))return;fbRm('cn_capital/activos/'+k);}

// ── RESUMEN ───────────────────────────────────────────────────────────────
function vResumen(){
  var o='<div class="sec">Resumen — '+cM+'</div>'+selMes();
  var gs=gastosArs(cM).filter(function(g){return !effDescartado(g);});
  if(!gs.length) return o+'<div class="card"><div class="empty">No hay gastos clasificados en '+cM+'.</div></div>';
  var persona={loli:0,hugo:0,shared:0,empresa:0},rub={},caja={},sinCta=0,tarj=0;
  gs.forEach(function(g){
    var m=Math.round(+g.monto||0);
    persona[effCorresponde(g)]=(persona[effCorresponde(g)]||0)+m;
    var r=effRubro(g)||'(sin rubro)';rub[r]=(rub[r]||0)+m;
    var ck=effCuenta(g);
    if(!ck) sinCta+=m;
    else if(cuentaById(ck)&&cuentaById(ck).tipo==='tarjeta') tarj+=m;
    else if(cuentaById(ck)) caja[cuentaById(ck).nombre]=(caja[cuentaById(ck).nombre]||0)+m;
  });
  o+='<div class="card"><div style="font-weight:700;margin-bottom:6px">A quién corresponde (económico)</div><table class="ctab">';
  ['loli','hugo','shared','empresa'].forEach(function(k){o+='<tr><td>'+dueLbl(k)+'</td><td style="text-align:right;font-weight:700">'+p$(persona[k]||0)+'</td></tr>';});
  o+='</table></div>';
  o+='<div class="card"><div style="font-weight:700;margin-bottom:6px">Por rubro</div><table class="ctab">';
  Object.keys(rub).sort(function(a,b){return rub[b]-rub[a];}).forEach(function(k){o+='<tr><td>'+esc(k)+'</td><td style="text-align:right">'+p$(rub[k])+'</td></tr>';});
  o+='</table></div>';
  o+='<div class="card"><div style="font-weight:700;margin-bottom:6px">Quién pagó (financiero)</div><table class="ctab">';
  Object.keys(caja).forEach(function(k){o+='<tr><td>'+esc(k)+'</td><td style="text-align:right">'+p$(caja[k])+'</td></tr>';});
  if(tarj)o+='<tr><td>💳 Tarjetas</td><td style="text-align:right;color:#F0ABFC">'+p$(tarj)+'</td></tr>';
  if(sinCta)o+='<tr><td style="color:#FBBF24">⚠ Sin asignar</td><td style="text-align:right;color:#FBBF24">'+p$(sinCta)+'</td></tr>';
  o+='</table></div>';
  return o;
}

// ── CONFIG ────────────────────────────────────────────────────────────────
function vConfig(){
  var o='<div class="sec">⚙ Configuración</div>';
  // CUENTAS
  o+='<div class="card">';
  o+='<div style="font-weight:700;margin-bottom:4px">🏦 Cuentas</div>';
  o+='<div class="sub">Las <b>cajas</b> (Efectivo, ML) son las columnas de la Caja. Las <b>tarjetas</b> (MP, BBVA) van a la solapa TJ. Nombres genéricos y agrupables.</div>';
  var cs=arr(D.cuentas).sort(byOrden);
  if(!cs.length) o+='<div class="empty">Sin cuentas. Cargá las sugeridas o agregá abajo.</div>';
  else o+=cs.map(function(c){return '<div class="row"><span style="flex:1">'+esc(c.nombre)+' <span class="pill'+(c.tipo==='tarjeta'?' tj':'')+'">'+(c.tipo==='tarjeta'?'💳 tarjeta':(c.tipo==='caja'?'caja':'⚠ viejo (rubro)'))+'</span></span><span class="muted">'+dueLbl(c.dueno)+'</span><button class="btn dz sm" onclick="delCuenta(\''+c._k+'\')">🗑</button></div>';}).join('');
  o+='<div style="margin-top:10px" class="g3">';
  o+='<div><label>Nombre</label><input id="nc-nombre" placeholder="Ej: ML Loli"/></div>';
  o+='<div><label>Tipo</label><select id="nc-tipo"><option value="caja">Caja (efectivo/ML)</option><option value="tarjeta">Tarjeta (con resumen)</option></select></div>';
  o+='<div><label>¿De quién?</label><select id="nc-dueno"><option value="loli">💜 Loli</option><option value="hugo">💙 Hugo</option><option value="shared">🤝 Compartida</option></select></div>';
  o+='</div>';
  o+='<button class="btn" onclick="addCuenta()">+ Agregar cuenta</button> <button class="btn ok" onclick="cargarCuentasSug()">✨ Cargar sugeridas</button>';
  if(arr(D.cuentas).filter(function(c){return !c.tipo;}).length) o+=' <button class="btn dz" onclick="limpiarCuentasViejas()">🧹 Limpiar viejas (rubros)</button>';
  o+='</div>';
  // RUBROS
  o+='<div class="card">';
  o+='<div style="font-weight:700;margin-bottom:4px">📂 Rubros</div>';
  o+='<div class="sub">Categorías principales para clasificar los gastos (ej: Hogar, Comida, Belleza).</div>';
  var rs=rubrosList();
  if(!rs.length) o+='<div class="empty">Sin rubros. Agregá el primero.</div>';
  else o+=rs.map(function(r){return '<div class="row"><span style="flex:1">'+esc(r.nombre)+' <span class="muted">'+subrubrosDe(r.nombre).length+' subrubro(s)</span></span><button class="btn dz sm" onclick="delRubro(\''+r._k+'\')">🗑</button></div>';}).join('');
  o+='<div style="margin-top:10px;display:flex;gap:6px"><input id="nr-nombre" placeholder="Ej: Hogar"/><button class="btn" onclick="addRubro()">+ Rubro</button></div>';
  o+='<div style="margin-top:8px"><button class="btn ok" onclick="importarRubros()">✨ Importar rubros de mis gastos</button></div>';
  o+='</div>';
  // SUBRUBROS
  o+='<div class="card">';
  o+='<div style="font-weight:700;margin-bottom:4px">🗂 Subrubros</div>';
  o+='<div class="sub">Detalle dentro de un rubro (ej: Hogar → Expensas, Luz, Gas). Ojo: Hogar ≠ Expensas.</div>';
  var ss=arr(D.subrubros).sort(byOrden);
  if(!rs.length) o+='<div class="empty">Primero creá al menos un rubro.</div>';
  else{
    if(ss.length) o+=ss.map(function(s){return '<div class="row"><span style="flex:1">'+esc(s.nombre)+' <span class="pill">'+esc(s.rubro||'')+'</span></span><button class="btn dz sm" onclick="delSub(\''+s._k+'\')">🗑</button></div>';}).join('');
    o+='<div style="margin-top:10px" class="g2">';
    o+='<div><label>Subrubro</label><input id="ns-nombre" placeholder="Ej: Expensas"/></div>';
    o+='<div><label>Dentro del rubro</label><select id="ns-rubro">'+rs.map(function(r){return '<option value="'+esc(r.nombre)+'">'+esc(r.nombre)+'</option>';}).join('')+'</select></div>';
    o+='</div><button class="btn" onclick="addSub()">+ Subrubro</button>';
  }
  o+='</div>';
  // FIJOS
  o+='<div class="card">';
  o+='<div style="font-weight:700;margin-bottom:4px">📅 Costos fijos (recordatorio)</div>';
  o+='<div class="sub">Solo enunciados para no olvidarte de pagarlos. No suman acá; el pago se registra en la Caja.</div>';
  var fs=arr(D.fijos).sort(byOrden);
  if(!fs.length) o+='<div class="empty">Sin fijos.</div>';
  else o+=fs.map(function(f){return '<div class="row"><span style="flex:1">'+esc(f.nombre)+(f.grupo?' <span class="pill">'+esc(f.grupo)+'</span>':'')+'</span><span class="muted">'+dueLbl(f.dueno)+'</span><button class="btn dz sm" onclick="delFijo(\''+f._k+'\')">🗑</button></div>';}).join('');
  o+='<div style="margin-top:10px" class="g2"><div><label>Nombre</label><input id="nf-nombre" placeholder="Ej: Expensas"/></div><div><label>¿De quién?</label><select id="nf-dueno"><option value="shared">🤝 Compartido</option><option value="loli">💜 Loli</option><option value="hugo">💙 Hugo</option></select></div></div>';
  o+='<button class="btn" onclick="addFijo()">+ Agregar fijo</button>';
  o+='</div>';
  return o;
}

// --- Config: acciones ---
function addCuenta(){var n=(document.getElementById('nc-nombre').value||'').trim();if(!n){alert('Poné un nombre');return;}fbPush('cn_cuentas',{nombre:n,tipo:document.getElementById('nc-tipo').value,dueno:document.getElementById('nc-dueno').value,orden:arr(D.cuentas).length});}
function limpiarCuentasViejas(){
  var viejas=arr(D.cuentas).filter(function(c){return !c.tipo;});
  if(!viejas.length){alert('No hay cuentas viejas para limpiar.');return;}
  if(!confirm('Quitar '+viejas.length+' cuenta(s) vieja(s) (eran rubros)?\n\n'+viejas.map(function(c){return c.nombre;}).join(', ')+'\n\nTip: antes usá "Importar rubros de mis gastos" para conservarlas como rubros.'))return;
  var ups={};viejas.forEach(function(c){ups['cn_cuentas/'+c._k]=null;});
  spin(true);DB.ref('/').update(ups,function(){spin(false);});
}
function delCuenta(k){var c=D.cuentas[k];if(!c)return;if(!confirm('Borrar "'+c.nombre+'"?'))return;fbRm('cn_cuentas/'+k);}
function cargarCuentasSug(){
  var sug=[['Ef. Loli','caja','loli'],['Ef. Hugo','caja','hugo'],['ML Loli','caja','loli'],['ML Hugo','caja','hugo'],
    ['MP Loli','tarjeta','loli'],['MP Hugo','tarjeta','hugo'],['Visa BBVA Loli','tarjeta','loli'],['Visa BBVA Hugo','tarjeta','hugo'],['Master BBVA Loli','tarjeta','loli'],['Master BBVA Hugo','tarjeta','hugo']];
  var existentes=arr(D.cuentas).map(function(c){return c.nombre;});
  var nuevas=sug.filter(function(s){return existentes.indexOf(s[0])<0;});
  if(!nuevas.length){alert('Ya están todas cargadas.');return;}
  if(!confirm('Cargar '+nuevas.length+' cuenta(s) sugeridas?'))return;
  var base=arr(D.cuentas).length,ups={};
  nuevas.forEach(function(s,i){ups['cn_cuentas/'+DB.ref('cn_cuentas').push().key]={nombre:s[0],tipo:s[1],dueno:s[2],orden:base+i};});
  spin(true);DB.ref('/').update(ups,function(){spin(false);});
}
function addRubro(){var n=(document.getElementById('nr-nombre').value||'').trim();if(!n){alert('Poné un nombre');return;}fbPush('cn_rubros',{nombre:n,orden:arr(D.rubros).length});}
function importarRubros(){
  var set={};
  Object.keys(D.gastos||{}).forEach(function(mes){
    var g=D.gastos[mes]||{};
    Object.keys(g).forEach(function(k){var v=g[k].cuenta_nueva;if(v&&v!=='__empresa__'&&v!=='__descartar__')set[v]=true;});
  });
  Object.keys(D.reclass||{}).forEach(function(mes){
    var r=D.reclass[mes]||{};
    Object.keys(r).forEach(function(k){if(r[k].rubro)set[r[k].rubro]=true;});
  });
  var existentes=rubrosList().map(function(r){return r.nombre;});
  var nuevos=Object.keys(set).filter(function(n){return existentes.indexOf(n)<0;});
  if(!nuevos.length){alert('No hay rubros nuevos para importar (o ya están todos cargados).');return;}
  if(!confirm('Importar '+nuevos.length+' rubro(s) de tus gastos?\n\n'+nuevos.join(', ')))return;
  var base=arr(D.rubros).length,ups={};
  nuevos.forEach(function(n,i){ups['cn_rubros/'+DB.ref('cn_rubros').push().key]={nombre:n,orden:base+i};});
  spin(true);DB.ref('/').update(ups,function(){spin(false);});
}
function delRubro(k){var r=D.rubros[k];if(!r)return;if(!confirm('Borrar rubro "'+r.nombre+'"?'))return;fbRm('cn_rubros/'+k);}
function addSub(){var n=(document.getElementById('ns-nombre').value||'').trim();if(!n){alert('Poné un nombre');return;}var rub=document.getElementById('ns-rubro').value;fbPush('cn_subrubros',{nombre:n,rubro:rub,orden:arr(D.subrubros).length});}
function delSub(k){var s=D.subrubros[k];if(!s)return;if(!confirm('Borrar subrubro "'+s.nombre+'"?'))return;fbRm('cn_subrubros/'+k);}
function addFijo(){var n=(document.getElementById('nf-nombre').value||'').trim();if(!n){alert('Poné un nombre');return;}fbPush('cn_fijos',{nombre:n,dueno:document.getElementById('nf-dueno').value,orden:arr(D.fijos).length});}
function delFijo(k){var f=D.fijos[k];if(!f)return;if(!confirm('Borrar "'+f.nombre+'"?'))return;fbRm('cn_fijos/'+k);}
</script>
