<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Gastos Personales</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0B1120;color:#E2E8F0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;padding-bottom:60px}
  .wrap{max-width:900px;margin:0 auto;padding:12px}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#111827;border-bottom:1px solid #1F2937;position:sticky;top:0;z-index:20}
  .brand{font-weight:800;font-size:16px;color:#A78BFA;letter-spacing:.5px}
  .nav{display:flex;gap:4px;flex-wrap:wrap;padding:8px 12px;background:#0F172A;position:sticky;top:44px;z-index:19;border-bottom:1px solid #1F2937}
  .nbtn{background:#1E293B;color:#94A3B8;border:none;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
  .nbtn.on{background:#7C3AED;color:#fff}
  .sec{font-size:16px;font-weight:800;margin:14px 0 8px;color:#E2E8F0}
  .sub{font-size:12px;color:#94A3B8;margin-bottom:8px;line-height:1.5}
  .card{background:#111827;border:1px solid #1F2937;border-radius:12px;padding:14px;margin-bottom:12px}
  .btn{background:#7C3AED;color:#fff;border:none;border-radius:8px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer}
  .btn.g{background:#334155;color:#CBD5E1}
  .btn.ok{background:#065F46;color:#A7F3D0}
  .btn.dz{background:#7F1D1D;color:#FCA5A5}
  .btn.sm{padding:5px 10px;font-size:11px}
  input,select{width:100%;background:#0F172A;border:1px solid #334155;border-radius:8px;padding:10px;color:#E2E8F0;font-size:15px}
  label{font-size:12px;color:#94A3B8;display:block;margin-bottom:4px}
  .fg{margin-bottom:12px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #1E293B}
  .row:last-child{border-bottom:none}
  .pill{font-size:10px;background:#1E293B;color:#93C5FD;border-radius:6px;padding:2px 7px}
  .pill.tj{color:#F0ABFC}
  .muted{color:#64748B;font-size:11px}
  .empty{color:#64748B;font-size:13px;padding:16px;text-align:center}
  .ctab{width:100%;border-collapse:collapse;font-size:13px}
  .ctab th,.ctab td{padding:6px 8px;border-bottom:1px solid #1E293B;vertical-align:top}
  .spin{position:fixed;top:8px;right:8px;width:14px;height:14px;border:2px solid #7C3AED;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:none;z-index:50}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="spin" id="spin"></div>
<div class="topbar"><span class="brand">Gastos Personales</span><span class="muted" id="hoy"></span></div>
<div class="nav" id="nav"></div>
<div class="wrap" id="app"><div class="empty">Cargando…</div></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({apiKey:'AIzaSyDhuSP_WTWI3hqf5GqgFExkptFfpqJUn50',authDomain:'gestion-prop.firebaseapp.com',databaseURL:'https://gestion-prop-default-rtdb.firebaseio.com',projectId:'gestion-prop'});
var DB=firebase.database();

// ── Estado ─ nodos cn_* (lo nuevo) + nodos viejos solo para Capital e importar
var D={cuentas:{},rubros:{},gastos:{},gastosVj:{},aho:{},cfgAho:{},ahoWho:{},inv:{},invWho:{},usdMovs:{},capOld:{},descartados:{},mapCtas:{}};
var TAB='cargar';
var _movAdd=false;
function toggleMovAdd(){_movAdd=!_movAdd;if(_movAdd)EDIT=null;render();}
var CTIPO='gasto';
var MONEDAG='ars';
var PAGOTJ='';
var EDITTJ=null;
var RESEXP='';
var EDIT=null;
var SHOWHIST=false;
var DETALLE='';
var cM='2026-08';
var MESES=['2026-06','2026-07','2026-08','2026-09'];

function spin(on){document.getElementById('spin').style.display=on?'block':'none';}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fbSet(p,v){spin(true);DB.ref(p).set(v,function(){spin(false);});}
function fbRm(p){spin(true);DB.ref(p).remove(function(){spin(false);});}
function arr(o){o=o||{};return Object.keys(o).map(function(k){var x=Object.assign({},o[k]);x._k=k;return x;});}
function p$(n){n=Math.round(+n||0);return (n<0?'−$':'$')+Math.abs(n).toLocaleString('es-AR');}
function diaLabel(d){if(!d||d.length<10)return d||'sin fecha';var y=+d.slice(0,4),m=+d.slice(5,7),dy=+d.slice(8,10);var dias=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];var dt=new Date(y,m-1,dy);var dn=isNaN(dt.getTime())?'':dias[dt.getDay()]+' ';return dn+String(dy).padStart(2,'0')+'/'+String(m).padStart(2,'0');}
function pU(n){return 'U$S '+Math.round(+n||0).toLocaleString('es-AR');}
function money2num(v){return Math.round(Number(String(v||'').replace(/[^\d]/g,''))||0);}
function byOrden(a,b){return (a.orden||0)-(b.orden||0);}
function opt(v,lbl,cur){return '<option value="'+esc(v)+'"'+(String(cur)===String(v)?' selected':'')+'>'+esc(lbl)+'</option>';}

function bind(node,key){DB.ref(node).on('value',function(s){D[key]=s.exists()?s.val():{};render();});}
document.addEventListener('input',function(e){var el=e.target;if(el&&el.getAttribute&&el.getAttribute('data-money')!=null){var raw=String(el.value).replace(/[^\d]/g,'');el.value=raw?Number(raw).toLocaleString('es-AR'):'';}});
bind('cn_cuentas','cuentas');
bind('cn_map_cuentas','mapCtas');
bind('cn_rubros','rubros');
bind('cn_descartados','descartados');
bind('cn_gastos','gastos');
bind('fin_gastos','gastosVj');
bind('aho','aho');bind('cfg_aho','cfgAho');bind('fin_aho_who','ahoWho');
bind('inv','inv');bind('fin_inv_who','invWho');bind('fin_usdMovs','usdMovs');bind('fin_capital','capOld');
bind('aj','aj');
document.getElementById('hoy').textContent=new Date().toLocaleDateString('es-AR');

// ── Personas / cuentas / rubros ────────────────────────────────────────────
var ADULTOS=['loli','hugo'];
function persLbl(p){p=String(p||'').toLowerCase();return p==='loli'?'💜 Loli':p==='hugo'?'💙 Hugo':(p==='familia'||p==='shared')?'👪 Familia':p==='empresa'?'🏢 Empresa':p==='casa'?'🏠 Casa':'—';}
function quienOpts(sel){return ADULTOS.map(function(p){return opt(p,persLbl(p),sel);}).join('');}
function corrOpts(sel){return ADULTOS.map(function(p){return opt(p,persLbl(p),sel);}).join('')+opt('familia','👪 Familia (50/50)',sel)+opt('empresa','🏢 Empresa',sel);}
function cuentasCaja(){return arr(D.cuentas).filter(function(c){return c.tipo==='caja'&&!c.cerrada;}).sort(byOrden);}
function cuentasTarj(){return arr(D.cuentas).filter(function(c){return c.tipo==='tarjeta'&&!c.cerrada;}).sort(byOrden);}
function cuentasEmp(){return arr(D.cuentas).filter(function(c){return c.tipo==='empresa'&&!c.cerrada;}).sort(byOrden);}
function cuentaById(k){return D.cuentas[k];}
function rubrosList(){return arr(D.rubros).sort(byOrden);}
function ctaOpts(sel){var o='<optgroup label="Cajas">'+cuentasCaja().map(function(c){return opt(c._k,c.nombre+(/bbva/i.test(c.nombre||'')&&!/u\$|usd|d[oó]lar/i.test(c.nombre||'')?' ($)':''),sel);}).join('')+'</optgroup>';var t=cuentasTarj();if(t.length)o+='<optgroup label="Tarjetas">'+t.map(function(c){return opt(c._k,'💳 '+c.nombre,sel);}).join('')+'</optgroup>';var e=cuentasEmp();if(e.length)o+='<optgroup label="Retiro empresa">'+e.map(function(c){return opt(c._k,'🏢 '+c.nombre,sel);}).join('')+'</optgroup>';return o;}

// Movimientos del mes (solo lo cargado en la app nueva)
function movsMes(mes){return (D.gastos&&D.gastos[mes])?arr(D.gastos[mes]):[];}

// ── Navegación ────────────────────────────────────────────────────────────
var TABS=[['cargar','➕ Cargar'],['mov','Movimientos'],['tj','💳 TJ'],['capital','Capital'],['resumen','Resumen'],['config','⚙ Config']];
function go(t){if(t!=='cargar')EDIT=null;TAB=t;render();}
function selMes(){return '<div class="fg"><label>Mes</label><select onchange="cM=this.value;render()">'+MESES.map(function(m){return '<option'+(m===cM?' selected':'')+'>'+m+'</option>';}).join('')+'</select></div>';}
function render(){
  document.getElementById('nav').innerHTML=TABS.map(function(t){return '<button class="nbtn'+(TAB===t[0]?' on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>';}).join('');
  var app=document.getElementById('app');
  if(TAB==='cargar')app.innerHTML=vCargar();
  else if(TAB==='mov')app.innerHTML=vMov();
  else if(TAB==='tj')app.innerHTML=vTJ();
  else if(TAB==='capital')app.innerHTML=vCapital();
  else if(TAB==='resumen')app.innerHTML=vResumen();
  else if(TAB==='config')app.innerHTML=vConfig();
}

// ── CARGAR (el cuadro único) ───────────────────────────────────────────────
function vCargar(){
  var hoy=new Date().toISOString().split('T')[0];
  var ed=EDIT?((D.gastos[EDIT.mes]||{})[EDIT.key]||null):null;
  var v=ed||{};
  var o='<div class="sec">'+(ed?'✏ Editar movimiento':'➕ Cargar movimiento')+'</div>';
  if(!rubrosList().length||!cuentasCaja().length) o+='<div class="card"><div class="sub">⚠ Antes de cargar, andá a <b>⚙ Config</b> y creá tus <b>rubros</b> y <b>cuentas</b> (hay botones para cargar los sugeridos).</div></div>';
  o+='<div class="card">';
  o+='<div class="g2"><div><label>Tipo</label><select id="c-tipo" onchange="CTIPO=this.value;render()">'+opt('gasto','🔴 Gasto',CTIPO)+opt('ingreso','🟢 Ingreso',CTIPO)+opt('transfer','🔄 Mov. entre cuentas',CTIPO)+'</select></div><div><label>Fecha</label><input type="date" id="c-fecha" value="'+(v.fecha||hoy)+'"/></div></div>';
  if(CTIPO==='transfer'){
    o+='<div class="g2"><div><label>Sale de</label><select id="c-out" onchange="tfUsdToggle()"><option value="">— elegí —</option>'+ctaOpts(v.ctaOut||'')+usdOptg(v.ctaOut||'')+'</select></div><div><label>Entra a</label><select id="c-in" onchange="tfUsdToggle()"><option value="">— elegí —</option>'+ctaOpts(v.ctaIn||'')+usdOptg(v.ctaIn||'')+'</select></div></div>';
    var _tfU=esUsdSrc(v.ctaOut)||esUsdSrc(v.ctaIn);
    o+='<div id="tf-usd" style="display:'+(_tfU?'block':'none')+'"><div class="g3"><div><label>Monto U$S</label><input id="c-usd" inputmode="numeric" data-money="1" value="'+(v.usd?Number(v.usd).toLocaleString("es-AR"):"")+'" placeholder="0" oninput="tfCalc()"/></div><div><label>TC</label><input id="c-tctf" inputmode="numeric" data-money="1" value="'+(v.tc?Number(v.tc).toLocaleString("es-AR"):"")+'" placeholder="Ej: 1450" oninput="tfCalc()"/></div><div><label>De quién son los U$S</label><select id="c-who">'+opt('shared','🤝 50/50',v.who||'shared')+opt('loli','💜 Loli',v.who||'')+opt('hugo','💙 Hugo',v.who||'')+'</select></div></div><div class="muted" style="margin-bottom:6px">Pesos → Ahorros = compra de U$S. Ahorros → pesos = venta. El monto $ = U$S × TC (se calcula solo, lo podés corregir). No cuenta como gasto ni ingreso.</div></div>';
    o+='<div class="g2"><div><label>Monto $</label><input id="c-monto" inputmode="numeric" data-money="1" value="'+(v.monto?Number(v.monto).toLocaleString("es-AR"):"")+'" placeholder="0"/></div><div><label>Nota (opcional)</label><input id="c-desc" value="'+esc(v.desc&&v.desc!=='Movimiento entre cuentas'?v.desc:'')+'" placeholder="Ej: paso plata a MP"/></div></div>';
    o+='<div class="sub">Mueve el saldo de una cuenta a la otra. No cuenta como gasto de nadie.</div>';
  } else {
    o+='<div class="g2"><div><label>Qué (detalle)</label><input id="c-desc" value="'+esc(v.desc||'')+'" placeholder="Ej: shampoo, colegio Max, nafta"/></div><div><label>'+(MONEDAG==='usd'?'Monto U$S':'Monto $')+'</label><input id="c-monto" inputmode="numeric" data-money="1" value="'+(v.monto?Number(v.monto).toLocaleString("es-AR"):"")+'" placeholder="0"/></div></div>';
    o+='<div class="fg"><label>Rubro (en qué / para quién)</label><select id="c-rubro"><option value="">— elegí —</option>'+rubrosList().map(function(r){return opt(r.nombre,r.nombre,v.rubro||'');}).join('')+'</select></div>';
    o+='<div class="g3">';
    o+='<div><label>Quién lo hizo</label><select id="c-quien"><option value="">—</option>'+quienOpts(v.quien||'')+'</select></div>';
    o+='<div><label>Corresponde (división)</label><select id="c-corr">'+corrOpts(v.corresponde||'familia')+'</select></div>';
    o+='<div><label>'+(CTIPO==='ingreso'?'A qué cuenta entró':'Con qué se pagó')+'</label><select id="c-cta"><option value="">— elegí —</option>'+ctaOpts(v.cuenta||'')+usdOptg(v.cuenta||'')+'</select></div>';
    o+='</div>';
    if(CTIPO==='gasto'){
      var _bs=arr(D.capOld).filter(function(c){return !c.vendido;});
      o+='<div class="fg"><label>🏠 ¿Es inversión/mejora de un bien de capital? <span class="muted">(opcional)</span></label><select id="c-bien"><option value="">— No —</option>'+_bs.map(function(b){return '<option value="'+b._k+'">'+esc(b.desc)+' ('+(b.usd?pU(b.usd):p$(b.ars||0))+')</option>';}).join('')+'<option value="__new__">➕ Crear un bien nuevo</option></select><div class="muted" style="margin-top:4px">Si elegís uno, al Guardar el monto se suma a ese bien en Capital (no queda como gasto suelto).</div></div>';
    }
    if(CTIPO==='gasto'&&cuentasTarj().length){
      o+='<div class="fg"><label>En cuántas cuotas <span class="muted">(solo si pagás con tarjeta)</span></label><input id="c-cuotas" type="number" inputmode="numeric" min="1" max="60" step="1" value="'+(v.cuotasTot||v.cuotas||1)+'" placeholder="1"'+(v.cuotasTot?' disabled':'')+'/><div class="muted" style="margin-top:4px">'+(v.cuotasTot?'Esta es la cuota '+v.cuotaN+' de '+v.cuotasTot+': acá editás solo esta cuota. Para cambiar la cantidad de cuotas, borrá las cuotas y cargala de nuevo.':'Poné el número (1 = un pago). El monto es el TOTAL de la compra: se divide en cuotas. La cuota 1 cae en la fecha de la compra; el resto, un mes por cuota.')+'</div></div>';
    }
    if(CTIPO==='gasto'||CTIPO==='ingreso'){
      o+='<div class="fg"><label>Moneda</label><select id="c-moneda" onchange="MONEDAG=this.value;render()">'+opt('ars','$ pesos',MONEDAG)+opt('usd','USD dólares',MONEDAG)+'</select></div>';
      if(MONEDAG==='usd'){
        o+='<div class="fg"><label>TC del día <span class="muted">(para que cuente en pesos en Resumen)</span></label><input id="c-tc" inputmode="numeric" data-money="1" value="'+(v.tc?Number(v.tc).toLocaleString("es-AR"):"")+'" placeholder="Ej: 1450"/><div class="muted" style="margin-top:4px">Monto de arriba en dólares × este TC = lo que suma en Resumen. Si lo dejás vacío, el gasto no entra en Resumen (solo en Movimientos y Dólares GP).</div><div class="muted" style="margin-top:4px;color:#38BDF8">💳 Si lo pagaste con tarjeta, va a la parte U$S de su resumen (no toca Dólares GP).</div></div>';
      }
    }
  }
  o+='<button class="btn" style="width:100%" onclick="guardarMov()">'+(ed?'Guardar cambios':'Guardar')+'</button>';
  if(ed)o+='<button class="btn g" style="width:100%;margin-top:6px" onclick="cancelEdit()">Cancelar edición</button>';
  if(CTIPO==='gasto')o+='<button class="btn" style="width:100%;margin-top:6px;background:#7C3AED" onclick="enviarAGP()">📤 Enviar a AU como costo</button>';
  if(CTIPO==='gasto')o+='<button class="btn" style="width:100%;margin-top:6px;background:#0891B2" onclick="vincularInversionABien()">🏠 Adjudicar a una propiedad/bien</button>';
  o+='</div>';
  if(!ed){
    var ult=movsMes(cM).filter(function(g){return g.tipo!=='empresa';}).sort(function(a,b){return String(b.fecha||'').localeCompare(String(a.fecha||''));}).slice(0,6);
    if(ult.length){
      o+='<div class="sec" style="font-size:13px">Últimos cargados en '+cM+' <span class="muted">(tocá para editar)</span></div><div class="card">';
      ult.forEach(function(g){o+=movRow(g,true);});
      o+='</div>';
    }
  }
  return o;
}
function editMov(mes,key){
  var g=(D.gastos[mes]||{})[key];if(!g)return;
  if(g.tipo==='pagotj'){editPagoTJ(mes,key);return;}
  EDIT={mes:mes,key:key};
  if(g.tipo==='empresa'){var st=(g.subtipo||'').toLowerCase();CTIPO=(st==='aporte')?'gasto':'ingreso';}
  else CTIPO=(g.tipo==='ingreso'||g.tipo==='transfer')?g.tipo:'gasto';
  MONEDAG=(g.moneda==='usd')?'usd':'ars';
  TAB='cargar';render();
}
function cancelEdit(){EDIT=null;TAB='mov';render();}
function linkGastoUsd(obj,prev,who){
  // Si el gasto es en USD y no es con tarjeta, ofrece/mantiene un movimiento en dólares vinculado (resta de Dólares GP).
  var prevLink=prev&&prev._linkUsd;
  var ups={};
  // Ingreso en U$S a Ahorros (suma al stock) o mov. entre cuentas con Ahorros (compra/venta)
  var usdIn=(obj.tipo==='ingreso'&&obj.moneda==='usd'&&esUsdSrc(obj.cuenta));
  var usdTf=(obj.tipo==='transfer'&&(esUsdSrc(obj.ctaOut)||esUsdSrc(obj.ctaIn)));
  if(usdIn||usdTf){
    var mk=prevLink||DB.ref('fin_usdMovs').push().key;obj._linkUsd=mk;
    if(usdIn)ups['fin_usdMovs/'+mk]={desc:'Ingreso: '+(obj.desc||''),tipo:'ingreso',usd:-Math.round(+obj.monto||0),ars:0,fec:obj.fecha,who:who,_linkGasto:true,srcCuenta:obj.cuenta};
    else{
      var sale=esUsdSrc(obj.ctaOut),entra=esUsdSrc(obj.ctaIn);
      if(sale&&entra){delete obj._linkUsd;if(prevLink)ups['fin_usdMovs/'+prevLink]=null;} // U$S→U$S: mismo stock, no cambia nada
      else ups['fin_usdMovs/'+mk]={desc:(sale?'Venta U$S → '+ctaNom(obj.ctaIn):'Compra U$S desde '+ctaNom(obj.ctaOut))+(obj.tc?' (TC '+obj.tc+')':''),tipo:sale?'venta':'compra',usd:sale?Math.round(+obj.usd||0):-Math.round(+obj.usd||0),ars:Math.round(+obj.monto||0),fec:obj.fecha,who:obj.who||who,_linkGasto:true,srcCuenta:sale?obj.ctaOut:obj.ctaIn};
    }
    return ups;
  }
  var esTj=obj.cuenta&&cuentaById(obj.cuenta)&&cuentaById(obj.cuenta).tipo==='tarjeta';
  var califica=(obj.tipo==='gasto'&&obj.moneda==='usd'&&!esTj);
  if(califica){
    if(prevLink){
      obj._linkUsd=prevLink;
      ups['fin_usdMovs/'+prevLink]={desc:'Gasto: '+(obj.desc||''),tipo:'gasto',usd:Math.round(+obj.monto||0),ars:0,fec:obj.fecha,who:who,_linkGasto:true,srcCuenta:esUsdSrc(obj.cuenta)?obj.cuenta:'__usdgp__'};
    } else if(esUsdSrc(obj.cuenta)||/^s/i.test((prompt('¿Salió de tus dólares en efectivo (Dólares GP)? (si/no):','si')||'').trim())){
      var movKey=DB.ref('fin_usdMovs').push().key;
      obj._linkUsd=movKey;
      ups['fin_usdMovs/'+movKey]={desc:'Gasto: '+(obj.desc||''),tipo:'gasto',usd:Math.round(+obj.monto||0),ars:0,fec:obj.fecha,who:who,_linkGasto:true,srcCuenta:esUsdSrc(obj.cuenta)?obj.cuenta:'__usdgp__'};
    }
  } else if(prevLink){
    if(confirm('Este movimiento ya no es en dólares en efectivo. ¿Borrar el movimiento en dólares vinculado?'))ups['fin_usdMovs/'+prevLink]=null;
  }
  return ups;
}
function guardarMov(){
  var tipo=(document.getElementById('c-tipo')||{}).value||'gasto';
  if(tipo==='gasto'){var _bienSel=document.getElementById('c-bien');if(_bienSel&&_bienSel.value){vincularInversionABien(_bienSel.value);return;}}
  var f=(document.getElementById('c-fecha')||{}).value;
  var m=money2num((document.getElementById('c-monto')||{}).value);
  var d=((document.getElementById('c-desc')||{}).value||'').trim();
  if(!m){alert('Poné el monto');return;}
  var mes=(f&&f.length>=7)?f.slice(0,7):cM;
  var key=DB.ref('cn_gastos/'+mes).push().key;
  var obj;
  if(tipo==='transfer'){
    var out=(document.getElementById('c-out')||{}).value||'';
    var inn=(document.getElementById('c-in')||{}).value||'';
    if(!out||!inn){alert('Elegí de qué cuenta sale y a qué cuenta entra');return;}
    if(out===inn){alert('Tienen que ser cuentas distintas');return;}

// Stop anti-duplicado: mismo monto + mismo tipo + misma cuenta, ±3 días. Solo avisa, no cambia datos.
function _diasEntre(a,b){var x=new Date(a+'T00:00:00'),y=new Date(b+'T00:00:00');if(isNaN(x)||isNaN(y))return 999;return Math.abs(Math.round((x-y)/86400000));}
function buscarDup(obj){
  var f=obj.fecha||'',m=Math.round(+obj.monto||0),tipo=obj.tipo||'gasto',res=null;
  var meses=[_addMeses(f,-1).slice(0,7),f.slice(0,7),_addMeses(f,1).slice(0,7)];
  meses.forEach(function(mes){if(res)return;arr((D.gastos||{})[mes]||{}).forEach(function(x){
    if(res)return;
    if((x.cuotasTot||0)>1)return;
    if(Math.round(+x.monto||0)!==m)return;
    if(_diasEntre(x.fecha||'',f)>3)return;
    var xt=x.tipo||'gasto',igual=false;
    if(tipo==='transfer')igual=(xt==='transfer'&&x.ctaOut===obj.ctaOut&&x.ctaIn===obj.ctaIn);
    else if(xt==='empresa')igual=true; // vino de AU con el mismo monto
    else igual=(xt===tipo&&x.cuenta===obj.cuenta);
    if(igual)res=(x.fecha||'')+' · '+(xt==='transfer'?(ctaNom(x.ctaOut)+' → '+ctaNom(x.ctaIn)):(x.desc||''))+(xt==='empresa'?' (🏢 de AU)':'')+' · '+(x.moneda==='usd'?pUsd(x.monto):p$(x.monto));
  });});
  // Compra de U$S: también revisa las compras cargadas en AU
  if(!res&&tipo==='transfer'&&esUsdSrc(obj.ctaIn)&&!esUsdSrc(obj.ctaOut)&&obj.usd){
    arr(D.aho).forEach(function(a){if(res)return;if(Math.round(+a.usd||0)===Math.round(+obj.usd)&&_diasEntre(a.fecha||'',f)<=3)res=(a.fecha||'')+' · Compra U$S cargada en AU · '+pU(a.usd)+(a.cuenta?' desde '+a.cuenta:'');});
  }
  return res;
}
function _addMeses(fecha,n){var d=new Date(fecha+'T00:00:00');if(isNaN(d.getTime()))return fecha;d.setMonth(d.getMonth()+n);return d.toISOString().split('T')[0];}

function toggleDetalle(ck){DETALLE=(DETALLE===ck?'':ck);render();}
// Movimientos 🏢 de AU sin ubicar: suman al saldo de la cuenta personal que nombran (ML/MP/Efectivo Loli/Hugo)
// cobro/retiro = entra plata a esa cuenta (+) · aporte = el socio pagó con esa cuenta (−). Al ubicarlo pasa a contar como gasto/ingreso normal.
function empImpacto(x){
  if(!x||x.tipo!=='empresa')return null;
  var au=x.ctaAU;
  if(!au){var d=String(x.desc||''),m;
    if(x.subtipo==='cobro'){m=d.match(/\(([^()]*)\)\s*$/);au=m?m[1]:'';}
    else if(x.subtipo==='aporte'&&d.indexOf(' · ')>=0){au=d.slice(d.lastIndexOf(' · ')+3);}
    else{m=d.match(/^[^·]*·\s*([^-]*?)\s*(?:-|$)/);au=m?m[1]:'';}}
  au=String(au||'').trim();if(!au||!AU_SOCIO_MAP[au])return null;
  var ck='';
  Object.keys(D.mapCtas||{}).forEach(function(k){if(!ck&&D.mapCtas[k]===au&&D.cuentas[k])ck=k;});
  if(!ck){var f=arr(D.cuentas).filter(function(c){return String(c.nombre||'').toLowerCase()===au.toLowerCase();})[0];ck=f?f._k:'';}
  if(!ck||!D.cuentas[ck]||D.cuentas[ck].tipo!=='caja')return null; // solo cuentas personales (no tarjetas)
  var st=String(x.subtipo||'').toLowerCase(),sg=(st==='aporte')?-1:((st==='cobro'||st==='retiro')?1:0);
  if(!sg)return null;
  return {ck:ck,delta:sg*Math.round(+x.monto||0)};
}
function detalleSaldoCuenta(ck){
  var c=D.cuentas[ck];if(!c)return[];
  var acc=Number(c.saldoIni||0);
  var rows=[{fecha:'',label:'Saldo inicial',delta:acc,acumulado:acc,origen:''}];
  Object.keys(D.gastos||{}).sort().forEach(function(mes){
    var items=arr(D.gastos[mes]||{}).sort(function(a,b){return String(a.fecha||'').localeCompare(String(b.fecha||''));});
    items.forEach(function(x){
      var m=mPesos(x),delta=null,label='',origen='';
      if(x.tipo==='ajuste'){
        if(x.cuenta!==ck)return;
        delta=m;label=(x._concilInicio?'⚖ Ajuste inicio de mes':'⚖ Ajuste')+(x.desc?(' — '+x.desc):'');
      } else if(x.tipo==='transfer'){
        if(x.ctaOut===ck)delta=-m;else if(x.ctaIn===ck)delta=m;else return;
        label='🔄 '+(x.desc||'Movimiento entre cuentas');
      } else if(x.tipo==='empresa'){
        var ei=empImpacto(x);if(!ei||ei.ck!==ck)return;
        delta=ei.delta;label='🏢 '+(x.desc||'')+' (de AU, sin ubicar)';origen='AU';
      } else {
        if(x.cuenta!==ck)return;
        delta=(x.tipo==='ingreso'?m:-m);
        label=(delta>0?'🟢 ':'🔴 ')+(x.desc||(x.tipo==='pagotj'?'Pago resumen':''));
        if(x.tipo==='ingreso')origen=x._emp?'AU':'manual';
      }
      acc+=delta;
      rows.push({fecha:x.fecha||(mes+'-01'),label:label,delta:delta,acumulado:acc,origen:origen});
    });
  });
  return rows;
}
function netMes(ck,mes){
  var g=(D.gastos&&D.gastos[mes])?D.gastos[mes]:{},n=0;
  Object.keys(g).forEach(function(k){var x=g[k],m=mPesos(x);
    if(x.tipo==='ajuste'){if(x.cuenta===ck)n+=m;return;}
    if(x.tipo==='transfer'){if(x.ctaOut===ck)n-=m;if(x.ctaIn===ck)n+=m;return;}
    if(x.tipo==='empresa'){var ei=empImpacto(x);if(ei&&ei.ck===ck)n+=ei.delta;return;}
    if(x.cuenta!==ck)return;
    n+=(x.tipo==='ingreso'?m:-m);
  });
  return n;
}
function prevMes(mes){var y=+mes.slice(0,4),m=+mes.slice(5,7)-1;if(m<1){m=12;y--;}return y+'-'+String(m).padStart(2,'0');}
function saldoCajaHasta(ck,mes){

function fijarInicio(ck){

  var ups={};

  // Guardar lo que ya estaba tecleado en los OTROS campos "ini-" antes de re-renderizar,
  // porque render() reconstruye toda la pantalla y antes se perdía lo no confirmado todavia.
  var otrosVal={};

function borrarTodosAjustes(){
  var ups={},count=0;
  Object.keys(D.gastos||{}).forEach(function(mes){var g=D.gastos[mes]||{};Object.keys(g).forEach(function(k){if(g[k].tipo==='ajuste'){ups['cn_gastos/'+mes+'/'+k]=null;count++;}});});

      ups['cst/'+cstKey]={desc:desc,pv:'',cat:rubro||'Gastos Varios',ed:'',mes:mesFinal,monto:montoPesosU,

      }

      DB.ref('/').update(ups,function(err){
        if(err){alert('Error: '+err.message);return;}

        cancelEdit();render();
      });

    DB.ref('subc').once('value',function(snap){
      var cerrada=false,cerradoPor='';

      if(confirm('La caja de AU del '+fechaOrig+' ya está cerrada'+(cerradoPor?' (por '+cerradoPor+')':'')+'.\n\n¿Cargar este costo en la caja de HOY ('+hoyStr+') en vez de esa fecha?'))crearUsd(hoyStr);
    });
    return;
  }
  function seguir(ctaTxt){
    var edKeyOrig=EDIT?EDIT.key:null,mesOrig=EDIT?EDIT.mes:null;
    function crear(fechaFinal){
      var mesFinal=fechaFinal.slice(0,7);
      var nuevo={desc:desc,pv:'',cat:rubro||'Gastos Varios',ed:'',mes:mesFinal,monto:Math.round(monto),
        nro_fact:'',fec_venc:'',pagado:true,fecha_pago:fechaFinal,cta_num:'',cuenta:ctaTxt,tipo:'eventual_caja',
        origen:'Cuentas Personales'};
      DB.ref('cst').push(nuevo,function(err){
        if(err){alert('Error: '+err.message);return;}
        if(edKeyOrig&&mesOrig){
          DB.ref('cn_gastos/'+mesOrig+'/'+edKeyOrig).remove(function(){
            alert('Enviado a AU ('+ctaTxt+', '+fechaFinal+') y borrado de Cuentas Personales para que no quede duplicado.');
            cancelEdit();render();
          });

          alert('Enviado a AU como costo, cuenta '+ctaTxt+', fecha '+fechaFinal+'. Si además lo guardás acá con "Guardar", quedaría contado dos veces — con enviarlo alcanza.');
        }
      });
    }
    DB.ref('subc').once('value',function(snap){
      var cerrada=false,cerradoPor='';
      snap.forEach(function(ch){var s=ch.val();if(s.fecha===fechaOrig){cerrada=true;cerradoPor=s.cerradoPor||'';}});
      if(!cerrada){crear(fechaOrig);return;}

      if(confirm('La caja de AU del '+fechaOrig+' ya está cerrada'+(cerradoPor?' (por '+cerradoPor+')':'')+'.\n\n¿Cargar este costo en la caja de HOY ('+hoyStr+') en vez de esa fecha?'))crear(hoyStr);
    });
  }
  // 1) ¿Ya sabemos a qué cuenta de GP corresponde esta cuenta de Cuentas Personales? (de una vez anterior)
  if(D.mapCtas[ctaKey]){seguir(D.mapCtas[ctaKey]);return;}
  // 2) ¿El nombre ya coincide tal cual con una cuenta de GP? Usarlo derecho, sin preguntar.
  var directo=CTAS_GP.filter(function(c){return c.toLowerCase()===String(ctaNombre).toLowerCase();})[0];
  if(directo){DB.ref('cn_map_cuentas/'+ctaKey).set(directo);seguir(directo);return;}
  // 3) Primera vez que se usa esta cuenta y no coincide sola: preguntar UNA vez y recordarlo para siempre.
  var opciones=CTAS_GP.map(function(c,i){return (i+1)+') '+c;}).join('\n');
  var elegido=prompt('Primera vez que enviás algo pagado con "'+ctaNombre+'" — ¿a cuál cuenta de AU corresponde? (no te lo vuelvo a preguntar)\n\n'+opciones);
  if(elegido===null)return;
  var idx=parseInt(elegido)-1;
  if(isNaN(idx)||idx<0||idx>=CTAS_GP.length){alert('Número inválido, no se envió nada.');return;}
  DB.ref('cn_map_cuentas/'+ctaKey).set(CTAS_GP[idx]);
  seguir(CTAS_GP[idx]);
}

function _planTjBien(montoForm){
  function G(id){return (document.getElementById(id)||{}).value||'';}
  var prev=EDIT?((D.gastos[EDIT.mes]||{})[EDIT.key]||null):null;
  var re=/\s*\(\d+\/\d+\)\s*$/;
  if(prev&&(prev.cuotasTot||0)>1){ // ya es una cuota: marca todas las cuotas de esa compra
    var bd=String(prev.desc||'').replace(re,''),sibs=[];
    Object.keys(D.gastos||{}).forEach(function(mm){var g=D.gastos[mm]||{};Object.keys(g).forEach(function(kk){var x=g[kk];
      if(x.cuenta===prev.cuenta&&x.cuotasTot===prev.cuotasTot&&String(x.desc||'').replace(re,'')===bd)sibs.push({p:'cn_gastos/'+mm+'/'+kk,m:Math.round(+x.monto||0)});});});
    var tot=sibs.reduce(function(a,b){return a+b.m;},0);
    return {total:tot,build:function(bk,bdesc){var u={};sibs.forEach(function(s){u[s.p+'/_bien']=bk;u[s.p+'/_bienDesc']=bdesc;});return u;}};
  }
  var base={fecha:G('c-fecha')||new Date().toISOString().split('T')[0],desc:G('c-desc').trim(),tipo:'gasto',rubro:G('c-rubro'),quien:G('c-quien'),corresponde:G('c-corr')||'familia',cuenta:G('c-cta')};
  var n=parseInt(G('c-cuotas'))||1;

      var o=Object.assign({},prev||{},base,{monto:montoForm,_bien:bk,_bienDesc:bdesc});if(prev)o._editado=true;
      if(prev)u['cn_gastos/'+EDIT.mes+'/'+EDIT.key]=o;else{var mm=base.fecha.slice(0,7);u['cn_gastos/'+mm+'/'+DB.ref('cn_gastos/'+mm).push().key]=o;}
      return u;
    }
    if(prev)u['cn_gastos/'+EDIT.mes+'/'+EDIT.key]=null;
    var por=Math.round(montoForm/n),resto=montoForm-por*n;
    for(var c=0;c<n;c++){var fc=_addMeses(base.fecha,c),mc=fc.slice(0,7);

      u['cn_gastos/'+mc+'/'+DB.ref('cn_gastos/'+mc).push().key]=oc;}
    return u;
  }};
}

function _invAU(bien,desc,monto,moneda,fecha,cb){
  if(!bien||!bien.invEmpresa){cb({},'');return;}
  var ctaKey=(document.getElementById('c-cta')||{value:''}).value||'';
  if(!ctaKey){alert('"'+bien.desc+'" es inversión de la empresa: elegí "Con qué se pagó" para cargarlo en AU. No se guardó nada.');return;}
  var tc=money2num((document.getElementById('c-tc')||{value:''}).value);
  if(moneda==='usd'&&!tc){alert('Falta el TC del día para cargarlo en AU en pesos. No se guardó nada.');return;}
  var pesos=moneda==='usd'?Math.round(monto*tc):Math.round(monto);
  var concepto='Inversión '+(bien.desc||'')+': '+desc+(moneda==='usd'?' (U$S '+Math.round(monto).toLocaleString('es-AR')+' TC '+tc+')':'');
  function conFecha(armar){
    DB.ref('subc').once('value',function(snap){
      var cerrada=false,por='';snap.forEach(function(ch){var x=ch.val();if(x.fecha===fecha){cerrada=true;por=x.cerradoPor||'';}});
      if(!cerrada){armar(fecha);return;}
      var hoy=new Date().toISOString().split('T')[0];
      if(confirm('La caja de AU del '+fecha+' ya está cerrada'+(por?' (por '+por+')':'')+' y AU no deja cargar en una caja cerrada.\n\nAceptar = se carga en la caja de HOY ('+hoy+') con "(compra del '+_fdTJ(fecha)+')" en el concepto.\nCancelar = no se guarda nada.')){concepto+=' (compra del '+_fdTJ(fecha)+')';armar(hoy);}
    });
  }
  function aporte(ups,f,socio,ctaCaja,m){var k=DB.ref('movs').push().key;ups['movs/'+k]={fecha:f,mes:f.slice(0,7),tipo:'aporte',cuenta:socio,cuenta_caja:ctaCaja,monto:m,nota:concepto,origen:'Cuentas Personales'};return 'movs/'+k;}
  if(esUsdSrc(ctaKey)){
    var q=(document.getElementById('c-quien')||{}).value||'',co=(document.getElementById('c-corr')||{}).value||'';
    var quien=ctaKey==='__usdgp_bbvaloli__'?'loli':ctaKey==='__usdgp_bbvahugo__'?'hugo':((q==='loli'||q==='hugo')?q:((co==='loli'||co==='hugo')?co:'shared'));
    conFecha(function(f){
      var ups={},refs=[];
      if(quien==='loli')refs.push(aporte(ups,f,'Cuenta Loli','Efectivo Loli',pesos));
      else if(quien==='hugo')refs.push(aporte(ups,f,'Cuenta Hugo','Efectivo Hugo',pesos));
      else{var mitad=Math.round(pesos/2);refs.push(aporte(ups,f,'Cuenta Loli','Efectivo Loli',mitad));refs.push(aporte(ups,f,'Cuenta Hugo','Efectivo Hugo',pesos-mitad));}
      cb(ups,refs.join(','));
    });
    return;
  }
  var ctaNombre=(D.cuentas[ctaKey]||{}).nombre||'';
  resolverCtaAU(ctaKey,ctaNombre,function(ctaAU){
    conFecha(function(f){
      var ups={},ref;
      if(AU_SOCIO_MAP[ctaAU])ref=aporte(ups,f,AU_SOCIO_MAP[ctaAU],ctaAU,pesos);
      else{var k=DB.ref('aj').push().key;ups['aj/'+k]={fecha:f,mes:f.slice(0,7),tipo:'egreso',sub:'inversion',clasificacion:'inversion',cuenta:ctaAU,concepto:concepto,monto:pesos,edificio:'General',origen:'Cuentas Personales'};ref='aj/'+k;}
      cb(ups,ref);
    });
  });
}

function deudaTarjeta(tk){

// ── Pagos de tarjeta desde AU: automáticos a partir de esta fecha (los anteriores se cargan a mano) ──
var TJ_AUTO_DESDE='2026-09-30';
function _normTxt(t){return String(t||'').toLowerCase().replace(/\s+/g,' ').trim();}
function pagoTJdeAU(mv,k){
  var txt=_normTxt((mv.cuenta_caja||'')+' '+(mv.nota||''));
  var tj=cuentasTarj().filter(function(t){var nm=_normTxt(t.nombre);return nm&&txt.indexOf(nm)>=0;}).sort(function(a,b){return String(b.nombre).length-String(a.nombre).length;})[0];
  if(!tj)return null;
  var monto=Math.round(+mv.monto||0),fecha=mv.fecha||(cM+'-01');
  // ¿ya está cargado a mano? mismo monto, misma tarjeta, ±3 días
  var dup=false;Object.keys(D.gastos||{}).forEach(function(mm){var g=D.gastos[mm]||{};Object.keys(g).forEach(function(kk){var x=g[kk];
    if(x.tipo==='pagotj'&&x.tjCta===tj._k&&x.moneda!=='usd'&&Math.round(+x.monto||0)===monto&&_diasEntre(x.fecha||'',fecha)<=3)dup=true;});});
  if(dup)return 'dup';
  // cierre: el último cierre cargado anterior (o igual) a la fecha del pago
  var cs=[];var cr=(D.cuentas[tj._k]||{}).cierres||{};Object.keys(cr).forEach(function(id){if(cr[id]&&cr[id].cierre)cs.push(cr[id].cierre);});
  Object.keys(D.gastos||{}).forEach(function(mm){var g=D.gastos[mm]||{};Object.keys(g).forEach(function(kk){var x=g[kk];if(x.tipo==='pagotj'&&x.tjCta===tj._k&&x.cierre)cs.push(x.cierre);});});
  cs=cs.filter(function(c){return c<=fecha;}).sort();
  var cierre=cs.length?cs[cs.length-1]:fecha;
  // sale de: cuenta 🏢 empresa que coincida con la caja de AU (sigue contando como retiro del socio)
  var cc=_normTxt(mv.cuenta_caja),emp=null;
  if(cc){emp=cuentasEmp().filter(function(c){return _normTxt(c.nombre).indexOf(cc)===0;}).sort(function(a,b){return String(a.nombre).length-String(b.nombre).length;})[0]||cuentasEmp().filter(function(c){return _normTxt(c.nombre).indexOf(cc)>=0;})[0]||null;}
  var rec={fecha:fecha,tipo:'pagotj',monto:monto,cuenta:emp?emp._k:'',tjCta:tj._k,cierre:cierre,desc:'Pago resumen '+tj.nombre+' (cierre '+cierre+') · desde AU',_emp:k,_pagoid:'au'+k};
  if(!cs.length)rec._cierreAuto=true;
  return rec;
}
function _collectEmp(allMovs,allCob,allCst){
  var yaImp={};movsMes(cM).forEach(function(g){if(g._emp)yaImp[g._emp]=true;});
  var desc=D.descartados||{};
  var ups={},n=0,diag={tot:0,mes:0,ej:[]};
  Object.keys(allMovs).forEach(function(k){var mv=allMovs[k];if(String(mv.fecha||'').slice(0,7)!==cM||yaImp[k]||desc[k])return;
    if((mv.origen||'')==='Cuentas Personales')return; // salió de acá (ej. inversión de empresa): no duplicar
    var sub=String(mv.tipo||'').toLowerCase();
    // Pago de tarjeta hecho en AU (retiro que nombra una tarjeta) → entra como Pago resumen, no como mov. de empresa
    if(sub==='retiro'&&(mv.fecha||'')>=TJ_AUTO_DESDE){var pg=pagoTJdeAU(mv,k);if(pg){if(pg!=='dup'){ups['cn_gastos/'+cM+'/'+DB.ref('cn_gastos/'+cM).push().key]=pg;n++;}return;}}
    var descr=(mv.tipo||'Mov empresa')+(mv.cuenta_caja?' · '+mv.cuenta_caja:'')+(mv.nota?' - '+mv.nota:'');
    ups['cn_gastos/'+cM+'/'+DB.ref('cn_gastos/'+cM).push().key]={fecha:mv.fecha||(cM+'-01'),desc:descr,monto:Math.round(+mv.monto||0),tipo:'empresa',subtipo:sub,cuenta:'',ctaAU:mv.cuenta_caja||'',_emp:k};n++;});
  function esSocioCta(c){return /loli|hugo/i.test(c||'')&&!/bco/i.test(c||'');}
  Object.keys(allCob).forEach(function(ck){var c=allCob[ck],pagos=c.pagos||{};Object.keys(pagos).forEach(function(pk){var p=pagos[pk];
    if(!esSocioCta(p.cuenta))return;diag.tot++;if(diag.ej.length<6)diag.ej.push((p.fecha||'sin fecha')+' · '+(p.cuenta||'?')+' · $'+Math.round(+p.monto||0));
    if(String(p.fecha||'').slice(0,7)!==cM)return;diag.mes++;
    var id='cob:'+ck+':'+pk;if(yaImp[id]||desc[id])return;
    ups['cn_gastos/'+cM+'/'+DB.ref('cn_gastos/'+cM).push().key]={fecha:p.fecha||(cM+'-01'),desc:'Cobro '+(c.unidad||'')+' - '+(c.inq||'')+' ('+(p.cuenta||'')+')',monto:Math.round(+p.monto||0),tipo:'empresa',subtipo:'cobro',cuenta:'',ctaAU:p.cuenta||'',_emp:id};n++;});});
  // Costos pagados con cuenta de socio (nodo cst) → aporte del socio en la columna Socios de AU
  var CTAS_SOC=["Efectivo Loli","Efectivo Hugo","MP Loli","MP Hugo","ML Loli","ML Hugo","Master BBVA Hugo","Visa BBVA Hugo","Visa BBVA Loli","Master BBVA Loli"];
  function ctaKeyByName(nm){var f=arr(D.cuentas).filter(function(c){return c.nombre===nm;})[0];return f?f._k:'';}
  diag.cTot=0;diag.cMes=0;diag.cOrig=0;diag.cYa=0;diag.cEj=[];
  Object.keys(allCst||{}).forEach(function(ck){var c=allCst[ck];
    var esCP=((c.origen||'')==='Cuentas Personales');
    function addAporte(ctaNom,monto,fecha,idKey){
      if(CTAS_SOC.indexOf(ctaNom)<0)return;
      diag.cTot++;
      if(String(fecha||'').slice(0,7)===cM){diag.cMes++;if(diag.cEj.length<8)diag.cEj.push((fecha||'?')+' · '+ctaNom+' · $'+Math.round(+monto||0)+' · '+(c.desc||'')+(esCP?' [origenCP]':''));}
      if(esCP){diag.cOrig++;return;} // no duplicar lo que mandé desde acá
      if(String(fecha||'').slice(0,7)!==cM)return;
      var id='cst:'+idKey;if(yaImp[id]||desc[id]){diag.cYa++;return;}
      ups['cn_gastos/'+cM+'/'+DB.ref('cn_gastos/'+cM).push().key]={fecha:fecha||(cM+'-01'),desc:(c.desc||'Costo')+' · '+ctaNom,monto:Math.round(+monto||0),tipo:'empresa',subtipo:'aporte',cuenta:ctaKeyByName(ctaNom),ctaAU:ctaNom,_emp:id};n++;
    }
    if(c.pagos&&Object.keys(c.pagos).length){
      Object.keys(c.pagos).forEach(function(pk){var pg=c.pagos[pk];addAporte(pg.cuenta||c.cuenta,pg.monto,pg.fecha,ck+':'+pk);});
    } else if(c.pagado){
      addAporte(c.cuenta,c.monto,c.fecha_pago||c.fec_venc,ck);
    }
  });
  return {ups:ups,n:n,diag:diag};
}

  function gastosDeResumen(dim,key){

function _venderBienYaEnCaja(src,k,c){
  var f=(prompt('¿Qué día se registró el ingreso en la caja de la empresa? (AAAA-MM-DD)',new Date().toISOString().split('T')[0])||'').trim();
  if(!f)return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(f)){alert('Fecha inválida (AAAA-MM-DD)');return;}
  var cands=arr(D.aj).filter(function(a){return a.tipo==='ingreso'&&a.fecha===f&&!a.ventaBienRef;});
  if(!cands.length){alert('No encontré ningún ingreso del '+f+' en la caja de la empresa (AU).\n\nRevisá la fecha; si todavía no está cargado, usá "No" para registrarlo.');return;}
  var lista=cands.map(function(a,i){return (i+1)+') '+(a.concepto||a.sub||'Ingreso')+' — '+p$(+a.monto||0);}).join('\n');
  var sel=prompt('Ingresos del '+f+' en la caja de la empresa.\nElegí cuál es la venta de "'+(c.desc||'')+'":\n\n'+lista);
  if(sel===null)return;
  var idx=parseInt(sel)-1;
  if(isNaN(idx)||idx<0||idx>=cands.length){alert('Número inválido. Cancelado.');return;}
  var mv=cands[idx];
  var precioPesos=Math.round(+mv.monto||0);
  var esUsdBien=Number(c.usd||0)>0;
  var tc=0,valorRegUsd=Number(c.usd||0),precio,valorReg,montoRealUsd=null;
  if(esUsdBien){
    var tcStr=prompt('El bien está en dólares (U$S '+valorRegUsd.toLocaleString('es-AR')+') y la venta entró en PESOS ('+p$(precioPesos)+') el '+f+'.\n¿Qué TC (pesos por dólar) había ESE día? Lo paso a dólares.','');
    if(tcStr===null)return;
    tc=Number(String(tcStr).replace(/[^0-9.]/g,''))||0;
    if(!tc){alert('Falta el TC. Cancelado.');return;}
    montoRealUsd=Math.round(precioPesos/tc);
    precio=montoRealUsd;valorReg=valorRegUsd; // todo en dólares
  } else {
    precio=precioPesos;valorReg=Number(c.ars||0); // bien en pesos
  }
  var resultado=precio-valorReg;
  var comprador=(prompt('¿A quién se lo vendiste? (opcional)','')||'').trim();
  var resTxt=(resultado>=0?'GANANCIA ':'PÉRDIDA ')+(esUsdBien?pUsd(Math.abs(resultado)):p$(Math.abs(resultado)));
  var detalle=esUsdBien?(p$(precioPesos)+' ÷ TC '+tc.toLocaleString('es-AR')+' = U$S '+montoRealUsd.toLocaleString('es-AR')+'\nValor registrado: U$S '+valorRegUsd.toLocaleString('es-AR')):('Valor registrado: '+p$(valorReg));
  if(!confirm('Unir la venta de "'+(c.desc||'')+'" con este ingreso YA cargado:\n\n'+(mv.concepto||mv.sub||'Ingreso')+' — '+p$(precioPesos)+' ('+f+')\n\n'+detalle+'\nResultado: '+resTxt+'\n\nNO se crea otro ingreso. El bien pasa a "Vendidos".'))return;
  var node=(src==='inv')?'inv':'fin_capital';
  var ups={};
  ups[node+'/'+k+'/vendido']=true;
  ups[node+'/'+k+'/venta_fecha']=f;
  ups[node+'/'+k+'/venta_precio']=precio;
  ups[node+'/'+k+'/venta_moneda']=esUsdBien?'usd':'pesos';
  ups[node+'/'+k+'/venta_valorReg']=valorReg;
  ups[node+'/'+k+'/venta_resultado']=resultado;
  ups[node+'/'+k+'/venta_comprador']=comprador;
  ups[node+'/'+k+'/venta_yaEnCaja']=true;
  ups[node+'/'+k+'/venta_ajRef']=mv._k;
  if(esUsdBien){ups[node+'/'+k+'/venta_tc']=tc;ups[node+'/'+k+'/venta_pesos']=precioPesos;ups[node+'/'+k+'/venta_usd']=montoRealUsd;}
  ups['aj/'+mv._k+'/ventaBienRef']=k;
  ups['aj/'+mv._k+'/ventaBienDesc']=c.desc||'';
  spin(true);DB.ref('/').update(ups,function(){spin(false);alert('✅ Unido. "'+(c.desc||'')+'" quedó vendido y enlazado al ingreso del '+f+' (no se duplicó). '+resTxt+'.');render();});
}

  ups['fin_capital/'+k+'/venta_valorReg']=valorReg;
  ups['fin_capital/'+k+'/venta_resultado']=resultado;
  ups['fin_capital/'+k+'/venta_comprador']=comprador;

  spin(true);DB.ref('/').update(ups,function(){spin(false);alert('✅ Vendido. '+resTxt+'.\n'+(yaEnCaja?'La plata ya estaba en la caja (no se duplicó).':'La plata entró en '+(esUsd?'dólares':destCaja.nombre)+'.')+' Quedó en "Vendidos".');render();});
