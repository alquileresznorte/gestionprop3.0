<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Cuentas Personales</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0B1120;color:#E2E8F0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;padding-bottom:60px}
  .wrap{max-width:900px;margin:0 auto;padding:12px}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#111827;border-bottom:1px solid #1F2937;position:sticky;top:0;z-index:20}
  .brand{font-weight:800;font-size:16px;color:#A78BFA;letter-spacing:.5px}
  .nav{display:flex;gap:4px;flex-wrap:wrap;padding:8px 12px;background:#0F172A;position:sticky;top:44px;z-index:19;border-bottom:1px solid #1F2937}
  .nbtn{background:#1E293B;color:#94A3B8;border:none;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer}
  .nbtn.on{background:#7C3AED;color:#fff}
  .sec{font-size:16px;font-weight:800;margin:14px 0 8px;color:#E2E8F0}
  .sub{font-size:12px;color:#94A3B8;margin-bottom:8px;line-height:1.5}
  .card{background:#111827;border:1px solid #1F2937;border-radius:12px;padding:14px;margin-bottom:12px}
  .btn{background:#7C3AED;color:#fff;border:none;border-radius:8px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer}
  .btn.g{background:#334155;color:#CBD5E1}
  .btn.ok{background:#065F46;color:#A7F3D0}
  .btn.dz{background:#7F1D1D;color:#FCA5A5}
  .btn.sm{padding:5px 10px;font-size:11px}
  input,select{width:100%;background:#0F172A;border:1px solid #334155;border-radius:8px;padding:10px;color:#E2E8F0;font-size:15px}
  label{font-size:12px;color:#94A3B8;display:block;margin-bottom:4px}
  .fg{margin-bottom:12px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #1E293B}
  .row:last-child{border-bottom:none}
  .pill{font-size:10px;background:#1E293B;color:#93C5FD;border-radius:6px;padding:2px 7px}
  .pill.tj{color:#F0ABFC}
  .muted{color:#64748B;font-size:11px}
  .empty{color:#64748B;font-size:13px;padding:16px;text-align:center}
  .ctab{width:100%;border-collapse:collapse;font-size:13px}
  .ctab th,.ctab td{padding:6px 8px;border-bottom:1px solid #1E293B;vertical-align:top}
  .spin{position:fixed;top:8px;right:8px;width:14px;height:14px;border:2px solid #7C3AED;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:none;z-index:50}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="spin" id="spin"></div>
<div class="topbar"><span class="brand">CUENTAS</span><span class="muted" id="hoy"></span></div>
<div class="nav" id="nav"></div>
<div class="wrap" id="app"><div class="empty">Cargando…</div></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({apiKey:'AIzaSyDhuSP_WTWI3hqf5GqgFExkptFfpqJUn50',authDomain:'gestion-prop.firebaseapp.com',databaseURL:'https://gestion-prop-default-rtdb.firebaseio.com',projectId:'gestion-prop'});
var DB=firebase.database();

// ── Estado ─ nodos cn_* (lo nuevo) + nodos viejos solo para Capital e importar
var D={cuentas:{},rubros:{},gastos:{},gastosVj:{},aho:{},cfgAho:{},ahoWho:{},inv:{},invWho:{},usdMovs:{},capOld:{}};
var TAB='cargar';
var CTIPO='gasto';
var cM='2026-08';
var MESES=['2026-06','2026-07','2026-08','2026-09'];

function spin(on){document.getElementById('spin').style.display=on?'block':'none';}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fbSet(p,v){spin(true);DB.ref(p).set(v,function(){spin(false);});}
function fbRm(p){spin(true);DB.ref(p).remove(function(){spin(false);});}
function arr(o){o=o||{};return Object.keys(o).map(function(k){var x=Object.assign({},o[k]);x._k=k;return x;});}
function p$(n){n=Math.round(+n||0);return '$'+n.toLocaleString('es-AR');}
function pU(n){return 'U$S '+Math.round(+n||0).toLocaleString('es-AR');}
function money2num(v){return Math.round(Number(String(v||'').replace(/[^\d]/g,''))||0);}
function byOrden(a,b){return (a.orden||0)-(b.orden||0);}
function opt(v,lbl,cur){return '<option value="'+esc(v)+'"'+(String(cur)===String(v)?' selected':'')+'>'+esc(lbl)+'</option>';}

function bind(node,key){DB.ref(node).on('value',function(s){D[key]=s.exists()?s.val():{};render();});}
bind('cn_cuentas','cuentas');
bind('cn_rubros','rubros');
bind('cn_gastos','gastos');
bind('fin_gastos','gastosVj');
bind('aho','aho');bind('cfg_aho','cfgAho');bind('fin_aho_who','ahoWho');
bind('inv','inv');bind('fin_inv_who','invWho');bind('fin_usdMovs','usdMovs');bind('fin_capital','capOld');
document.getElementById('hoy').textContent=new Date().toLocaleDateString('es-AR');

// ── Personas / cuentas / rubros ────────────────────────────────────────────
var ADULTOS=['loli','hugo'];
function persLbl(p){p=String(p||'').toLowerCase();return p==='loli'?'💜 Loli':p==='hugo'?'💙 Hugo':(p==='familia'||p==='shared')?'👪 Familia':p==='empresa'?'🏢 Empresa':p==='casa'?'🏠 Casa':'—';}
function quienOpts(sel){return ADULTOS.map(function(p){return opt(p,persLbl(p),sel);}).join('');}
function corrOpts(sel){return ADULTOS.map(function(p){return opt(p,persLbl(p),sel);}).join('')+opt('familia','👪 Familia (50/50)',sel)+opt('empresa','🏢 Empresa',sel);}
function cuentasCaja(){return arr(D.cuentas).filter(function(c){return c.tipo==='caja';}).sort(byOrden);}
function cuentasTarj(){return arr(D.cuentas).filter(function(c){return c.tipo==='tarjeta';}).sort(byOrden);}
function cuentaById(k){return D.cuentas[k];}
function rubrosList(){return arr(D.rubros).sort(byOrden);}
function ctaOpts(sel){var o='<optgroup label="Cajas">'+cuentasCaja().map(function(c){return opt(c._k,c.nombre,sel);}).join('')+'</optgroup>';var t=cuentasTarj();if(t.length)o+='<optgroup label="Tarjetas">'+t.map(function(c){return opt(c._k,'💳 '+c.nombre,sel);}).join('')+'</optgroup>';return o;}

// Movimientos del mes (solo lo cargado en la app nueva)
function movsMes(mes){return (D.gastos&&D.gastos[mes])?arr(D.gastos[mes]):[];}

// ── Navegación ────────────────────────────────────────────────────────────
var TABS=[['cargar','➕ Cargar'],['mov','Movimientos'],['capital','Capital'],['resumen','Resumen'],['config','⚙ Config']];
function go(t){TAB=t;render();}
function selMes(){return '<div class="fg"><label>Mes</label><select onchange="cM=this.value;render()">'+MESES.map(function(m){return '<option'+(m===cM?' selected':'')+'>'+m+'</option>';}).join('')+'</select></div>';}
function render(){
  document.getElementById('nav').innerHTML=TABS.map(function(t){return '<button class="nbtn'+(TAB===t[0]?' on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>';}).join('');
  var app=document.getElementById('app');
  if(TAB==='cargar')app.innerHTML=vCargar();
  else if(TAB==='mov')app.innerHTML=vMov();
  else if(TAB==='capital')app.innerHTML=vCapital();
  else if(TAB==='resumen')app.innerHTML=vResumen();
  else if(TAB==='config')app.innerHTML=vConfig();
}

// ── CARGAR (el cuadro único) ───────────────────────────────────────────────
function vCargar(){
  var hoy=new Date().toISOString().split('T')[0];
  var o='<div class="sec">➕ Cargar movimiento</div>';
  if(!rubrosList().length||!cuentasCaja().length) o+='<div class="card"><div class="sub">⚠ Antes de cargar, andá a <b>⚙ Config</b> y creá tus <b>rubros</b> y <b>cuentas</b> (hay botones para cargar los sugeridos).</div></div>';
  o+='<div class="card">';
  o+='<div class="g2"><div><label>Tipo</label><select id="c-tipo" onchange="CTIPO=this.value;render()">'+opt('gasto','🔴 Gasto',CTIPO)+opt('ingreso','🟢 Ingreso',CTIPO)+opt('transfer','🔄 Mov. entre cuentas',CTIPO)+'</select></div><div><label>Fecha</label><input type="date" id="c-fecha" value="'+hoy+'"/></div></div>';
  if(CTIPO==='transfer'){
    o+='<div class="g2"><div><label>Sale de</label><select id="c-out"><option value="">— elegí —</option>'+ctaOpts('')+'</select></div><div><label>Entra a</label><select id="c-in"><option value="">— elegí —</option>'+ctaOpts('')+'</select></div></div>';
    o+='<div class="g2"><div><label>Monto $</label><input id="c-monto" inputmode="numeric" placeholder="0"/></div><div><label>Nota (opcional)</label><input id="c-desc" placeholder="Ej: paso plata a MP"/></div></div>';
    o+='<div class="sub">Mueve el saldo de una cuenta a la otra. No cuenta como gasto de nadie.</div>';
  } else {
    o+='<div class="g2"><div><label>Qué (detalle)</label><input id="c-desc" placeholder="Ej: shampoo, colegio Max, nafta"/></div><div><label>Monto $</label><input id="c-monto" inputmode="numeric" placeholder="0"/></div></div>';
    o+='<div class="fg"><label>Rubro (en qué / para quién)</label><select id="c-rubro"><option value="">— elegí —</option>'+rubrosList().map(function(r){return opt(r.nombre,r.nombre,'');}).join('')+'</select></div>';
    o+='<div class="g3">';
    o+='<div><label>Quién lo hizo</label><select id="c-quien">'+quienOpts('loli')+'</select></div>';
    o+='<div><label>Corresponde (división)</label><select id="c-corr">'+corrOpts('familia')+'</select></div>';
    o+='<div><label>Con qué se pagó</label><select id="c-cta"><option value="">— elegí —</option>'+ctaOpts('')+'</select></div>';
    o+='</div>';
  }
  o+='<button class="btn" style="width:100%" onclick="guardarMov()">Guardar</button>';
  o+='</div>';
  // Últimos cargados
  var ult=movsMes(cM).sort(function(a,b){return String(b.fecha||'').localeCompare(String(a.fecha||''));}).slice(0,6);
  if(ult.length){
    o+='<div class="sec" style="font-size:13px">Últimos cargados en '+cM+'</div><div class="card">';
    ult.forEach(function(g){o+=movRow(g,true);});
    o+='</div>';
  }
  return o;
}
function guardarMov(){
  var tipo=(document.getElementById('c-tipo')||{}).value||'gasto';
  var f=(document.getElementById('c-fecha')||{}).value;
  var m=money2num((document.getElementById('c-monto')||{}).value);
  var d=((document.getElementById('c-desc')||{}).value||'').trim();
  if(!m){alert('Poné el monto');return;}
  var mes=(f&&f.length>=7)?f.slice(0,7):cM;
  var key=DB.ref('cn_gastos/'+mes).push().key;
  var obj;
  if(tipo==='transfer'){
    var out=(document.getElementById('c-out')||{}).value||'';
    var inn=(document.getElementById('c-in')||{}).value||'';
    if(!out||!inn){alert('Elegí de qué cuenta sale y a qué cuenta entra');return;}
    if(out===inn){alert('Tienen que ser cuentas distintas');return;}
    obj={fecha:f||(mes+'-01'),tipo:'transfer',monto:m,ctaOut:out,ctaIn:inn,desc:d||'Movimiento entre cuentas'};
  } else {
    if(!d){alert('Poné el detalle (Qué)');return;}
    obj={fecha:f||(mes+'-01'),desc:d,monto:m,tipo:tipo,rubro:(document.getElementById('c-rubro')||{}).value||'',quien:(document.getElementById('c-quien')||{}).value||'',corresponde:(document.getElementById('c-corr')||{}).value||'familia',cuenta:(document.getElementById('c-cta')||{}).value||''};
  }
  spin(true);DB.ref('cn_gastos/'+mes+'/'+key).set(obj,function(){spin(false);
    ['c-desc','c-monto'].forEach(function(id){var e=document.getElementById(id);if(e)e.value='';});
    var e=document.getElementById('c-desc');if(e)e.focus();
    render();
  });
}
function delMov(mes,key){if(!confirm('Borrar este movimiento?'))return;fbRm('cn_gastos/'+mes+'/'+key);}

// Fila de un movimiento
function movRow(g,showDel){
  var mesK=String(g.fecha||cM).slice(0,7);
  if(g.tipo==='transfer'){
    var no=g.ctaOut&&cuentaById(g.ctaOut)?cuentaById(g.ctaOut).nombre:'?';
    var ni=g.ctaIn&&cuentaById(g.ctaIn)?cuentaById(g.ctaIn).nombre:'?';
    var t='<div class="row"><div style="flex:1"><div style="font-weight:600">🔄 '+esc(no)+' → '+esc(ni)+'</div><div class="muted">'+esc(String(g.fecha||'').slice(5))+(g.desc&&g.desc!=='Movimiento entre cuentas'?' · '+esc(g.desc):'')+'</div></div><div style="text-align:right;font-weight:700;color:#93C5FD">'+p$(g.monto)+'</div>';
    if(showDel)t+='<button class="btn dz sm" style="margin-left:8px" onclick="delMov(\''+mesK+'\',\''+g._k+'\')">🗑</button>';
    return t+'</div>';
  }
  var ing=g.tipo==='ingreso';
  var ctaN=g.cuenta&&cuentaById(g.cuenta)?cuentaById(g.cuenta).nombre:'';
  var tj=g.cuenta&&cuentaById(g.cuenta)&&cuentaById(g.cuenta).tipo==='tarjeta';
  var o='<div class="row">';
  o+='<div style="flex:1"><div style="font-weight:600">'+(ing?'🟢 ':'')+esc(g.desc||'')+(g.rubro?' <span class="pill">'+esc(g.rubro)+'</span>':'')+(tj?' <span class="pill tj">💳</span>':'')+'</div>';
  o+='<div class="muted">'+esc(String(g.fecha||'').slice(5))+(g.quien?' · hizo '+persLbl(g.quien):'')+' · '+persLbl(g.corresponde)+(ctaN?' · '+esc(ctaN):'')+'</div></div>';
  o+='<div style="text-align:right;font-weight:700;color:'+(ing?'#10B981':'#E2E8F0')+'">'+(ing?'+':'')+p$(g.monto)+'</div>';
  if(showDel)o+='<button class="btn dz sm" style="margin-left:8px" onclick="delMov(\''+(String(g.fecha||cM).slice(0,7))+'\',\''+g._k+'\')">🗑</button>';
  o+='</div>';
  return o;
}

// ── MOVIMIENTOS (lista + saldos) ───────────────────────────────────────────
function saldoCaja(ck){
  var ini=Number((D.cuentas[ck]||{}).saldoIni||0),mov=0;
  movsMes(cM).forEach(function(g){var m=Math.round(+g.monto||0);
    if(g.tipo==='transfer'){if(g.ctaOut===ck)mov-=m;if(g.ctaIn===ck)mov+=m;return;}
    if(g.cuenta!==ck)return;mov+=(g.tipo==='ingreso'?m:-m);});
  return ini+mov;
}
function setSaldoIni(ck){var c=D.cuentas[ck];if(!c)return;var v=prompt('Saldo inicial de '+c.nombre+' (para '+cM+'):',c.saldoIni||0);if(v===null)return;fbSet('cn_cuentas/'+ck+'/saldoIni',money2num(v));}
function vMov(){
  var o='<div class="sec">Movimientos — '+cM+'</div>'+selMes();
  var cajas=cuentasCaja();
  if(cajas.length){
    o+='<div class="sub" style="margin-bottom:4px">Saldos (inicial + ingresos − gastos) · tocá ✏ para el saldo inicial</div>';
    o+='<div style="display:flex;gap:8px;overflow-x:auto;margin-bottom:12px">';
    cajas.forEach(function(c){var s=saldoCaja(c._k);o+='<div style="background:#0F172A;border:1px solid #1F2937;border-radius:10px;padding:9px 13px;min-width:120px"><div class="muted">'+esc(c.nombre)+' <span style="cursor:pointer" onclick="setSaldoIni(\''+c._k+'\')">✏</span></div><div style="font-weight:800;font-size:15px;color:'+(s<0?'#EF4444':'#10B981')+'">'+p$(s)+'</div></div>';});
    o+='</div>';
  }
  var gs=movsMes(cM).sort(function(a,b){return String(a.fecha||'').localeCompare(String(b.fecha||''));});
  o+='<div class="card">';
  o+='<div style="font-weight:700;margin-bottom:6px">'+gs.length+' movimiento(s) en '+cM+'</div>';
  var vj=(D.gastosVj&&D.gastosVj[cM])?arr(D.gastosVj[cM]).filter(function(g){return (g.cur||'ARS')==='ARS';}).length:0;
  if(vj) o+='<div class="sub">Hay '+vj+' gasto(s) del '+cM+' en la app vieja. <button class="btn ok sm" onclick="importarMes()">⬇ Traerlos acá (editables)</button></div>';
  if(!gs.length) o+='<div class="empty">Todavía no cargaste nada en '+cM+'. Usá la pestaña ➕ Cargar.</div>';
  else gs.forEach(function(g){o+=movRow(g,true);});
  o+='</div>';
  return o;
}
function importarMes(){
  var vj=(D.gastosVj&&D.gastosVj[cM])?arr(D.gastosVj[cM]).filter(function(g){return (g.cur||'ARS')==='ARS';}):[];
  if(!vj.length){alert('No hay gastos viejos en '+cM+'.');return;}
  var yaImp={};movsMes(cM).forEach(function(g){if(g._imp)yaImp[g._imp]=true;});
  var nuevos=vj.filter(function(g){return !yaImp[g._k];});
  if(!nuevos.length){alert('Ya están todos importados.');return;}
  if(!confirm('Traer '+nuevos.length+' gasto(s) de '+cM+' de la app vieja? Quedan editables acá. (Lo que ya importaste no se duplica.)'))return;
  var ups={};
  nuevos.forEach(function(g){
    var corr=g.who==='hugo'?'hugo':(g.who==='shared'?'familia':'loli');
    var rub=(g.cuenta_nueva&&g.cuenta_nueva!=='__empresa__'&&g.cuenta_nueva!=='__descartar__')?g.cuenta_nueva:'';
    var key=DB.ref('cn_gastos/'+cM).push().key;
    ups['cn_gastos/'+cM+'/'+key]={fecha:g.fecha||(cM+'-01'),desc:g.desc||'Gasto',monto:Math.round(+g.monto||0),tipo:'gasto',rubro:rub,quien:'',corresponde:corr,cuenta:'',_imp:g._k};
  });
  spin(true);DB.ref('/').update(ups,function(){spin(false);render();});
}

// ── RESUMEN ────────────────────────────────────────────────────────────────
function vResumen(){
  var o='<div class="sec">Resumen — '+cM+'</div>'+selMes();
  var gs=movsMes(cM).filter(function(g){return g.tipo!=='ingreso'&&g.tipo!=='transfer';});
  if(!gs.length) return o+'<div class="card"><div class="empty">No hay gastos en '+cM+'.</div></div>';
  var corr={},rub={},quien={},caja={},total=0;
  gs.forEach(function(g){var m=Math.round(+g.monto||0);total+=m;
    var c=g.corresponde||'familia';corr[c]=(corr[c]||0)+m;
    var r=g.rubro||'(sin rubro)';rub[r]=(rub[r]||0)+m;
    var q=g.quien||'(sin dato)';quien[q]=(quien[q]||0)+m;
    var ck=g.cuenta,nm=ck&&cuentaById(ck)?cuentaById(ck).nombre:'(sin cuenta)';caja[nm]=(caja[nm]||0)+m;
  });
  function tabla(t,obj,fmt){var ks=Object.keys(obj).sort(function(a,b){return obj[b]-obj[a];});if(!ks.length)return '';var x='<div class="card"><div style="font-weight:700;margin-bottom:6px">'+t+'</div><table class="ctab">';ks.forEach(function(k){x+='<tr><td>'+fmt(k)+'</td><td style="text-align:right;font-weight:700">'+p$(obj[k])+'</td></tr>';});return x+'</table></div>';}
  o+='<div class="card" style="text-align:center"><div class="muted">Total gastado en '+cM+'</div><div style="font-size:22px;font-weight:800;color:#EF4444">'+p$(total)+'</div></div>';
  o+=tabla('👪 A quién corresponde (división)',corr,persLbl);
  o+=tabla('📂 Por rubro (en qué / para quién)',rub,function(k){return esc(k);});
  o+=tabla('🙋 Quién lo hizo',quien,function(k){return k==='(sin dato)'?'<span class="muted">(sin dato)</span>':persLbl(k);});
  o+=tabla('💳 Quién pagó (financiero)',caja,function(k){return esc(k);});
  return o;
}

// ── CONFIG ─────────────────────────────────────────────────────────────────
function vConfig(){
  var o='<div class="sec">⚙ Configuración</div>';
  // CUENTAS
  o+='<div class="card"><div style="font-weight:700;margin-bottom:4px">🏦 Cuentas</div>';
  o+='<div class="sub">Cajas (Efectivo, ML) = tienen saldo. Tarjetas (MP, BBVA) = van al circuito de tarjetas.</div>';
  var cs=arr(D.cuentas).sort(byOrden);
  if(!cs.length) o+='<div class="empty">Sin cuentas. Cargá las sugeridas.</div>';
  else o+=cs.map(function(c){return '<div class="row"><span style="flex:1">'+esc(c.nombre)+' <span class="pill'+(c.tipo==='tarjeta'?' tj':'')+'">'+(c.tipo==='tarjeta'?'💳 tarjeta':'caja')+'</span></span><button class="btn dz sm" onclick="delCuenta(\''+c._k+'\')">🗑</button></div>';}).join('');
  o+='<div style="margin-top:10px" class="g3"><div><label>Nombre</label><input id="nc-n" placeholder="Ej: ML Loli"/></div><div><label>Tipo</label><select id="nc-t"><option value="caja">Caja</option><option value="tarjeta">Tarjeta</option></select></div><div><label>De quién</label><select id="nc-d">'+quienOpts('loli')+'<option value="familia">👪 Familia</option></select></div></div>';
  o+='<button class="btn sm" onclick="addCuenta()">+ Agregar</button> <button class="btn ok sm" onclick="cuentasSug()">✨ Cargar sugeridas</button>';
  o+='</div>';
  // RUBROS
  o+='<div class="card"><div style="font-weight:700;margin-bottom:4px">📂 Rubros</div>';
  o+='<div class="sub">En qué se gasta / para quién. Incluí acá los que uses: alimentos, servicios, Max, Cris, aporte empresa, retiro empresa, etc. Agregá o sacá según aparezcan.</div>';
  var rs=rubrosList();
  if(!rs.length) o+='<div class="empty">Sin rubros. Cargá los sugeridos o agregá abajo.</div>';
  else o+=rs.map(function(r){return '<div class="row"><span style="flex:1">'+esc(r.nombre)+'</span><button class="btn dz sm" onclick="delRubro(\''+r._k+'\')">🗑</button></div>';}).join('');
  o+='<div style="margin-top:10px;display:flex;gap:6px"><input id="nr-n" placeholder="Ej: Mascota"/><button class="btn sm" onclick="addRubro()">+ Rubro</button></div>';
  o+='<div style="margin-top:8px"><button class="btn ok sm" onclick="rubrosSug()">✨ Cargar rubros sugeridos</button> <button class="btn ok sm" onclick="importarRubros()">✨ Importar de mis gastos</button></div>';
  o+='</div>';
  return o;
}
function addCuenta(){var n=(document.getElementById('nc-n').value||'').trim();if(!n){alert('Poné un nombre');return;}var key=DB.ref('cn_cuentas').push().key;fbSet('cn_cuentas/'+key,{nombre:n,tipo:document.getElementById('nc-t').value,dueno:document.getElementById('nc-d').value,orden:arr(D.cuentas).length});}
function delCuenta(k){var c=D.cuentas[k];if(!c)return;if(!confirm('Borrar "'+c.nombre+'"?'))return;fbRm('cn_cuentas/'+k);}
function cuentasSug(){
  var sug=[['Ef. Loli','caja','loli'],['Ef. Hugo','caja','hugo'],['ML Loli','caja','loli'],['ML Hugo','caja','hugo'],['MP Loli','tarjeta','loli'],['MP Hugo','tarjeta','hugo'],['Visa BBVA Loli','tarjeta','loli'],['Visa BBVA Hugo','tarjeta','hugo'],['Master BBVA Loli','tarjeta','loli'],['Master BBVA Hugo','tarjeta','hugo']];
  var ex=arr(D.cuentas).map(function(c){return c.nombre;});var nv=sug.filter(function(s){return ex.indexOf(s[0])<0;});
  if(!nv.length){alert('Ya están todas.');return;}if(!confirm('Cargar '+nv.length+' cuenta(s) sugeridas?'))return;
  var b=arr(D.cuentas).length,ups={};nv.forEach(function(s,i){ups['cn_cuentas/'+DB.ref('cn_cuentas').push().key]={nombre:s[0],tipo:s[1],dueno:s[2],orden:b+i};});
  spin(true);DB.ref('/').update(ups,function(){spin(false);});
}
function addRubro(){var n=(document.getElementById('nr-n').value||'').trim();if(!n){alert('Poné un nombre');return;}fbSet('cn_rubros/'+DB.ref('cn_rubros').push().key,{nombre:n,orden:arr(D.rubros).length});}
function delRubro(k){var r=D.rubros[k];if(!r)return;if(!confirm('Borrar rubro "'+r.nombre+'"?'))return;fbRm('cn_rubros/'+k);}
function rubrosSug(){
  var sug=['Alimentos','Vestimenta','Servicios','Mantenimiento','Salud','Transporte','Esparcimiento','Educación','Max','Cris','Aporte empresa','Retiro empresa'];
  var ex=rubrosList().map(function(r){return r.nombre;});var nv=sug.filter(function(s){return ex.indexOf(s)<0;});
  if(!nv.length){alert('Ya están todos.');return;}if(!confirm('Cargar '+nv.length+' rubro(s) sugerido(s)?'))return;
  var b=arr(D.rubros).length,ups={};nv.forEach(function(s,i){ups['cn_rubros/'+DB.ref('cn_rubros').push().key]={nombre:s,orden:b+i};});
  spin(true);DB.ref('/').update(ups,function(){spin(false);});
}
function importarRubros(){
  var set={};Object.keys(D.gastosVj||{}).forEach(function(mes){var g=D.gastosVj[mes]||{};Object.keys(g).forEach(function(k){var v=g[k].cuenta_nueva;if(v&&v!=='__empresa__'&&v!=='__descartar__')set[v]=true;});});
  var ex=rubrosList().map(function(r){return r.nombre;});var nv=Object.keys(set).filter(function(n){return ex.indexOf(n)<0;});
  if(!nv.length){alert('No hay rubros nuevos para importar.');return;}if(!confirm('Importar '+nv.length+' rubro(s) de tus gastos?\n\n'+nv.join(', ')))return;
  var b=arr(D.rubros).length,ups={};nv.forEach(function(n,i){ups['cn_rubros/'+DB.ref('cn_rubros').push().key]={nombre:n,orden:b+i};});
  spin(true);DB.ref('/').update(ups,function(){spin(false);});
}

// ── CAPITAL (mismo que el viejo, leyendo los mismos nodos) ──────────────────
function splitW(who,pct,amt){if(who==='loli')return{l:amt,h:0};if(who==='hugo')return{l:0,h:amt};var p=(+pct||50)/100;return{l:amt*p,h:amt*(1-p)};}
function wTag(who){var s="font-size:10px;border-radius:6px;padding:2px 7px;cursor:pointer;border:1px solid ";if(who==='loli')return s+"#7C3AED;color:#C4B5FD";if(who==='hugo')return s+"#3B82F6;color:#93C5FD";return s+"#334155;color:#94A3B8";}
function wLbl(who){return who==='loli'?'💜 Loli':who==='hugo'?'💙 Hugo':'🤝 50/50';}
function vCapital(){
  var ahoList=arr(D.aho),cfgA=D.cfgAho||{};
  var stockL=+cfgA.stock_usd_loli||0,stockH=+cfgA.stock_usd_hugo||0,stockSplit=(stockL>0||stockH>0);
  var stock=stockSplit?(stockL+stockH):(cfgA.stock_usd?+cfgA.stock_usd:0),stockFecha=cfgA.stock_fecha||'';
  function ahoOwner(a){return (D.ahoWho||{})[a._k]||'shared';}
  var comprasPost=0,comprasL=0,comprasH=0;
  ahoList.forEach(function(a){if(stock>0&&stockFecha&&(a.fecha||'')<=stockFecha)return;var u=+a.usd||0;comprasPost+=u;var s=splitW(ahoOwner(a),50,u);comprasL+=s.l;comprasH+=s.h;});
  var usdGP=stock+comprasPost;
  var invList=arr(D.inv).filter(function(i){return !i.vendido;});
  function invOwner(i){return (D.invWho||{})[i._k]||'shared';}
  var invGP=0,invL=0,invH=0;invList.forEach(function(i){var u=+i.usd||0;invGP+=u;var s=splitW(invOwner(i),50,u);invL+=s.l;invH+=s.h;});
  var capAct=arr(D.capOld).filter(function(c){return !c.vendido;});
  var capUSD=0,capL=0,capH=0,capARS=0;capAct.forEach(function(c){var u=+c.usd||0;capUSD+=u;var s=splitW(c.who||'shared',50,u);capL+=s.l;capH+=s.h;capARS+=(+c.ars||0);});
  var usdMovs=arr(D.usdMovs),gastadoUSD=0,gastL=0,gastH=0;usdMovs.forEach(function(m){var u=+m.usd||0;gastadoUSD+=u;var s=splitW(m.who||'shared',50,u);gastL+=s.l;gastH+=s.h;});
  var totalUSD=usdGP+invGP+capUSD-gastadoUSD;
  var totL=(stockSplit?stockL:0)+comprasL+invL+capL-gastL,totH=(stockSplit?stockH:0)+comprasH+invH+capH-gastH,sinAsig=stockSplit?0:stock;
  var o='<div class="sec">Capital</div>';
  o+='<div class="card" style="text-align:center"><div class="muted">Capital total</div><div style="font-size:26px;font-weight:800;color:#22D3EE">'+pU(totalUSD)+'</div>';
  o+='<div style="display:flex;justify-content:center;gap:16px;margin-top:6px;font-size:13px;flex-wrap:wrap"><span style="color:#C4B5FD">💜 Loli <b>'+pU(totL)+'</b></span><span style="color:#93C5FD">💙 Hugo <b>'+pU(totH)+'</b></span>'+(sinAsig>0?'<span style="color:#F59E0B">⚪ sin repartir <b>'+pU(sinAsig)+'</b></span>':'')+'</div>'+(capARS>0?'<div class="muted" style="margin-top:6px">+ '+p$(capARS)+' en pesos</div>':'')+'</div>';
  o+='<div class="sec">💵 Dólares GP ('+pU(usdGP)+')</div><div class="card">';
  if(stock>0){o+='<div class="row"><span style="flex:1;font-weight:700">Stock declarado'+(stockFecha?' al '+esc(stockFecha):'')+'</span><span style="color:#22D3EE;font-weight:700">'+pU(stock)+'</span><button class="btn g sm" onclick="capStockCfg()">✏</button></div>';o+=stockSplit?'<div class="muted">💜 Loli '+pU(stockL)+' · 💙 Hugo '+pU(stockH)+'</div>':'<div class="sub" style="color:#F59E0B">Stock sin repartir: tocá ✏.</div>';}
  else o+='<div class="sub" style="color:#64748B">Sin stock declarado. <button class="btn g sm" onclick="capStockCfg()">Declarar stock</button></div>';
  if(ahoList.length)ahoList.sort(function(a,b){return (a.fecha||'').localeCompare(b.fecha||'');}).forEach(function(a){var inc=stock>0&&stockFecha&&(a.fecha||'')<=stockFecha;o+='<div class="row" style="'+(inc?'opacity:.5;':'')+'font-size:12px"><span style="color:#64748B;min-width:74px">'+esc(a.fecha||'')+'</span><span style="flex:1;color:#22D3EE">'+pU(+a.usd||0)+'</span>'+(inc?'<span class="muted">incluida</span>':'<span style="'+wTag(ahoOwner(a))+'" onclick="capCycleAho(\''+a._k+'\')">'+wLbl(ahoOwner(a))+'</span>')+'</div>';});
  else o+='<div class="muted">Sin compras en GP.</div>';
  o+='</div>';
  if(invList.length){o+='<div class="sec">🏗 Inversiones GP ('+pU(invGP)+')</div><div class="card">';invList.forEach(function(i){var ow=invOwner(i);o+='<div class="row"><span style="flex:1">'+esc(i.desc||'')+(i.fecha?' <span class="muted">'+esc(i.fecha)+'</span>':'')+'</span><span style="color:#F59E0B;font-weight:700;margin-right:6px">'+pU(+i.usd||0)+'</span><span style="'+wTag(ow)+'" onclick="capCycleInv(\''+i._k+'\')">'+wLbl(ow)+'</span></div>';});o+='</div>';}
  if(usdMovs.length){o+='<div class="sec">Movimientos en dólares (−'+pU(gastadoUSD)+')</div><div class="card">';usdMovs.sort(function(a,b){return (a.fec||'').localeCompare(b.fec||'');}).forEach(function(m){var v=m.tipo==='venta';o+='<div class="row" style="font-size:12px"><div style="flex:1"><div>'+esc(m.desc||'')+'</div><div class="muted">'+esc(m.fec||'')+' · '+wLbl(m.who)+'</div></div><div style="text-align:right"><div style="color:#EF4444">−'+pU(+m.usd||0)+'</div>'+(v&&m.ars?'<div style="color:#10B981;font-size:11px">+'+p$(+m.ars)+'</div>':'')+'</div><button class="btn dz sm" onclick="capDelUsd(\''+m._k+'\')">🗑</button></div>';});o+='</div>';}
  o+='<div style="display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px"><div class="sec" style="margin:0">Activos adicionales</div><div style="display:flex;gap:6px"><button class="btn g sm" onclick="capAddUsdMov()">💱 Mover USD</button><button class="btn sm" onclick="capAddActivo()">+ Agregar</button></div></div>';
  if(capAct.length)capAct.forEach(function(c){o+='<div class="card" style="padding:10px"><div class="row" style="border:none;padding:0"><div style="flex:1"><div style="font-weight:600">'+esc(c.desc||'')+'</div><div class="muted">'+wLbl(c.who||'shared')+(c.fecha?' · '+esc(c.fecha):'')+'</div></div><div style="text-align:right"><div style="color:#22D3EE;font-weight:700">'+pU(+c.usd||0)+'</div>'+(c.ars?'<div class="muted">'+p$(+c.ars)+'</div>':'')+'</div><button class="btn dz sm" onclick="capDelActivo(\''+c._k+'\')">🗑</button></div></div>';});
  else o+='<div class="muted" style="padding:8px 0">Sin activos adicionales.</div>';
  return o;
}
function capCycleAho(k){var c=(D.ahoWho||{})[k]||'shared';fbSet('fin_aho_who/'+k,c==='shared'?'loli':c==='loli'?'hugo':'shared');}
function capCycleInv(k){var c=(D.invWho||{})[k]||'shared';fbSet('fin_inv_who/'+k,c==='shared'?'loli':c==='loli'?'hugo':'shared');}
function capStockCfg(){var c=D.cfgAho||{};var l=prompt('Stock U$S de LOLI:',c.stock_usd_loli!=null?c.stock_usd_loli:'');if(l===null)return;l=Number(String(l).replace(/[^0-9.]/g,''));if(isNaN(l)||l<0){alert('Inválido');return;}var h=prompt('Stock U$S de HUGO:',c.stock_usd_hugo!=null?c.stock_usd_hugo:'');if(h===null)return;h=Number(String(h).replace(/[^0-9.]/g,''));if(isNaN(h)||h<0){alert('Inválido');return;}var f=prompt('Fecha del stock (AAAA-MM-DD):',c.stock_fecha||new Date().toISOString().split('T')[0]);if(f===null)return;f=String(f).trim();if(!/^\d{4}-\d{2}-\d{2}$/.test(f)){alert('Fecha inválida');return;}var ups={};ups['cfg_aho/stock_usd_loli']=l;ups['cfg_aho/stock_usd_hugo']=h;ups['cfg_aho/stock_fecha']=f;ups['cfg_aho/stock_usd']=l+h;spin(true);DB.ref('/').update(ups,function(){spin(false);});}
function capAddActivo(){var d=prompt('Descripción:');if(!d)return;var usd=Number(String(prompt('U$S (0 si no):','0')||'0').replace(/[^0-9.]/g,''))||0;var ars=Number(String(prompt('Pesos $ (0 si no):','0')||'0').replace(/[^0-9.]/g,''))||0;var w=(prompt('De quién (loli/hugo/shared):','shared')||'shared').trim().toLowerCase();if(['loli','hugo','shared'].indexOf(w)<0)w='shared';fbSet('fin_capital/'+DB.ref('fin_capital').push().key,{desc:d.trim(),tipo:usd?'usd':'otro',usd:usd,ars:ars,fecha:new Date().toISOString().split('T')[0],who:w,obs:'',vendido:false});}
function capDelActivo(k){if(!confirm('Borrar activo?'))return;fbRm('fin_capital/'+k);}
function capAddUsdMov(){var t=(prompt('Tipo (gasto/venta):','gasto')||'gasto').trim().toLowerCase();if(t!=='venta')t='gasto';var d=prompt('Descripción:');if(!d)return;var usd=Number(String(prompt('U$S:','0')||'0').replace(/[^0-9.]/g,''))||0;if(!usd){alert('Falta el monto');return;}var ars=t==='venta'?(Number(String(prompt('Pesos recibidos $:','0')||'0').replace(/[^0-9.]/g,''))||0):0;var f=prompt('Fecha (AAAA-MM-DD):',new Date().toISOString().split('T')[0]);if(!f)return;var w=(prompt('De quién (loli/hugo/shared):','shared')||'shared').trim().toLowerCase();if(['loli','hugo','shared'].indexOf(w)<0)w='shared';fbSet('fin_usdMovs/'+DB.ref('fin_usdMovs').push().key,{desc:d.trim(),tipo:t,usd:usd,ars:ars,fec:f.trim(),who:w});}
function capDelUsd(k){if(!confirm('Borrar movimiento?'))return;fbRm('fin_usdMovs/'+k);}
</script>
