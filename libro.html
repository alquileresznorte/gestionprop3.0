<script>/* Motor del libro único — funciones puras, sin DOM ni base de datos.

    var s = {}; s[hoyISO().slice(0, 7)] = 1;
    Object.keys(S.cargos).forEach(function (p) { s[p] = 1; });
    D.movimientos.forEach(function (m) { if (m.periodo) s[m.periodo] = 1; });
    return Object.keys(s).filter(function (p) { return p >= "2026-08"; }).sort().reverse();
  }
  function perInicial() {
    var cur = hoyISO().slice(0, 7), n = D.movimientos.filter(function (m) { return m.periodo === cur; }).length;
    return n >= 20 ? cur : addMes(cur, -1);
  }
  function cerrado(p) { return S.cierres && S.cierres[p]; }
  function esEmp(id) { return !!id && CTA[id] && CTA[id].titular === "empresa"; }
  function tocaEmpresa(m) { return m.corresponde === "empresa" || esEmp(m.cuenta) || esEmp(m.cuenta_destino); }
  function cajaCerrada(f) { var c = S.cajas && S.cajas[f]; return c && c.cerrada ? c : null; }
  // Bloquea si está cerrado el mes (por período o fecha) o, para lo que toca a la empresa, la caja de ese día.
  function bloqueado(m) {
    var f = String(m.fecha || "").slice(0, 7);
    if (cerrado(m.periodo)) return "El mes " + m.periodo + " está cerrado.";
    if (cerrado(f)) return "El mes " + f + " está cerrado.";
    // La seña aplicada no mueve plata: como en AU, se puede aplicar aunque la caja de ese día esté cerrada.
    if (tocaEmpresa(m) && m.clase !== "aplicacion_anticipo" && cajaCerrada(m.fecha)) return "La caja del " + m.fecha.split("-").reverse().join("/") + " está cerrada.";
    return null;
  }
  function esWeb(m) { return String(m.fuente || "").indexOf("WEB:") === 0; }
  function nuevoId(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function docLibro(f) { return f.slice(0, 7) + "-" + (+f.slice(8, 10) <= 15 ? "1" : "2"); }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function enCola(fn) { var p = cola.then(fn, fn); cola = p.catch(function () {}); return p; }
  function errTxt(e) {
    var c = e && e.code;
    if (c === "quota_exceeded") return "La base de datos está llena. Avisale a Claude para archivar meses viejos.";
    if (c === "invalid_argument") return "No tenés permiso para cargar en esta página. Pedí acceso de Colaborador.";
    if (c === "resource_exhausted") return "Demasiados cambios seguidos. Esperá unos segundos y volvé a guardar.";
    return (e && e.message) || "No se pudo guardar. Revisá la conexión y probá de nuevo.";
  }
  // Crea el documento vacío del medio mes si no existe, sin pisar lo que otro esté creando.
  function asegurar(ref, vacio) {
    // Un lease puede dejar el documento creado sin campos: se mira el campo, no solo si existe.
    var campo = Object.keys(vacio)[0];
    function listo(s) { return s.exists && s.data() && s.data()[campo]; }
    return ref.get().then(function (s) {
      if (listo(s)) return;
      return ref.acquire({ holder: uid || nuevoId("h"), ttlMs: 5000 }).then(function (l) {
        return (l.acquired ? Promise.resolve() : sleep(1500)).then(function () { return ref.get(); }).then(function (s2) { if (!listo(s2)) return ref.set(vacio); });
      });
    });
  }
  function crearMov(m) {
    var b = bloqueado(m);
    if (b) return Promise.reject(new Error(b + " Para cargar ahí, un admin tiene que reabrir."));
    if (D.movimientos.some(function (x) { return x.fuente === m.fuente; })) return Promise.reject(new Error("Ese movimiento ya está cargado."));
    m.creado = new Date().toISOString(); if (uid) m.por = uid; delete m.org;
    var ref = DB.doc("libro/" + docLibro(m.fecha)), o = { movs: {} }; o.movs[m.id] = m;
    return enCola(function () { return asegurar(ref, { movs: {} }).then(function () { return ref.update(o); }); }).catch(function (e) { throw new Error(errTxt(e)); });
  }
  function excluirMov(m) {
    var b = bloqueado(m);
    if (b) return Promise.reject(new Error(b));
    var o = { movs: {} }; o.movs[m.id] = { estado: "excluido", excluido_el: new Date().toISOString() }; if (uid) o.movs[m.id].excluido_por = uid;
    return enCola(function () { return DB.doc("libro/" + m._doc).update(o); }).catch(function (e) { throw new Error(errTxt(e)); });
  }
  function cerrarMes(p) {
    var snap = JSON.parse(JSON.stringify(L.cierre(p)));
    return enCola(function () { return DB.doc("cierres/" + p).set({ periodo: p, cerrado: new Date().toISOString(), por: uid || "", snapshot: snap }); }).catch(function (e) { throw new Error(errTxt(e)); });
  }
  function reabrirMes(p) { return enCola(function () { return DB.doc("cierres/" + p).delete(); }).catch(function (e) { throw new Error(errTxt(e)); }); }

  // Edición con rastro: guarda los valores anteriores de lo que cambió, con quién y cuándo.
  // Si la fecha nueva cae en otro medio mes, se copia al documento nuevo y la copia vieja queda marcada "movido" (no se cuenta).
  function editarMov(m, cambios) {
    var b = bloqueado(m) || bloqueado(Object.assign({}, m, cambios));
    if (b) return Promise.reject(new Error(b));
    var antes = {}; Object.keys(cambios).forEach(function (k) { antes[k] = m[k] === undefined ? null : m[k]; });
    var ts = new Date().toISOString(), reg = {}; reg[ts.replace(/[^0-9]/g, "")] = { cuando: ts, por: uid || "", antes: antes };
    var nuevoDoc = cambios.fecha ? docLibro(cambios.fecha) : m._doc;
    if (nuevoDoc === m._doc) {
      var o = { movs: {} }; o.movs[m.id] = Object.assign({}, cambios, { cambios: reg });
      return enCola(function () { return DB.doc("libro/" + m._doc).update(o); }).catch(function (e) { throw new Error(errTxt(e)); });
    }
    var copia = Object.assign({}, m, cambios); delete copia._doc;
    copia.cambios = Object.assign({}, m.cambios || {}, reg);
    var ref = DB.doc("libro/" + nuevoDoc), o2 = { movs: {} }; o2.movs[m.id] = copia;
    var o3 = { movs: {} }; o3.movs[m.id] = { estado: "movido", movido_a: nuevoDoc };
    return enCola(function () { return asegurar(ref, { movs: {} }).then(function () { return ref.update(o2); }).then(function () { return DB.doc("libro/" + m._doc).update(o3); }); })
      .catch(function (e) { throw new Error(errTxt(e)); });
  }

      for (var d = new Date(y, mm, 1); d.getMonth() === mm; d.setDate(d.getDate() + 1)) if (d.getDay() === dw) k++;

  // Reparte las partes del pago entre el cargo elegido y, si sobra, los siguientes del mismo contrato.
  function armarPagos(c, partes, siguientes, base) {

      var l = contratoDe(c);
      lista = lista.concat(D.cargos.filter(function (x) { return x.id !== c.id && x.moneda !== "USD" && saldoCargo(x) > 0 && ((l && x.contrato_id === l.id) || (!l && x.unidad === c.unidad)); })
        .sort(function (a, b) { return String(a.periodo).localeCompare(b.periodo) || _ordC(a) - _ordC(b); }));

    var rest = lista.map(function (x) { return Math.max(0, saldoCargo(x)); }), out = [];
    partes.forEach(function (pt) {

  // ---------- Morosos (antigüedad de la deuda) e incobrables ----------
  // Vence el día de mora de la config (AU: 5) del mes del cargo. Atraso = días desde ese vencimiento.
  function diasAtraso(c) { var dm = ((S.config && S.config.recargos) || {}).dias_mora || 5; var v = Date.parse(c.periodo + "-" + String(dm).padStart(2, "0") + "T12:00:00"); return Math.max(0, Math.floor((Date.parse(hoyISO() + "T12:00:00") - v) / 864e5)); }
  function tramo(d) { return d <= 30 ? "1-30" : d <= 60 ? "31-60" : d <= 90 ? "61-90" : "+90"; }
  function morosos() {
    var hoyM = hoyISO().slice(0, 7), out = [];

      var cs = D.cargos.filter(function (c) { return c.contrato_id === l.id && c.periodo <= hoyM && c.moneda !== "USD" && saldoCargo(c) > 0 && diasAtraso(c) > 0; }).sort(function (a, b) { return String(a.periodo).localeCompare(b.periodo); });
      if (!cs.length) return;
      var t = { "1-30": 0, "31-60": 0, "61-90": 0, "+90": 0 }; cs.forEach(function (c) { t[tramo(diasAtraso(c))] += saldoCargo(c); });
      out.push({ l: l, c: clienteDe(l), cargos: cs, total: cs.reduce(function (s, c) { return s + saldoCargo(c); }, 0), dias: diasAtraso(cs[0]), tramos: t });
    });

  }

        function (e) { $("#formCerrar button[type=submit]").disabled = false; av.innerHTML = '<div class="aviso mal">' + esc(errTxt(e)) + "</div>"; });

  // Ficha del historial y "volver a vigente" (se arrepintió, se queda).
  function fichaHist(tipo, id) {

  }
  function reactivar(tipo, id, btn) {

    if (btn.getAttribute("data-ok") !== "1") { btn.setAttribute("data-ok", "1"); btn.textContent = (ocupada(h.unidad) ? "OJO: " + h.unidad + " ya está ocupado. " : "") + "¿Volver a vigente? Tocá de nuevo"; return; }
    var o = { contratos: {}, clientes: {}, historial: {} }, porMes = {};
    if (tipo === "app") {
      o.contratos[id] = { estado: "activo", fecha_baja: null, motivo_baja: null, cierre_tipo: null, deuda_al_irse: null, reactivado: new Date().toISOString() };
      // los cargos cancelados al cerrar vuelven a su valor

  // ---------- Respaldo: descargar, automático al cerrar caja/mes, y restaurar ----------
  // Un respaldo es la copia de TODOS los documentos de la base. Se guarda en respaldos/{id} (índice) + respaldos/{id}/partes/{n} (cada documento).
  var DOCS_BASE = ["config", "clientes", "saldos", "reservas", "fijos", "tarjetas"];
  var COLS = ["cargos", "libro", "cierres", "cajas"];
  var MAX_RESPALDOS = 30;
  function fotoBase() {
    var docs = {};
    DOCS_BASE.forEach(function (k) { if (S[k]) docs["base/" + k] = S[k]; });
    COLS.forEach(function (c) { Object.keys(S[c] || {}).forEach(function (k) { if (S[c][k]) docs[c + "/" + k] = S[c][k]; }); });
    var movs = 0; Object.keys(S.libro || {}).forEach(function (k) { movs += Object.keys((S.libro[k] || {}).movs || {}).length; });
    return { app: "libro-unico", version: 3, creado: new Date().toISOString(), por: uid || "", docs: docs, resumen: { documentos: Object.keys(docs).length, movimientos: movs, contratos: D ? D.contratos.length : 0 } };
  }
  function descargarRespaldo() {
    var f = fotoBase(), nombre = "libro-unico-respaldo-" + f.creado.slice(0, 16).replace(/[:T]/g, "-") + ".json";
    return window.claude.use("downloads").then(function (dl) {
      if (!dl) throw new Error("Este visor no permite descargar archivos. Usá el respaldo guardado en la página.");
      return dl.save({ filename: nombre, data: JSON.stringify(f) }).then(function () { return nombre; });
    }).catch(function (e) { if (e && e.code === "declined") throw new Error("Descarga cancelada."); throw new Error((e && e.message) || "No se pudo descargar."); });
  }
  // Guarda un respaldo dentro de la página. motivo: "manual", "cierre de caja 02/10", "cierre de mes 2026-09"…
  function guardarRespaldo(motivo) {
    var f = fotoBase(), id = f.creado.replace(/[^0-9]/g, "").slice(0, 14) + "_" + Math.random().toString(36).slice(2, 5), keys = Object.keys(f.docs);
    var base = DB.doc("respaldos/" + id);
    return enCola(function () {
      return keys.reduce(function (p, k, i) { return p.then(function () { return base.collection("partes").doc(String(i)).set({ ruta: k, data: f.docs[k] }); }); }, Promise.resolve())
        .then(function () { return base.set({ creado: f.creado, por: f.por, motivo: motivo || "manual", partes: keys.length, rutas: keys, resumen: f.resumen, completo: true }); })
        .then(podarRespaldos);
    }).then(function () { return id; });
  }
  function podarRespaldos() {
    var ids = Object.keys(S.respaldos || {}).sort();
    var sobran = ids.slice(0, Math.max(0, ids.length - MAX_RESPALDOS + 1));
    return sobran.reduce(function (p, id) {
      return p.then(function () { var r = S.respaldos[id] || {}, n = r.partes || 0, ps = Promise.resolve();
        for (var i = 0; i < n; i++) (function (i) { ps = ps.then(function () { return DB.doc("respaldos/" + id + "/partes/" + i).delete(); }); })(i);
        return ps.then(function () { return DB.doc("respaldos/" + id).delete(); }); });
    }, Promise.resolve());
  }
  function leerRespaldo(id) {
    var r = S.respaldos[id]; if (!r) return Promise.reject(new Error("Respaldo no encontrado."));
    var docs = {}, ps = [];
    for (var i = 0; i < r.partes; i++) ps.push(DB.doc("respaldos/" + id + "/partes/" + i).get().then(function (s) { var d = s.exists && s.data(); if (d && d.ruta) docs[d.ruta] = d.data; }));
    return Promise.all(ps).then(function () { if (Object.keys(docs).length !== r.partes) throw new Error("El respaldo está incompleto (" + Object.keys(docs).length + " de " + r.partes + ")."); return { docs: docs, creado: r.creado }; });
  }
  // Restaurar: antes guarda un respaldo del estado actual (por si te arrepentís), después escribe cada documento y borra los que no estaban.
  function restaurar(f) {
    if (!f || !f.docs || !f.docs["base/config"] || !f.docs["base/clientes"]) return Promise.reject(new Error("Ese archivo no es un respaldo del libro."));
    var actuales = []; COLS.forEach(function (c) { Object.keys(S[c] || {}).forEach(function (k) { actuales.push(c + "/" + k); }); });
    DOCS_BASE.forEach(function (k) { if (S[k]) actuales.push("base/" + k); });
    var previo = S.config ? guardarRespaldo("antes de restaurar el respaldo del " + String(f.creado || "").slice(0, 10)) : Promise.resolve(); // base vacía: no hay nada que resguardar
    return previo.then(function () {
      return enCola(function () {
        var p = Promise.resolve();
        Object.keys(f.docs).forEach(function (k) { p = p.then(function () { return DB.doc(k).set(f.docs[k]); }); });
        actuales.filter(function (k) { return !f.docs[k]; }).forEach(function (k) { p = p.then(function () { return DB.doc(k).delete(); }); });
        return p;
      });
    });
  }
  function vRespaldo() {
    var rs = Object.keys(S.respaldos || {}).map(function (k) { return Object.assign({ id: k }, S.respaldos[k]); }).filter(function (r) { return r.completo; }).sort(function (a, b) { return String(b.creado).localeCompare(a.creado); });
    var ult = rs[0];
    return '<section><div><span class="eti">Seguridad de los datos</span><h2>Respaldo</h2><p class="nota">Se hace solo cada vez que cerrás una caja o un mes, y guarda los últimos ' + MAX_RESPALDOS + ". Además podés descargar una copia a tu compu o al celular.</p></div>" +
      '<div class="tiles"><div><span class="eti">Último respaldo</span><b>' + (ult ? esc(new Date(ult.creado).toLocaleString("es-AR")) : "Ninguno todavía") + '</b><span class="nota">' + (ult ? esc(ult.motivo) : "Hacé uno ahora") + '</span></div><div><span class="eti">Guardados</span><b class="num">' + rs.length + '</b><span class="nota">en la página</span></div></div>' +
      (puedeEscribir ? '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" data-acc="descargarResp">Descargar respaldo</button><button class="btn" data-acc="guardarResp">Guardar respaldo ahora</button>' +
        (esAdmin ? '<label class="btn" for="archResp">Restaurar desde archivo</label><input type="file" id="archResp" accept=".json,application/json" hidden>' : "") + "</div>" : "") +
      '<div id="resp_aviso"></div>' +
      '<div class="cobs">' + (rs.length ? rs.map(function (r) {
        return '<div class="cob"><div class="cob-u">' + esc(new Date(r.creado).toLocaleDateString("es-AR")) + '</div><div class="cob-d"><b>' + esc(r.motivo || "") + '</b><span class="nota">' + esc(new Date(r.creado).toLocaleTimeString("es-AR")) + " · " + ((r.resumen || {}).movimientos || 0) + " movimientos · " + ((r.resumen || {}).contratos || 0) + " acuerdos</span></div>" +
          '<div class="cob-a">' + (puedeEscribir ? '<button class="btn chico" data-acc="bajarResp" data-id="' + esc(r.id) + '">Descargar</button>' : "") + (esAdmin ? '<button class="btn chico peligro" data-acc="restResp" data-id="' + esc(r.id) + '">Restaurar</button>' : "") + "</div></div>";
      }).join("") : '<p class="nota">Todavía no hay respaldos guardados.</p>') + "</div>" +
      '<p class="nota">Restaurar vuelve todo a como estaba en ese momento. Antes de restaurar se guarda automáticamente un respaldo del estado actual, así se puede deshacer.</p></section>';
  }

  // ---------- Costos fijos: lo que hay que pagar cada mes, como los alquileres pero al revés ----------
  var FFI = { q: "", solo: "" };
  var FRECS = { mensual: "Mensual", bimestral: "Cada 2 meses", anual: "Anual", eventual: "Eventual" };
  function esperadoEn(f, p) {
    if (f.activo === false) return false;
    var dif = (+p.slice(0, 4) - +String(f.mes_base || p).slice(0, 4)) * 12 + (+p.slice(5) - +String(f.mes_base || p).slice(5));
    if (dif < 0) return false;
    return f.frecuencia === "bimestral" ? dif % 2 === 0 : f.frecuencia === "anual" ? dif % 12 === 0 : f.frecuencia === "eventual" ? false : true;
  }
  function pagosFijo(f, p) {
    return D.movimientos.filter(function (m) { return m.estado !== "excluido" && m.tipo === "egreso" && m.periodo === p && (m.fijo_id === f.id || (f.origen_cst && String(m.fuente || "").indexOf("AU:cst/" + f.origen_cst + "#") === 0)); });
  }

      var falta = esp ? Math.max(0, (+f.monto || 0) - pag) : 0;
      return { f: f, pagos: ps, pagado: pag, esperado: esp ? +f.monto || 0 : 0, falta: pag > 0 ? 0 : falta, parcial: pag > 0 && pag < (+f.monto || 0) * 0.95 };
    }).filter(Boolean);
  }
  function vCostos() {
    var xs = filasFijos(per), q = FFI.q.toLowerCase(), r = L.resultado(per), hoyD = hoyISO();
    var esp = xs.reduce(function (s, x) { return s + x.esperado; }, 0), pag = xs.reduce(function (s, x) { return s + x.pagado; }, 0), falta = xs.reduce(function (s, x) { return s + x.falta; }, 0);
    var vis = xs.filter(function (x) { return (!FFI.solo || x.falta > 0) && (!q || (x.f.desc + " " + x.f.categoria + " " + (x.f.edificio || "")).toLowerCase().indexOf(q) >= 0); })
      .sort(function (a, b) { return (b.falta > 0) - (a.falta > 0) || String(a.f.categoria).localeCompare(b.f.categoria) || String(a.f.desc).localeCompare(b.f.desc); });
    return '<section><div style="display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between"><div><span class="eti">Costos fijos de la empresa</span><h2>Costos · ' + esc(nomMes(per)) + "</h2></div>" +
      (puedeEscribir ? '<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" data-acc="nuevoFijo">+ Costo fijo</button><button class="btn" data-acc="movDiaCosto">+ Gasto variable</button></div>' : "") + "</div>" +
      '<div class="tiles"><div><span class="eti">Fijos esperados</span><b class="num">' + $$(esp) + '</b><span class="nota">' + xs.filter(function (x) { return x.esperado; }).length + ' conceptos</span></div><div><span class="eti">Pagado</span><b class="num">' + $$(pag) + '</b><span class="nota">&nbsp;</span></div>' +

      '<div class="filtros"><input type="search" id="fiq" placeholder="Concepto, rubro, edificio…" value="' + esc(FFI.q) + '"><select id="fisolo">' + opt("", "Todos", FFI.solo) + opt("pend", "Solo lo que falta pagar", FFI.solo) + "</select></div>" +
      '<div class="cobs">' + (vis.length ? vis.map(function (x) {
        var f = x.f, venc = f.dia_vto && x.falta > 0 && per + "-" + String(f.dia_vto).padStart(2, "0") < hoyD;

        return '<div class="cob"><div class="cob-u">' + esc(f.edificio || "Gral") + '</div><div class="cob-d"><b>' + esc(f.desc) + '</b><span class="nota">' + esc(f.categoria || "") + " · " + esc(FRECS[f.frecuencia] || "Mensual") + " · estimado " + $$(f.monto) + (f.dia_vto ? " · vence día " + f.dia_vto : "") + (x.pagos.length ? " · " + x.pagos.map(function (m) { return fCorta(m.fecha) + " " + esc(cta(m.cuenta)); }).join(", ") : "") + "</span></div>" +

  }
  function formFijo(id) {

    var cats = {}; D.fijos.forEach(function (x) { if (x.categoria) cats[x.categoria] = 1; });
