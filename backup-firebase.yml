name: Backup Firebase GestionProp

on:
  schedule:
    # 12:00 Argentina (UTC-3) = 15:00 UTC, todos los sábados
    - cron: '0 15 * * 6'
  workflow_dispatch: {} # también se puede correr a mano desde la pestaña "Actions"

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el repositorio
        uses: actions/checkout@v4

      - name: Descargar la base de Firebase y guardarla
        run: |
          FECHA=$(TZ='America/Argentina/Buenos_Aires' date +'%Y-%m-%d')
          mkdir -p backups
          curl -sf "https://gestion-prop-default-rtdb.firebaseio.com/.json" -o "backups/backup-$FECHA.json"
          echo "Archivo guardado: backups/backup-$FECHA.json ($(wc -c < backups/backup-$FECHA.json) bytes)"
          echo "FECHA=$FECHA" >> $GITHUB_ENV

      - name: Commitear el backup
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add "backups/backup-${FECHA}.json"
          git commit -m "Backup automático ${FECHA}" || echo "Nada nuevo para commitear"
          git push
