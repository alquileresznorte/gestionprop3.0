  return meses[mo-1]+" "+yr;
}
function fmt(n){return "$"+Number(n||0).toLocaleString("es-AR");}
function fmtInput(el){
  // Format number input with dots as thousands separator while typing
  var raw=el.value.replace(/\./g,"").replace(/[^\d]/g,"");
  var num=parseInt(raw||"0");
  if(!isNaN(num)&&num>0){
    el.value=num.toLocaleString("es-AR");
  } else if(raw===""){
    el.value="";
  }
  // Store raw value as data attribute for reading
  el.dataset.raw=raw||"0";
}
function fmtInputVal(el){
  if(!el) return 0;
  var v=(el.value||"0").replace(/\./g,"").replace(/,/g,"").replace(/[^\d]/g,"");
  return parseInt(v)||0;
}
// Parser DECIMAL (para montos en USD): acepta "133,33", "133.33" y "1.500,50" (formato AR)
function numDec(el){
  if(!el)return 0;
  var s=String(el.value||"").trim();if(!s)return 0;
  if(s.indexOf(",")>=0){s=s.replace(/\./g,"").replace(",",".");}
  else{
    var m=s.match(/^\d+\.\d{1,2}$/); // un solo punto con 1-2 decimales = decimal
    if(!m)s=s.replace(/\./g,""); // sino, puntos = separador de miles
  }
  s=s.replace(/[^0-9.]/g,"");
  return parseFloat(s)||0;
}
function fusd(n,tc){return tc>0?"U$S "+Math.round(n/tc):"--";}

// ── ALQUILERES SEMANALES ─────────────────────────────────────────────────────
var DIAS_SEM=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
function diasPagoMes(mesStr,dow){ // fechas (YYYY-MM-DD) del día "dow" (0-6) en el mes
  var y=parseInt(mesStr.slice(0,4)),m=parseInt(mesStr.slice(5,7));
  var out=[],d=new Date(y,m-1,1);
  while(d.getMonth()===m-1){
    if(d.getDay()===dow)out.push(y+"-"+String(m).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"));
    d.setDate(d.getDate()+1);
  }
  return out;
}
function iqDeCobro(c){ // acuerdo activo del cobro
  return oA(DATA.iq).filter(function(i){return i.id_ac===c.id_ac&&i.estado==="activo";})[0]||null;
}
// Estado semanal de un cobro mensual: cuantas semanas vencieron, cuantas cubrio el pago,
// y cuanto debe HASTA HOY (sin contar semanas futuras).
function infoSemanal(i,c){
  if(!i||i.frecuencia!=="semanal"||!Number(i.alq_semanal||0)||c.moneda==="USD")return null;
  var monto=Number(i.alq_semanal),dow=(i.dia_sem!=null?Number(i.dia_sem):3);
  var fechas=diasPagoMes(c.mes,dow);
  if(!fechas.length)return null;
  var pg=pT(c),ant=Number(c.sal_ant||0),hoyF=hoy();
  var venc=fechas.filter(function(f){return f<=hoyF;}).length;
  var debeHoy=venc*monto+ant-pg; // >0 debe, <=0 al dia / adelantado
  var cubierto=pg-Math.max(0,ant); // lo pagado despues de saldar el arrastre
  var pagadas=Math.max(0,Math.floor(cubierto/monto));
  return {monto:monto,dow:dow,fechas:fechas,total:fechas.length,venc:venc,debeHoy:debeHoy,pagadas:Math.min(pagadas,fechas.length),adelanto:pagadas>venc};
}
function hoy(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function mes(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function diaAnterior(fechaStr){
  // Resta 1 dia a una fecha YYYY-MM-DD sin pasar por toISOString (evita corrimiento por UTC)
  var p=fechaStr.split("-");
  var d=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));
  d.setDate(d.getDate()-1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function fecDisp(s){
  // Convert YYYY-MM-DD to DD/MM/YY for display
  if(!s||s.length<10)return s||"--";
  var p=s.split("-");
  return p[2]+"/"+p[1]+"/"+p[0].slice(2);
}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function uds(){
  var r=[];
  Object.keys(ED).forEach(function(c){for(var i=1;i<=ED[c].u;i++)r.push(c+"-"+i);});
  // Unidades adicionales cargadas desde Config > Propiedades (no están en el objeto ED fijo).
  // Si el código ya existe en ED (ej: OT), la numeración continúa después de la última unidad
  // existente (OT-1 -> OT-2). Si es un código nuevo, arranca desde 1.
  var customProps=oA(DATA.cfg||{}).filter(function(x){return x.tipo==="propiedad"&&x.activo!==false;});
  var contadorPorCodigo={};
  customProps.forEach(function(p){
    var cod=(p.codigo||"").trim();
    if(!cod) return;
    if(contadorPorCodigo[cod]===undefined) contadorPorCodigo[cod]=ED[cod]?ED[cod].u:0;
    var cant=Number(p.unidades||1);
    for(var i=1;i<=cant;i++){
      contadorPorCodigo[cod]++;
      r.push(cod+"-"+contadorPorCodigo[cod]);
    }
  });
  return r;
}
function pA(c){return c&&c.pagos?Object.values(c.pagos):[];}
function pT(c){
  // Para cobros USD: sumar en USD; para pesos: sumar en pesos
  if(c&&c.moneda==="USD"){
    return pA(c).reduce(function(s,p){return s+Number(p.usd||0);},0);
  }
  return pA(c).reduce(function(s,p){return s+p.monto;},0);
}
// Total pagado SIEMPRE en pesos (para estadísticas): cada pago guarda su valor en pesos en 'monto', también los USD.
function pTpesos(c){return pA(c).reduce(function(s,p){return s+Number(p.monto||0);},0);}
// ── MOTOR DE SALDOS ÚNICO ──────────────────────────────────────────────────
// Saldo real de un inquilino = todo lo cobrado (monto_total de cada cobro) − todo lo pagado.
// NO usa el arrastre (sal_ant) para no contar doble. Es la ÚNICA fuente de verdad:
// la usan la ficha, el consolidado y la impresión, así siempre reconcilian.
// MOTOR ÚNICO DE SALDOS (validado contra datos reales).
// idAc: acuerdo. hasta (opcional): "YYYY-MM" límite inclusive (para cierres/saldo a una fecha).
// Semanal: el mes vale (semanas reales del mes) x alq_semanal, NO el monto_total guardado.
// Dólares: se llevan aparte en 'usd'.
function saldoInq(idAc,hasta){
  var i=oA(DATA.iq).filter(function(x){return x.id_ac===idAc;})[0]||{};
  var esSem=i.frecuencia==="semanal"&&Number(i.alq_semanal||0)>0;
  var dow=(i.dia_sem!=null?Number(i.dia_sem):3);
  var ars=0,usd=0,cargosArs=0,pagArs=0;
  oA(DATA.cob).forEach(function(c){
    if(c.id_ac!==idAc||c.archivado_hist)return;
    if(hasta&&(c.mes||"")>hasta)return;
    if(c.moneda==="USD"){
      var pu=pA(c).reduce(function(s,p){return s+Number(p.usd||0);},0);
      usd+=Number(c.monto_total||0)-pu;
    } else {
      var cargo=(esSem&&esCobroAlq(c))?diasPagoMes(c.mes,dow).length*Number(i.alq_semanal):Number(c.monto_total||0);
      cargosArs+=cargo;
      pagArs+=pTpesos(c);
    }
  });
  ars=cargosArs-pagArs;
  return {ars:Math.round(ars),usd:Math.round(usd),cargos:Math.round(cargosArs),pagado:Math.round(pagArs)};
}
// Cargo del MES de un cobro (semanal-aware). Cobrado del mes = pagos topeados a ese cargo
// (lo pagado de más = arrastre viejo, no infla el cobrado del mes). Helpers del MOTOR ÚNICO.
function cargoMesCobro(c){
  if(c.moneda==="USD")return Number(c.monto_total||0);
  var i=iqDeCobro(c);
  var esSem=i&&i.frecuencia==="semanal"&&Number(i.alq_semanal||0)>0;
  return (esSem&&esCobroAlq(c))?diasPagoMes(c.mes,(i.dia_sem!=null?Number(i.dia_sem):3)).length*Number(i.alq_semanal):Number(c.monto_total||0);
}
function cobradoMesCobro(c){ return Math.min(pTpesos(c),cargoMesCobro(c)); }
// Cobrado del mes en PESOS. Para cobros en dólares, cuenta los PESOS REALES que entraron
// (a la cotización del día de cada pago) — así un alquiler pactado en USD pero PAGADO EN PESOS
// (ej. Yimmy) suma a los ingresos en pesos del edificio y no queda invisible.
function cobradoMesPesos(c,tcVal){
  if(c.moneda==="USD"){
    return pA(c).reduce(function(s,p){return s+Number(p.monto||0);},0);
  }
  return cobradoMesCobro(c);
}
// Reserva NETA de SC de un mes = cobrado SC − costos SC − su parte de generales (mismo criterio que el reparto).
function scReservaMes(mm){
  var cobSC=oA(DATA.cob).filter(function(c){return c.unidad&&c.unidad.indexOf("SC-")===0&&c.mes===mm;}).reduce(function(s,c){return s+pTpesos(c);},0);
  var fij=oA(DATA.cst).filter(function(c){return c.mes===mm&&c.pagado&&c.tipo!=="eventual_caja";});
  var cstSC=fij.filter(function(c){return c.ed==="SC";}).reduce(function(s,c){return s+Number(c.monto||0);},0);
  var gen=fij.filter(function(c){return !ED[c.ed];}).reduce(function(s,c){return s+Number(c.monto||0);},0);
  var nEds=Object.keys(ED).filter(function(k){return k!=="OT";}).length;
  return cobSC-cstSC-(nEds?gen/nEds:0);
}
// Reserva acumulada de SC = suma de la reserva neta de cada mes, desde RESERVA_DESDE hasta 'hasta'.
function reservaAcumSC(hasta){
  var meses={};
  oA(DATA.cob).forEach(function(x){if(x.mes&&x.mes>=RESERVA_DESDE&&x.mes<=hasta&&x.unidad&&x.unidad.indexOf("SC-")===0)meses[x.mes]=1;});
  oA(DATA.cst).forEach(function(x){if(x.mes&&x.mes>=RESERVA_DESDE&&x.mes<=hasta)meses[x.mes]=1;});
  return Object.keys(meses).reduce(function(s,mm){return s+scReservaMes(mm);},0);
}
// Rotación del mes: altas (ingresos) y bajas (egresos) que ocurrieron en el mes m ("YYYY-MM").
function rotacionMes(m){
  function enMes(f){return String(f||"").indexOf(m)===0;}
  var altas={},bajas={};
  oA(DATA.iq).forEach(function(i){ if(enMes(i.ingreso)||enMes(i.fecha_reg)) altas[i.unidad+"|"+(i.id_ac||"")]=i.unidad; });
  oA(DATA.hist).forEach(function(h){
    if(enMes(h.ingreso)||enMes(h.fecha_reg)) altas[h.unidad+"|"+(h.id_ac||"")]=h.unidad;
    if(enMes(h.fecha_egreso_real)||enMes(h.fecha_cierre)) bajas[h.unidad+"|"+(h.id_ac||"")]=h.unidad;
  });
  return {altas:Object.values(altas),bajas:Object.values(bajas)};
}
// Datos consolidados de todos los inquilinos activos, agrupados por edificio (motor único)
function _estadoCuentasData(){
  var act=oA(DATA.iq).filter(function(i){return i.estado==="activo";});
  var byEd={};
  act.forEach(function(i){var cod=(i.unidad||"").split("-")[0]||"?";(byEd[cod]=byEd[cod]||[]).push(i);});
  var eds=[],totDebe=0,totFavor=0,totUsd=0;
  Object.keys(byEd).sort().forEach(function(cod){
    var filas=[],subDebe=0,subFavor=0;
    byEd[cod].sort(function(a,b){return(a.unidad||"").localeCompare(b.unidad||"");}).forEach(function(i){
      var s=saldoInq(i.id_ac);
      if(s.ars>0)subDebe+=s.ars;else if(s.ars<0)subFavor+=-s.ars;
      totUsd+=s.usd;
      filas.push({u:i.unidad||"",n:(i.nombre||"").split(",")[0],ars:s.ars,usd:s.usd});
    });
    totDebe+=subDebe;totFavor+=subFavor;
    eds.push({cod:cod,filas:filas,subDebe:subDebe,subFavor:subFavor});
  });
  return {eds:eds,totDebe:totDebe,totFavor:totFavor,totUsd:totUsd,neto:totDebe-totFavor};
}

// ── Protección de meses cerrados ───────────────────────────────────────────
// Un mes está cerrado si tiene un cierre con informe congelado.
function mesEstaCerrado(mes){
  if(!mes) return false;
  return oA(DATA.cierres).some(function(c){return c.mes===mes&&c.informe;});
}
// Freno consciente: si el mes está cerrado, pide confirmación antes de editar.
// Devuelve true si se puede seguir (mes abierto, o el usuario confirmó).
function okEditarMesCerrado(mes){
  if(!mesEstaCerrado(mes)) return true;
  return confirm("⚠ El mes "+mes+" está CERRADO (informe firmado congelado).\n\nEstás por modificar un dato de un mes cerrado. El informe firmado NO va a cambiar, pero el dato crudo sí.\n\n¿Seguro que querés modificarlo?");
}
// Guard para tocar la CAJA: si el día está cerrado (subc) o el mes cerrado, pide confirmación.
function okEditarCaja(fecha){
  if(!fecha) return true;
  var diaCerrado=oA(DATA.subc).some(function(s){return s.fecha===fecha;});
  if(diaCerrado) return confirm("⚠ La caja del "+fecDisp(fecha)+" ya está CERRADA.\n\nModificar un día cerrado descuadra los saldos de los días siguientes.\n\n¿Seguro que querés modificarlo?");
  return okEditarMesCerrado(String(fecha).slice(0,7));
}

// Base CF - never modified directly, overrides stored separately
var CF_BASE = CF.map(function(c){return Object.assign({},c);});

function getCF(){
  // Start from base, apply overrides from Firebase
  var result = CF_BASE.map(function(c){return Object.assign({},c);});
  var overrides = oA(DATA.cfg).filter(function(x){return x.tipo==="cf_override";});
  overrides.forEach(function(x){
    if(x.activo===false){
      // Mark as inactive
      result = result.filter(function(c){return c.id!==x.cfid;});
    } else {
      result.forEach(function(c,i){if(c.id===x.cfid){result[i]=Object.assign({},c,x);}});
    }
  });
  // Add custom costs — solo los FIJOS (costo_fijo_extra). Los variables (otro_gasto) no se repiten mensualmente
  var extras = oA(DATA.cfg).filter(function(x){return (x.tipo==="costo_fijo_extra")&&x.activo!==false;});
  extras.forEach(function(x){
    var already = result.filter(function(c){return c.id===x._key;}).length;
    if(!already) result.push({id:x._key,d:x.desc,pv:x.pv||"",e:x.ed||"General",c:x.cat||"Otro",ct:x.cta_num||"",dv:x.dv||15,monto_cfg:x.monto||0});
  });
  return result;
}

function startDB(){
  // Load any saved password changes from Firebase
  DB.ref("usuarios").once("value",function(snap){
    if(snap.exists()){
      var overrides=snap.val();
      USUARIOS.forEach(function(u){
        if(overrides[u.u]&&overrides[u.u].clave){
          u.p=overrides[u.u].clave;
        }
      });
    }
  });
  DKEYS.forEach(function(k){
    DB.ref(k).on("value",function(s){
      DATA[k]=s.exists()?s.val():{};
      if(k==="cst") setTimeout(autoLimpiarDupCst,500);
      render();
    });
  });
}

function autoLimpiarDupCst(){
  var cstA=oA(DATA.cst);
  var seen={},toDelete=[];
  cstA.forEach(function(c){
    var key=(c.mes||"")+"__"+(c.desc||"").trim().toLowerCase();
    if(seen[key]){
      // Delete the one without data
      if(Number(c.monto||0)===0&&!c.pagado) toDelete.push(c._key);
      else if(Number((DATA.cst[seen[key]]||{}).monto||0)===0&&!(DATA.cst[seen[key]]||{}).pagado){
        toDelete.push(seen[key]);seen[key]=c._key;
      }
    } else seen[key]=c._key;
  });
  if(toDelete.length){
    var ups={};
    toDelete.forEach(function(k){ups["cst/"+k]=null;});
    DB.ref("/").update(ups);
  }
}
function stopDB(){DKEYS.forEach(function(k){DB.ref(k).off();});}

  // First load password overrides from Firebase, then check saved login
  DB.ref("usuarios").once("value",function(snap){

      var ov=snap.val();
      USUARIOS.forEach(function(u){if(ov[u.u]&&ov[u.u].clave)u.p=ov[u.u].clave;});

    var saved=ls("gp_rem",null);
    if(saved){var f=USUARIOS.filter(function(x){return x.u===saved.u&&x.p===saved.p;})[0];if(f){doLogin(f);return;}}

var DRIVE_CLIENT_ID = "581104673030-lmalfgruief3qgltd235j00huv00dp7t.apps.googleusercontent.com";
var DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
var _driveToken = null;
var _driveTokenExpiry = 0;

function driveGetToken(callback){
  var now = Date.now();
  if(_driveToken && now < _driveTokenExpiry){callback(_driveToken);return;}
  // Request new token
  google.accounts.oauth2.initTokenClient({
    client_id: DRIVE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: function(response){
      if(response.error){alert("Error de autenticacion con Google: "+response.error);return;}
      _driveToken = response.access_token;
      _driveTokenExpiry = Date.now() + (response.expires_in - 60) * 1000;
      callback(_driveToken);
    }
  }).requestAccessToken();
}

function driveFindOrCreateFolder(token, name, parentId, callback){
  var query = "name='"+name+"' and mimeType='application/vnd.google-apps.folder' and trashed=false"+(parentId?" and '"+parentId+"' in parents":"");
  fetch("https://www.googleapis.com/drive/v3/files?q="+encodeURIComponent(query)+"&fields=files(id,name)", {
    headers:{Authorization:"Bearer "+token}
  }).then(function(r){return r.json();}).then(function(data){
    if(data.files && data.files.length > 0){
      callback(null, data.files[0].id);
    } else {
      // Create folder
      var meta = {name:name, mimeType:"application/vnd.google-apps.folder"};
      if(parentId) meta.parents = [parentId];
      fetch("https://www.googleapis.com/drive/v3/files", {
        method:"POST",
        headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},
        body:JSON.stringify(meta)
      }).then(function(r){return r.json();}).then(function(d){
        callback(null, d.id);
      }).catch(function(e){callback(e);});
    }
  }).catch(function(e){callback(e);});
}

function driveGetFolderPath(token, inq, callback){
  // Estructura: GestionProp / Edificio / Depto / ID_contrato
  var cod = (inq.unidad||"").split("-")[0];
  var depto = inq.unidad||"";
  var idac = inq.id_ac||"sin-id";
  driveFindOrCreateFolder(token, "GestionProp", null, function(e1, rootId){
    if(e1){callback(e1);return;}
    driveFindOrCreateFolder(token, cod, rootId, function(e2, edId){
      if(e2){callback(e2);return;}
      driveFindOrCreateFolder(token, depto, edId, function(e3, depId){
        if(e3){callback(e3);return;}
        driveFindOrCreateFolder(token, idac, depId, function(e4, contId){
          if(e4){callback(e4);return;}
          callback(null, contId);
        });
      });
    });
  });
}

function driveListFiles(token, folderId, callback){
  fetch("https://www.googleapis.com/drive/v3/files?q='"+folderId+"' in parents and trashed=false&fields=files(id,name,mimeType,thumbnailLink,webViewLink,createdTime)&orderBy=createdTime", {
    headers:{Authorization:"Bearer "+token}
  }).then(function(r){return r.json();}).then(function(data){
    callback(null, data.files||[]);
  }).catch(function(e){callback(e);});
}

function driveUploadFile(token, folderId, file, callback){
  var metadata = {name:file.name, parents:[folderId]};
  var formData = new FormData();
  formData.append("metadata", new Blob([JSON.stringify(metadata)], {type:"application/json"}));
  formData.append("file", file);
  fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink,thumbnailLink", {
    method:"POST",
    headers:{Authorization:"Bearer "+token},
    body:formData
  }).then(function(r){return r.json();}).then(function(d){
    callback(null, d);
  }).catch(function(e){callback(e);});
}

function driveDeleteFile(token, fileId, callback){
  fetch("https://www.googleapis.com/drive/v3/files/"+fileId, {
    method:"DELETE",
    headers:{Authorization:"Bearer "+token}
  }).then(function(){callback(null);}).catch(function(e){callback(e);});
}

function cerrarAc(key){
  var i=DATA.iq[key];
  var tipo=(G("egr-tipo")||{value:"saldado"}).value;
  // Get eventos history for this inquilino
  var eventos=oA(DATA.cfg).filter(function(x){return x.tipo==="evento_iq"&&x.id_ac===i.id_ac;})
    .sort(function(a,b){return (a.fecha||"").localeCompare(b.fecha||"");});
  // Cobros sin saldar de este id_ac
  var cobsDeuda=oA(DATA.cob).filter(function(c){return c.id_ac===i.id_ac&&!c.archivado_hist&&pT(c)<(c.monto_total+Number(c.sal_ant||0));});
  var upsCob={};
  var deudaTotal=0;
  if(tipo==="deuda"){
    // Queda debiendo: se registra la deuda y se archivan los cobros pendientes (para reclamar).
    deudaTotal=cobsDeuda.reduce(function(s,c){return s+((c.monto_total+Number(c.sal_ant||0))-pT(c));},0);
    cobsDeuda.forEach(function(c){upsCob["cob/"+c._key+"/archivado_hist"]=true;});
  } else if(tipo==="proporcional"){
    // Pagó un proporcional: se ajusta el ÚLTIMO cobro (el más nuevo sin saldar) a lo que pagó, y queda saldado.
    var prop=fmtInputVal(G("egr-prop")||{value:"0"});
    var ult=cobsDeuda.sort(function(a,b){return String(b.mes).localeCompare(String(a.mes));})[0];
    if(ult){
      upsCob["cob/"+ult._key+"/monto_total"]=prop;
      upsCob["cob/"+ult._key+"/sal_ant"]=0;
      upsCob["cob/"+ult._key+"/estado"]=(pT(ult)>=prop?"pagado":"parcial");
    }
    // El resto de cobros viejos sin saldar (si hay) se archivan
    cobsDeuda.forEach(function(c){if(!ult||c._key!==ult._key)upsCob["cob/"+c._key+"/archivado_hist"]=true;});
  } else {
    // SALDADO (sin deuda): los cobros pendientes del mes se cancelan (no eran deuda real, se fue al día).
    cobsDeuda.forEach(function(c){upsCob["cob/"+c._key+"/archivado_hist"]=true;upsCob["cob/"+c._key+"/cancelado_cierre"]=true;});
  }
  var reg=Object.assign({},i,{
    estado:"baja",
    fecha_egreso_real:G("egr-f").value,
    motivo_egreso:G("egr-m").value,
    obs_egreso:G("egr-o").value,
    fecha_cierre:hoy(),
    cierre_tipo:tipo,
    deuda_pendiente:deudaTotal,
    historial_eventos:eventos.map(function(ev){return ev.fecha+": "+ev.texto;}).join(" | ")
  });
  DB.ref("hist").push(reg);
  DB.ref("iq/"+key).remove();
  if(Object.keys(upsCob).length) DB.ref("/").update(upsCob);
  // Clean up eventos from cfg
  eventos.forEach(function(ev){DB.ref("cfg/"+ev._key).remove();});
  // Desactivar adicionales de la unidad al cerrar contrato
  var adicionales=oA(DATA.cfg).filter(function(x){return x.tipo==="adicional_iq"&&x.unidad===i.unidad&&x.activo!==false;});
  adicionales.forEach(function(a){DB.ref("cfg/"+a._key).update({activo:false,hasta:hoy(),baja_por_cierre:true});});
  closeModal();closeModal();
  var msg=tipo==="deuda"?" Deuda de "+fmt(deudaTotal)+" archivada en el historial.":tipo==="proporcional"?" Último mes ajustado al proporcional.":" Se fue sin deuda (mes cancelado).";
  alert("Acuerdo cerrado. "+i.unidad+" quedo libre."+msg);
  go("acuerdos");
}

function actualizarResumenRv(){
  var el=G("rv-resumen-cuotas"); if(!el) return;

  var cuotasGs=G("rv-cuotas")?parseInt(G("rv-cuotas").value.charAt(0))||1:1;
  var ini=G("rv-ini")?G("rv-ini").value:"";
  var mesBase=ini?ini.slice(0,7):mes();
  function getMesN(start,n){
    var yr=parseInt(start.slice(0,4)),mo=parseInt(start.slice(5,7))+n;
    while(mo>12){mo-=12;yr++;}return yr+"-"+String(mo).padStart(2,"0");
  }
  if(!dep&&!gs){ el.innerHTML="Sin deposito ni gastos de renovacion: no se va a generar ninguna cuota."; el.style.borderColor="#334155"; el.style.color="#94A3B8"; return; }
  var html="";
  if(gs>0){
    var cuotaGs=Math.round(gs/cuotasGs);
    var mesesGs=[]; for(var i=0;i<cuotasGs;i++) mesesGs.push(mesLabel(getMesN(mesBase,i)));
    html+="<div>💰 <b>Gastos:</b> "+cuotasGs+" cuota"+(cuotasGs>1?"s":"")+" de "+fmt(cuotaGs)+" → "+mesesGs.join(", ")+"</div>";
  }
  if(dep>0){
    var cuotaDep=Math.round(dep/cuotasDep);
    var mesesDep=[]; for(var j=0;j<cuotasDep;j++) mesesDep.push(mesLabel(getMesN(mesBase,j)));
    html+="<div style='margin-top:4px'>🏠 <b>Deposito:</b> "+cuotasDep+" cuota"+(cuotasDep>1?"s":"")+" de "+fmt(cuotaDep)+" → "+mesesDep.join(", ")+"</div>";
  }
  el.innerHTML=html;
  el.style.borderColor="#F59E0B";
  el.style.color="#FCD34D";
}

function initRvFirma(){
  var canvas=G("rv-firma-canvas"); if(!canvas)return;
  var ctx=canvas.getContext("2d");
  ctx.strokeStyle="#000";ctx.lineWidth=2;ctx.lineCap="round";
  var drawing=false;
  function pos(e){
    var r=canvas.getBoundingClientRect(),touch=e.touches?e.touches[0]:e;
    return{x:(touch.clientX-r.left)*(canvas.width/r.width),y:(touch.clientY-r.top)*(canvas.height/r.height)};
  }
  canvas.onmousedown=canvas.ontouchstart=function(e){e.preventDefault();drawing=true;var p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);};
  canvas.onmousemove=canvas.ontouchmove=function(e){e.preventDefault();if(!drawing)return;var p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();};
  canvas.onmouseup=canvas.ontouchend=function(){drawing=false;};
}
function clearRvFirma(){
  var canvas=G("rv-firma-canvas"); if(!canvas)return;
  canvas.getContext("2d").clearRect(0,0,canvas.width,canvas.height);

  var cuotas=G("rv-cuotas")?parseInt(G("rv-cuotas").value.charAt(0))||1:1;
  var ini=G("rv-ini")?G("rv-ini").value:"";
  var egr=G("rv-egr")?G("rv-egr").value:"";
  if(!alq){alert("El alquiler es obligatorio");return;}

  // Firma nueva
  var canvas=G("rv-firma-canvas");
  var firmaData=canvas?canvas.toDataURL("image/png"):null;
  if(firmaData){
    var tmpC=document.createElement("canvas");tmpC.width=canvas.width;tmpC.height=canvas.height;
    var tmpCtx=tmpC.getContext("2d");tmpCtx.fillStyle="#fff";tmpCtx.fillRect(0,0,tmpC.width,tmpC.height);
    if(canvas.toDataURL()===tmpC.toDataURL()) firmaData=null;
  }

  var _sueldoFile=G("rv-sueldo")&&G("rv-sueldo").files[0]?G("rv-sueldo").files[0]:null;
  var mismo2=G("rv-mismo2")&&G("rv-mismo2").checked;
  var nom2=mismo2?(i.nom2||""):(G("rv-nom2")?G("rv-nom2").value.trim():"");
  var dni2=mismo2?(i.dni2||""):(G("rv-dni2")?G("rv-dni2").value.trim():"");
  var tel2=mismo2?(i.tel2||""):(G("rv-tel2")?G("rv-tel2").value.trim():"");
  var trabajo2=mismo2?(i.trabajo2||""):(G("rv-trabajo2")?G("rv-trabajo2").value.trim():"");
  var _sue2File=(!mismo2&&G("rv-sue2")&&G("rv-sue2").files[0])?G("rv-sue2").files[0]:null;
  var emnom=G("rv-emnom")?G("rv-emnom").value.trim():"";
  var emtel=G("rv-emtel")?G("rv-emtel").value.trim():"";

  var getMesN=function(start,n){
    var yr2=parseInt(start.slice(0,4)),mo2=parseInt(start.slice(5,7))+n;
    while(mo2>12){mo2-=12;yr2++;}return yr2+"-"+String(mo2).padStart(2,"0");
  };
  var mesBase=ini?ini.slice(0,7):mes();

  function _compress(file,cb){
    var reader=new FileReader();
    reader.onload=function(e){
      var img=new Image();
      img.onload=function(){
        var MAX=800,scale=Math.min(1,MAX/Math.max(img.width,img.height));
        var c=document.createElement("canvas");
        c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        cb(c.toDataURL("image/jpeg",0.7));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function _doSave(sueldoB64,sue2B64){
    var upd={alquiler:alq,egreso:egr||i.egreso};
    if(dep>0) upd.deposito=(i.deposito||0)+dep;
    if(firmaData) upd.firma=firmaData;
    if(sueldoB64) upd.doc_sueldo=sueldoB64;
    upd.nom2=nom2; upd.dni2=dni2; upd.tel2=tel2; upd.trabajo2=trabajo2;
    if(sue2B64) upd.foto_sue2=sue2B64;
    if(emnom) upd.ct_emerg=emnom;
    if(emtel) upd.tel_emerg=emtel;
    DB.ref("iq/"+key).update(upd);
    if(dep>0){
      var cuotaDep=Math.round(dep/cuotasDep);
      for(var cd=0;cd<cuotasDep;cd++){
        DB.ref("cob").push({id_ac:i.id_ac||"",unidad:i.unidad,inq:i.nombre,
          mes:getMesN(mesBase,cd),monto_total:cuotaDep,sal_ant:0,estado:"pendiente",pagos:{},
          concepto:"Deposito renovacion cuota "+(cd+1)+"/"+cuotasDep});
      }
    }
    if(gs>0){
      var cuotaGs=Math.round(gs/cuotas);
      for(var cg=0;cg<cuotas;cg++){
        DB.ref("cob").push({id_ac:i.id_ac||"",unidad:i.unidad,inq:i.nombre,
          mes:getMesN(mesBase,cg),monto_total:cuotaGs,sal_ant:0,estado:"pendiente",pagos:{},
          concepto:"Gastos renovacion cuota "+(cg+1)+"/"+cuotas});
      }
    }
    closeModal();closeModal();
    alert("Renovacion registrada. Nuevo alquiler: "+fmt(alq)+(dep>0?". Deposito +"+fmt(dep)+" en "+cuotasDep+" cuota"+(cuotasDep>1?"s":""):"")+(gs>0?". Gastos "+fmt(gs)+" en "+cuotas+" cuota"+(cuotas>1?"s":""):"")+". Fecha de ingreso original sin cambios.");
  }

  if(_sueldoFile&&_sue2File){
    _compress(_sueldoFile,function(s1){_compress(_sue2File,function(s2){_doSave(s1,s2);});});
  } else if(_sueldoFile){
    _compress(_sueldoFile,function(s1){_doSave(s1,null);});
  } else if(_sue2File){
    _compress(_sue2File,function(s2){_doSave(null,s2);});
  } else {
    _doSave(null,null);
  }
}

function _mesesAjustePrevios(n){
  // Devuelve los ultimos n meses de ajuste (abril/agosto/diciembre) ANTERIORES al mes actual, descendente
  var d=new Date(),yr=d.getFullYear(),mo=d.getMonth(); // getMonth() = mes actual - 1 (0..11)
  if(mo<1){yr--;mo=12;}
  var out=[];
  while(out.length<n){
    if(mo===4||mo===8||mo===12){out.push(yr+"-"+String(mo).padStart(2,"0"));}
    mo--;if(mo<1){yr--;mo=12;}
  }
  return out;
}
function openAjusteCuat(){
  var iqA=oA(DATA.iq).filter(function(i){return i.estado==="activo";});
  if(!iqA.length){alert("No hay acuerdos activos");return;}
  var mesesAj=_mesesAjustePrevios(3).reverse(); // ascendente: mas viejo a la izquierda
  var MN={"04":"Abr","08":"Ago","12":"Dic"};
  var cobAll=oA(DATA.cob);
  var _alqDe=function(u,m){
    // Cobro de alquiler de esa unidad en ese mes (excluye deposito/gastos/saldos)
    return cobAll.filter(function(c){
      return c.unidad===u&&c.mes===m&&(!c.concepto||String(c.concepto).indexOf("Alquiler")===0);
    })[0]||null;
  };
  var o="<p style='color:#94A3B8;font-size:12px;margin-bottom:8px'>Modifica el valor del alquiler para cada unidad. El sistema avisara automaticamente 15 dias antes.</p>";
  o+="<p style='color:#F59E0B;font-size:10px;margin-bottom:12px'>Los valores en <b>naranja</b> corresponden a otro inquilino (cambio de inquilino desde ese ajuste).</p>";
  o+="<div style='overflow-x:auto'><table class='tbl'><thead><tr><th>Unidad</th><th>Inquilino</th>";
  mesesAj.forEach(function(m){o+="<th style='color:#64748B'>"+(MN[m.slice(5,7)]||m.slice(5,7))+" "+m.slice(0,4)+"</th>";});
  o+="<th>Actual</th><th>Nuevo valor $</th></tr></thead><tbody>";
  iqA.sort(function(a,b){return a.unidad.localeCompare(b.unidad);}).forEach(function(i){
    o+="<tr><td style='font-weight:600'>"+i.unidad+"</td><td style='font-size:11px'>"+esc(i.nombre.split(",")[0])+"</td>";
    mesesAj.forEach(function(m){
      var c=_alqDe(i.unidad,m);
      if(!c){o+="<td style='color:#475569;font-size:11px'>--</td>";return;}
      var otro=(c.id_ac&&i.id_ac&&c.id_ac!==i.id_ac)||(!c.id_ac&&c.inq&&c.inq!==i.nombre);
      var esU=c.moneda==="USD";

      o+="<td style='font-size:11px;color:"+(otro?"#F59E0B":"#94A3B8")+"'"+(otro?" title='Otro inquilino: "+esc(c.inq||"")+"'":"")+">"+val+(otro?"<div style='font-size:9px;color:#F59E0B'>"+esc((c.inq||"").split(",")[0])+"</div>":"")+"</td>";
    });
    o+="<td style='color:#10B981'>"+fmt(i.alquiler)+"</td><td><input class='inp' type='number' id='aj-"+i._key+"' value='"+i.alquiler+"' style='padding:4px 8px;font-size:12px'/></td></tr>";
  });
  o+="</tbody></table></div>";
  o+="<div style='display:flex;justify-content:flex-end;gap:7px;margin-top:12px'><button class='btn bg bsm' onclick='closeModal()'>Cancelar</button><button class='btn bok bsm' onclick='saveAjusteCuat()'>Guardar Ajuste</button></div>";
  openModal("Ajuste Cuatrimestral",o,true);
}
function saveAjusteCuat(){
  var iqA=oA(DATA.iq).filter(function(i){return i.estado==="activo";});

function convertirReserva(resKey){
  var r=(DATA.res||{})[resKey];if(!r)return;
  // Verificar que el depto no tenga ya un contrato activo
  var contratosActivos=oA(DATA.iq).filter(function(i){return i.unidad===r.unidad&&i.estado==="activo";});
  // Si hay contratos activos pero sin id_ac (creados por el form del inquilino), los borramos
  var soloFormData=contratosActivos.every(function(i){return !i.id_ac;});
  if(contratosActivos.length>0&&!soloFormData){
    alert("El depto "+r.unidad+" ya tiene un contrato activo con ID.");return;
  }
  // Borrar contratos sin ID creados por el form
  contratosActivos.forEach(function(i){if(!i.id_ac)DB.ref("iq/"+i._key).remove();});
  window._resConvert=r;
  window._resConvertKey=resKey;
  openNA();
}

function saveNA(){
  var u=G("na-u").value,n=G("na-n").value,d=G("na-d").value||"PENDIENTE";
  if(!u||!n){alert("Unidad y nombre son obligatorios");return;}
  // Verificar que no haya contrato activo para esa unidad (chequeo rápido con datos locales)
  var deptoActivo=oA(DATA.iq).filter(function(i){return i.unidad===u&&i.estado==="activo";}).length>0;
  if(deptoActivo){
    alert("El depto "+u+" ya tiene un contrato activo. Solo puede haber uno por departamento.");return;
  }
  // Verificar que la MISMA PERSONA no quede activa en dos unidades a la vez
  // (caso Juan Pascieli activo en LT-1 y WT-9). Compara por DNI y por nombre normalizado.
  var dNorm=String(d||"").replace(/\D/g,"");
  var nNorm=String(n||"").toLowerCase().replace(/\s+/g," ").trim();
  var yaActivo=oA(DATA.iq).filter(function(i){
    if(i.estado!=="activo")return false;
    var di=String(i.dni||"").replace(/\D/g,"");
    var ni=String(i.nombre||"").toLowerCase().replace(/\s+/g," ").trim();
    return (dNorm&&di&&di===dNorm)||(nNorm&&ni===nNorm);
  })[0];
  if(yaActivo){
    if(!confirm("⚠ "+n+" YA tiene un acuerdo activo en "+yaActivo.unidad+".\n\nSi se mudo de depto: Cancelar, y en su ficha usar 🔀 Cambiar depto (mueve el acuerdo y libera la unidad vieja, sin duplicar).\n\n¿Crear IGUAL un segundo acuerdo activo? (solo si de verdad alquila dos unidades, ej. depto + cochera)"))return;
  }
  // Deshabilitar botón para evitar doble click
  var btnCrear=document.querySelector("button[onclick='saveNA()']");
  if(btnCrear){
    if(btnCrear.disabled){alert("Ya se esta creando el contrato, por favor espera.");return;}
    btnCrear.disabled=true;btnCrear.textContent="Verificando...";btnCrear.style.opacity="0.5";
  }
  // Revalidación con lectura FRESCA directa a Firebase (no la copia local, que puede estar
  // desactualizada) justo antes de crear el acuerdo. Esto reduce al mínimo la posibilidad de
  // que dos personas creen un acuerdo activo en la misma unidad casi al mismo tiempo.
  DB.ref("iq").orderByChild("unidad").equalTo(u).once("value",function(snap){
    var yaOcupado=false;
    snap.forEach(function(ch){
      var v=ch.val();
      if(v&&v.estado==="activo") yaOcupado=true;
    });
    if(yaOcupado){
      if(btnCrear){btnCrear.disabled=false;btnCrear.textContent="Crear Acuerdo";btnCrear.style.opacity="1";}
      alert("El depto "+u+" se acaba de ocupar (por otra persona, justo ahora). Cerrá esta ventana y elegí otra unidad, o revisá Acuerdos.");
      return;
    }
    if(btnCrear) btnCrear.textContent="Creando...";
    _crearAcuerdoNA(u,n,d,btnCrear);
  },function(err){
    if(btnCrear){btnCrear.disabled=false;btnCrear.textContent="Crear Acuerdo";btnCrear.style.opacity="1";}
    alert("Error de conexión al verificar disponibilidad, intentá de nuevo: "+err.message);
  });
}
function _crearAcuerdoNA(u,n,d,btnCrear){
  // Guardar key de reserva localmente ANTES de cualquier operacion async
  var resKeyLocal=window._resConvertKey||null;
  var vigente=G("na-vigente")&&G("na-vigente").checked;
  var hist=oA(DATA.hist).filter(function(h){return h.dni===d;});
  if(hist.length>0&&!confirm("Este DNI tiene historial previo. Motivo: "+(hist[0].motivo_egreso||"--")+". Continuas?")){
    if(btnCrear){btnCrear.disabled=false;btnCrear.textContent="Crear Acuerdo";btnCrear.style.opacity="1";}
    return;
  }

  var id=nid();
  var moneda=(G("na-moneda")||{value:"ARS"}).value||"ARS";
  var alqUSD=fmtInputVal(G("na-alq-usd")||{value:"0",dataset:{raw:"0"}});
  var alq=moneda==="USD"?0:fmtInputVal(G("na-alq"));
  // Para USD guardamos 0 en alquiler (pesos) y alquiler_usd en USD
  var ing=G("na-ing").value;
  var mesInicio=ing?ing.slice(0,7):mes();

  var getMesN=function(start,nn){
    var yr=parseInt(start.slice(0,4)),mo=parseInt(start.slice(5,7))+nn;
    while(mo>12){mo-=12;yr++;}return yr+"-"+String(mo).padStart(2,"0");
  };

  if(vigente){
    // CONTRATO VIGENTE - save with historical data, generate current month cobro
    var depInfo=fmtInputVal(G("na-dep-info")||{value:"0",dataset:{raw:"0"}});
    var gsInfo=fmtInputVal(G("na-gs-info")||{value:"0",dataset:{raw:"0"}});
    var deudaMes=G("na-deuda-mes")?G("na-deuda-mes").value:"";
    var deudaMonto=fmtInputVal(G("na-deuda-monto")||{value:"0",dataset:{raw:"0"}});

    DB.ref("iq").push({
      id_ac:id,unidad:u,estado:"activo",nombre:n,dni:d,
      tel:G("na-t").value,email:"",
      ct_emerg:G("na-ce").value,tel_emerg:G("na-te").value,
      alquiler:alq,alquiler_usd:moneda==="USD"?alqUSD:0,moneda:moneda,
      deposito:depInfo,gastos:gsInfo,
      pago_cuenta:0,ingreso:ing,egreso:G("na-egr").value,
      ultimo_aj:ing,obs_ingreso:G("na-obs").value,obs_egreso:"",
      fecha_reg:hoy(),tipo_carga:"vigente"
    });

    // Check if cobro already exists for this unit this month
    var cobExistente=oA(DATA.cob).filter(function(c){return c.unidad===u&&c.mes===mes();});
    var montoCobro=moneda==="USD"?alqUSD:alq;
    if(cobExistente.length>0){
      var upsCob={id_ac:id,inq:n,monto_total:montoCobro};
      if(moneda==="USD") upsCob.moneda="USD";
      DB.ref("cob/"+cobExistente[0]._key).update(upsCob);
    } else if(montoCobro>0){
      var nuevoCob={id_ac:id,unidad:u,inq:n,mes:mes(),
        monto_total:montoCobro,sal_ant:0,estado:"pendiente",pagos:{},concepto:"Alquiler"};
      if(moneda==="USD") nuevoCob.moneda="USD";
      DB.ref("cob").push(nuevoCob);
    }
    // Generate debt from previous month if any
    if(deudaMes&&deudaMonto>0){
      // Check if debt cobro already exists
      var deudaExistente=oA(DATA.cob).filter(function(c){return c.unidad===u&&c.mes===deudaMes;});
      if(deudaExistente.length>0){
        // Update existing with correct data
        DB.ref("cob/"+deudaExistente[0]._key).update({id_ac:id,inq:n,monto_total:deudaMonto,concepto:"Saldo pendiente "+deudaMes});
      } else {
        DB.ref("cob").push({id_ac:id,unidad:u,inq:n,mes:deudaMes,
          monto_total:deudaMonto,sal_ant:0,estado:"pendiente",pagos:{},
          concepto:"Saldo pendiente "+deudaMes});
      }
    }
    closeModal();
    var msg="Acuerdo vigente cargado. ";
    if(cobExistente.length>0) msg+="Cobranza de "+mes()+" actualizada. ";
    else msg+="Alquiler de "+mes()+" generado. ";
    if(deudaMonto>0) msg+="Deuda de "+deudaMes+": "+fmt(deudaMonto)+" registrada.";
    alert(msg);
    // FIX: marcar reserva/form como convertidos tambien en modo VIGENTE (antes solo lo hacia el modo nuevo)
    if(resKeyLocal){
      DB.ref("res/"+resKeyLocal).update({estado:"convertida",id_acuerdo:id,fecha_conversion:hoy()},function(err){
        if(err) alert("Error al marcar reserva: "+err.message);
      });
    }
    var _fkVig=window._formConvertKey||null;
    if(_fkVig){
      DB.ref("forms/"+_fkVig).update({estado:"convertido",id_acuerdo:id,fecha_conversion:hoy()});
    }
    window._resConvert=null;window._resConvertKey=null;window._formConvertKey=null;
    setTimeout(rAcuerdos,600);

  } else {
    // CONTRATO NUEVO - full flow
    var dep=fmtInputVal(G("na-dep"));
    var gs=fmtInputVal(G("na-gs"));
    var desc=fmtInputVal(G("na-desc-gs"));
    var gsNeto=Math.max(0,gs-desc);
    var pc=fmtInputVal(G("na-pc"));
    var posMonto=fmtInputVal(G("na-pos-monto")||{value:"0",dataset:{raw:"0"}});
    var posCta=(G("na-pos-cta")||{value:"Efectivo"}).value||"Efectivo";
    var pcCta=(G("na-pc-cta")||{value:"Efectivo"}).value||"Efectivo";
    var pcFechaGuardada=G("na-pc-fecha")&&G("na-pc-fecha").value?G("na-pc-fecha").value:"";
    var pcFecha=pcFechaGuardada||ing||hoy();
    var cuotasDep=parseInt((G("na-cuotas-dep").value||"1").charAt(0))||1;
    var cuotasGs=parseInt((G("na-cuotas-gs").value||"1").charAt(0))||1;
    var pcRestante=pc;

    // Leer TODOS los valores del DOM antes de cerrar el modal
    var _tel=G("na-t")?G("na-t").value:"";
    var _ce=G("na-ce")?G("na-ce").value:"";
    var _te=G("na-te")?G("na-te").value:"";
    var _egr=G("na-egr")?G("na-egr").value:"";
    var _obs=G("na-obs")?G("na-obs").value:"";
    var _posesion=G("na-posesion")?G("na-posesion").value:"";
    // Leer checkbox y fecha ANTES de closeModal (que destruye el DOM del modal)
    var _pcDesdeRes=G("na-pc-fecha")&&G("na-pc-fecha").value;
    var _pcYaCaja=G("na-pc-ya-caja")&&G("na-pc-ya-caja").checked;
    // Leer datos del form ANTES de limpiar la key
    var _formConvertKeyLocal=window._formConvertKey||null;
    var _formData=(_formConvertKeyLocal&&DATA.forms)?(DATA.forms[_formConvertKeyLocal]||null):null;

    // Cerrar modal antes de Firebase para evitar que el listener lo destruya
    closeModal();
    window._resConvert=null;
    window._resConvertKey=null;
    window._formConvertKey=null;

    // Guardar inquilino — incluir todos los datos del form si viene de conversión
    DB.ref("iq").push({
      id_ac:id,unidad:u,estado:"activo",nombre:n,dni:d,
      tel:_tel,email:_formData?(_formData.email||""):"",
      ct_emerg:_ce,tel_emerg:_te,
      rel_emerg:_formData?(_formData.rel_emerg||""):"",
      // Trabajo (del form si existe)
      trabajo:_formData?(_formData.trabajo||_formData.trabajo1||""):"",
      trabajo1:_formData?(_formData.trabajo1||_formData.trabajo||""):"",
      trabajo_dir:_formData?(_formData.trabajo_dir||""):"",
      trabajo_tel:_formData?(_formData.trabajo_tel||""):"",
      trabajo_jefe:_formData?(_formData.trabajo_jefe||""):"",
      // 2do inquilino (del form si existe)
      nom2:_formData?(_formData.nom2||""):"",
      dni2:_formData?(_formData.dni2||""):"",
      tel2:_formData?(_formData.tel2||""):"",
      email2:_formData?(_formData.email2||""):"",
      trabajo2:_formData?(_formData.trabajo2||""):"",
      trabajo2_dir:_formData?(_formData.trabajo2_dir||""):"",
      trabajo2_tel:_formData?(_formData.trabajo2_tel||""):"",
      trabajo2_jefe:_formData?(_formData.trabajo2_jefe||""):"",
      // Documentación y firma
      doc_dni_f:_formData?(_formData.doc_dni_f||null):null,
      doc_dni_d:_formData?(_formData.doc_dni_d||null):null,
      doc_sueldo:_formData?(_formData.doc_sueldo||null):null,
      foto_dni2f:_formData?(_formData.foto_dni2f||null):null,
      foto_dni2d:_formData?(_formData.foto_dni2d||null):null,
      foto_sue2:_formData?(_formData.foto_sue2||null):null,
      firma:_formData?(_formData.firma||null):null,
      firma2:_formData?(_formData.firma2||null):null,
      fecha_firma:_formData?(_formData.fecha_firma||null):null,
      // Fecha de posesión real — prioridad: campo manual > datos del form
      fecha_posesion:_posesion||(_formData?(_formData.posesion||_formData.fecha_posesion||null):null),
      // Datos económicos
      alquiler:alq,alquiler_usd:moneda==="USD"?alqUSD:0,moneda:moneda,
      deposito:dep,gastos:gs,gastos_neto:gsNeto,
      descuento_gs:desc,pago_cuenta:pc,total_ingreso:alq+dep+gsNeto,
      ingreso:ing,egreso:_egr,
      ultimo_aj:ing,obs_ingreso:_obs,obs_egreso:"",fecha_reg:hoy()
    });

    // Aplicar pago a cuenta a las cobranzas
    var _pcAplicar=function(monto){
      if(pcRestante<=0)return{monto:monto,pagos:{},estado:"pendiente"};
      var aplicado=Math.min(pcRestante,monto);pcRestante-=aplicado;
      var pagos={};pagos["p"+Date.now()+Math.floor(Math.random()*1000)]={fecha:pcFecha,monto:aplicado,cuenta:pcCta,concepto:"Pago a cuenta"};
      return{monto:monto,pagos:pagos,estado:aplicado>=monto?"pagado":"parcial"};
    };

    if(alq>0){var ca=_pcAplicar(alq);DB.ref("cob").push({id_ac:id,unidad:u,inq:n,mes:mesInicio,monto_total:ca.monto,sal_ant:0,estado:ca.estado,pagos:ca.pagos,concepto:"Alquiler"});}
    if(dep>0){var cuotaDep=Math.round(dep/cuotasDep);for(var cd=0;cd<cuotasDep;cd++){var cad=cd===0?_pcAplicar(cuotaDep):{monto:cuotaDep,pagos:{},estado:"pendiente"};DB.ref("cob").push({id_ac:id,unidad:u,inq:n,mes:getMesN(mesInicio,cd),monto_total:cad.monto,sal_ant:0,estado:cad.estado,pagos:cad.pagos,concepto:"Deposito cuota "+(cd+1)+"/"+cuotasDep});}}
    if(gsNeto>0){var cuotaGs=Math.round(gsNeto/cuotasGs);for(var cg=0;cg<cuotasGs;cg++){var cag=cg===0?_pcAplicar(cuotaGs):{monto:cuotaGs,pagos:{},estado:"pendiente"};DB.ref("cob").push({id_ac:id,unidad:u,inq:n,mes:getMesN(mesInicio,cg),monto_total:cag.monto,sal_ant:0,estado:cag.estado,pagos:cag.pagos,concepto:"Gastos de gestion"+(cuotasGs>1?" cuota "+(cg+1)+"/"+cuotasGs:"")+(desc>0?" (c/desc. "+fmt(desc)+")":"")});}}

    // Registrar pago a cuenta en caja SOLO si: no viene de reserva, no está marcado "ya en caja", y la caja NO está cerrada
    if(pc>0&&!_pcDesdeRes&&!_pcYaCaja){
      var _cajaCerradaPC=oA(DATA.subc||{}).filter(function(s){return s.fecha===pcFecha;})[0];
      if(_cajaCerradaPC){
        alert("⚠ La caja del "+pcFecha+" ya está cerrada. El pago a cuenta de "+fmt(pc)+" NO se registró en caja. Cargalo manualmente como ajuste de ingreso.");
      } else {
        DB.ref("aj").push({fecha:pcFecha,tipo:"ingreso",sub:"Pago a cuenta ingreso",
          cuenta:pcCta,concepto:"Pago a cuenta #"+id+" - "+n+" - "+u,monto:pc,auto:true});
      }
    }

    // Registrar pago al tomar posesion — fecha = HOY, SOLO si la caja no está cerrada
    if(posMonto>0){
      var _socioMapP={"MP Loli":"Cuenta Loli","Visa BBVA Loli":"Cuenta Loli","Master BBVA Loli":"Cuenta Loli",
        "MP Hugo":"Cuenta Hugo","Master BBVA Hugo":"Cuenta Hugo","Visa BBVA Hugo":"Cuenta Hugo"};
      var fechaPosesion=hoy();
      var _cajaCerradaHoy=oA(DATA.subc||{}).filter(function(s){return s.fecha===fechaPosesion;})[0];
      if(_cajaCerradaHoy){
        alert("⚠ La caja de hoy ya está cerrada. El pago de posesión de "+fmt(posMonto)+" NO se registró en caja. Cargalo manualmente mañana como ajuste de ingreso.");
      } else {
        if(CTAS_SOCIOS.indexOf(posCta)>=0){
          // El inquilino pagó a una cuenta personal de un socio -> el socio RECIBE esa plata = RETIRO
          DB.ref("movs").push({fecha:fechaPosesion,mes:fechaPosesion.slice(0,7),tipo:"retiro",
            cuenta:CTAS_SOCIO_MAP[posCta]||"Cuenta Loli",cuenta_caja:posCta,monto:posMonto,
            nota:"Pago posesion #"+id+" - "+n+" - "+u});
        } else {
          DB.ref("aj").push({fecha:fechaPosesion,tipo:"ingreso",sub:"Pago posesion",
            cuenta:posCta,concepto:"Pago al tomar posesion #"+id+" - "+n+" - "+u,
            monto:posMonto,auto:true});
        }
      }
    }

    // Mostrar mensaje y actualizar pantalla
    var msg="Acuerdo #"+id+" creado. ";
    if(alq>0)msg+="Alquiler "+fmt(alq)+". ";
    if(pc>0)msg+="Pago a cuenta: "+fmt(pc)+". ";
    if(posMonto>0)msg+="Pago posesion: "+fmt(posMonto)+".";
    alert(msg);
    // Marcar reserva como convertida
    if(resKeyLocal){
      DB.ref("res/"+resKeyLocal).update({estado:"convertida",id_acuerdo:id,fecha_conversion:hoy()},function(err){
        if(err) alert("Error al marcar reserva: "+err.message);
      });
    }
    // Marcar formulario como convertido
    if(_formConvertKeyLocal){
      DB.ref("forms/"+_formConvertKeyLocal).update({estado:"convertido",id_acuerdo:id,fecha_conversion:hoy()});
    }
    setTimeout(rAcuerdos,600);
  }
}


// HISTORIAL
function rHistorial(){
  var hist=oA(DATA.hist);
  G("main").innerHTML="<div style='margin-bottom:12px'><h2 style='font-size:20px;font-weight:800'>Historial de Inquilinos</h2><p style='color:#64748B;font-size:11px'>"+hist.length+" registros</p></div><div style='margin-bottom:10px'><input class='inp' id='hist-q' placeholder='Buscar nombre, DNI, unidad...' oninput='fH()'/></div><div id='hist-list'></div>";
  fH();
}
function fH(){
  var hist=oA(DATA.hist),el=G("hist-list");if(!el)return;
  var q=(G("hist-q")||{value:""}).value.toLowerCase();
  var list=hist.filter(function(i){
    return(i.nombre||"").toLowerCase().includes(q)
      ||(i.unidad||"").includes(q)
      ||(i.dni||"").includes(q)
      ||(i.id_ac||"").includes(q);
  }).sort(function(a,b){return(b.fecha_cierre||"").localeCompare(a.fecha_cierre||"");});
  if(!list.length){el.innerHTML="<p style='color:#64748B;text-align:center;padding:32px'>Sin resultados</p>";return;}
  var rows=list.map(function(i){
    var cod=(i.unidad||"").split("-")[0],ec=COL[cod]||"#64748B";
    var malo=(i.obs_egreso||"").toLowerCase().includes("deuda")||(i.obs_egreso||"").toLowerCase().includes("problema");
    var ki=kpush(i._key);
    var o="<div class='card' style='padding:12px;border-left:3px solid "+(malo?"#EF4444":"#334155")+";cursor:pointer' data-histkey='"+ki+"'>";
    o+="<div style='display:flex;gap:9px;align-items:flex-start'>";
    o+="<div style='background:"+ec+"22;color:"+ec+";border-radius:9px;padding:5px 9px;font-weight:800;font-size:11px;min-width:44px;text-align:center;flex-shrink:0'>"+esc(i.unidad||"--")+"</div>";
    o+="<div style='flex:1'>";
    o+="<div style='font-weight:700;font-size:13px'>"+esc(i.nombre)+(malo?" <span style='color:#EF4444;font-size:10px'>[DEUDA/PROBLEMA]</span>":"")+"</div>";
    o+="<div style='color:#64748B;font-size:10px'>DNI "+(i.dni||"--")+" - ID #"+(i.id_ac||"--")+"</div>";
    o+="<div style='color:#64748B;font-size:10px'>Ingreso: "+(i.ingreso||"--")+" - Egreso: "+(i.fecha_egreso_real||i.egreso||"--")+"</div>";
    if(i.motivo_egreso) o+="<div style='color:#F59E0B;font-size:10px'>Motivo: "+esc(i.motivo_egreso)+"</div>";
    o+="</div>";
    o+="<span style='color:#64748B;font-size:10px;flex-shrink:0'>ver ></span>";
    o+="</div></div>";
    return o;
  });
  el.innerHTML=rows.join("");
  el.onclick=function(e){
    var b=e.target.closest("[data-histkey]");
    if(b) openFichaHist(kget(parseInt(b.dataset.histkey)));
  };
}

function openFichaHist(key){
  var i=DATA.hist[key]; if(!i) return;
  var o="<div class='g2' style='margin-bottom:12px'>";
  var rows=[
    ["ID Acuerdo","#"+(i.id_ac||"--")],["Unidad",i.unidad||"--"],
    ["Nombre",i.nombre],["DNI",i.dni||"--"],["Telefono",i.tel||"--"],
    ["Alquiler",fmt(i.alquiler||0)],["Deposito",fmt(i.deposito||0)],
    ["Ingreso",i.ingreso||"--"],["Egreso real",i.fecha_egreso_real||i.egreso||"--"],
    ["Cierre",i.fecha_cierre||"--"],["Motivo",i.motivo_egreso||"--"]
  ];
  rows.forEach(function(r){o+="<div><div class='lbl'>"+r[0]+"</div><div style='font-size:12px'>"+esc(r[1])+"</div></div>";});
  o+="</div>";
  if(i.deuda_pendiente>0) o+="<div style='background:#EF444411;border:1px solid #EF444444;border-radius:8px;padding:10px;margin-bottom:8px'><b style='color:#EF4444'>⚠ Deuda pendiente al momento de irse:</b> <span style='color:#EF4444;font-weight:700;font-size:14px'>"+fmt(i.deuda_pendiente)+"</span><div style='color:#64748B;font-size:11px;margin-top:3px'>Si esta persona vuelve a contactarse, este monto sigue impago.</div></div>";
  if(i.obs_egreso) o+="<div style='background:#EF444411;border-left:3px solid #EF4444;border-radius:0 8px 8px 0;padding:10px;margin-bottom:8px;font-size:12px'><b style='color:#EF4444'>Obs. egreso:</b> "+esc(i.obs_egreso)+"</div>";
  if(i.obs_ingreso) o+="<div style='background:#0F172A;border-radius:8px;padding:10px;margin-bottom:8px;font-size:12px'><b class='lbl'>Obs. ingreso:</b> "+esc(i.obs_ingreso)+"</div>";
  if(i.historial_eventos){
    o+="<div style='background:#0F172A;border-radius:8px;padding:10px;margin-bottom:8px'>";
    o+="<div class='lbl' style='margin-bottom:6px'>Historial de eventos</div>";
    i.historial_eventos.split(" | ").forEach(function(ev){
      if(ev.trim()) o+="<div style='font-size:11px;color:#94A3B8;padding:3px 0;border-bottom:1px solid #1E293B'>"+esc(ev)+"</div>";
    });
    o+="</div>";
  }
  if(USER.r==="admin"){
    o+="<div style='display:flex;gap:7px;margin-top:8px;flex-wrap:wrap'>";
    o+="<button class='btn bok bsm' onclick='reactivarAcuerdo(\""+key+"\")'>&#x21A9; Volver a vigente (se arrepintio, se queda)</button>";
    o+="<button class='btn bx bsm' onclick='borrarBaja(\""+key+"\")'>&#x1F5D1; Borrar esta baja (prueba)</button>";
    o+="</div>";
  }
  openModal("Historial - "+esc(i.nombre),o,true);
}
function reactivarAcuerdo(histKey){
  var h=(DATA.hist||{})[histKey]; if(!h){alert("Registro no encontrado");return;}
  var conflict=oA(DATA.iq).some(function(x){return x.estado==="activo"&&x.unidad===h.unidad;});
  var msg="Volver el acuerdo de "+h.nombre+" ("+h.unidad+") a VIGENTE?\nEl depto vuelve a estar ocupado y sus cobros pendientes vuelven a Cobranzas.";
  if(conflict)msg+="\n\nOJO: "+h.unidad+" YA tiene un acuerdo activo. Si continuas van a quedar dos acuerdos en la misma unidad.";
  if(!confirm(msg))return;
  // Reconstruir el acuerdo activo a partir del registro de historial
  var iq=Object.assign({},h);
  ["estado","fecha_egreso_real","motivo_egreso","obs_egreso","fecha_cierre","deuda_pendiente","historial_eventos","_key"].forEach(function(k){delete iq[k];});
  iq.estado="activo";
  var newKey=DB.ref("iq").push().key;
  var batch={};
  batch["iq/"+newKey]=iq;
  // Desarchivar los cobros de este acuerdo (vuelven a Cobranzas/Caja/Alertas)
  oA(DATA.cob).forEach(function(c){if(c.id_ac&&c.id_ac===h.id_ac&&c.archivado_hist)batch["cob/"+c._key+"/archivado_hist"]=false;});
  // Reactivar adicionales que se dieron de baja al cerrar
  oA(DATA.cfg).forEach(function(a){if(a.tipo==="adicional_iq"&&a.unidad===h.unidad&&a.baja_por_cierre){batch["cfg/"+a._key+"/activo"]=true;batch["cfg/"+a._key+"/baja_por_cierre"]=null;batch["cfg/"+a._key+"/hasta"]=null;}});
  DB.ref("/").update(batch,function(err){
    if(err){alert("Error: "+err.message);return;}
    DB.ref("hist/"+histKey).remove(function(){
      closeModal();
      alert("Listo. "+h.nombre+" volvio a estar vigente en "+h.unidad+".");
      go("acuerdos");
    });
  });
}
// Borrar UNA baja del historial (para sacar pruebas puntuales)
function borrarBaja(histKey){
  var h=(DATA.hist||{})[histKey]; if(!h){alert("Registro no encontrado");return;}
  if(!confirm("Borrar del historial la baja de "+h.nombre+" ("+h.unidad+")?\nEsto es una prueba y no se puede deshacer.\nNo toca sus cobros: si eran reales, revisalos aparte."))return;
  DB.ref("hist/"+histKey).remove(function(){closeModal();alert("Baja borrada del historial.");go("historial");});
}
// Ver / borrar bajas anteriores a una fecha (limpiar pruebas, conservar de una fecha en adelante)
function verBajasViejas(){
  var f=(G("hl-fecha")||{value:""}).value; if(!f){alert("Elegí una fecha");return;}
  var viejas=oA(DATA.hist).filter(function(h){var fc=h.fecha_cierre||h.fecha_egreso_real||h.egreso||"";return fc&&fc<f;});
  var el=G("hl-res"); if(!el)return;
  window._bajasViejasF=f;
  if(!viejas.length){el.innerHTML="<div style='color:#10B981;font-size:12px'>No hay bajas anteriores a "+f+". Nada para borrar.</div>";return;}
  var o="<div style='font-size:11px;color:#94A3B8;margin-bottom:6px'>Se borrarían <b>"+viejas.length+"</b> baja(s), cerradas antes de "+f+" (las del "+f+" en adelante se conservan):</div>";
  o+="<div style='max-height:180px;overflow:auto;background:#0F172A;border-radius:8px;padding:8px'>";
  viejas.sort(function(a,b){return(a.fecha_cierre||"").localeCompare(b.fecha_cierre||"");}).forEach(function(h){
    o+="<div style='font-size:11px;color:#CBD5E1;padding:3px 0;border-bottom:1px solid #1E293B'>"+esc(h.unidad||"")+" · "+esc(h.nombre||"")+" · cierre "+esc(h.fecha_cierre||h.fecha_egreso_real||"--")+"</div>";
  });
  o+="</div>";

// COBRANZAS
var _cobMes=mes();
function rCob(){
  var cobMesActual=oA(DATA.cob).filter(function(c){return c.mes===_cobMes&&!c.archivado_hist;});
  // Saldos VENCIDOS de meses anteriores (mes < mes actual) que siguen sin pagar, de acuerdos
  // activos — ej: depósito o gastos de gestión que quedaron sin terminar de cobrar. Esto es
  // distinto a cuotas futuras (esas no deben aparecer todavía, no vencieron). Se muestran como
  // renglón propio para que ningún saldo quede "escondido" solo por estar en otro mes.
  var idsActivos={};
  oA(DATA.iq).filter(function(i){return i.estado==="activo";}).forEach(function(i){if(i.id_ac) idsActivos[i.id_ac]=true;});
  var saldosVencidos=oA(DATA.cob).filter(function(c){
    if(!(c.mes&&c.mes<_cobMes&&!c.archivado_hist&&c.estado!=="pagado"&&c.id_ac&&idsActivos[c.id_ac]))return false;
    // Cobros de alquiler encadenados: si existe un cobro más nuevo de la misma cadena,
    // su saldo YA viaja en el +Ant de ese mes. Mostrarlo de nuevo acá duplicaría la deuda.
    if(esCobroAlq(c)){
      var monC=c.moneda==="USD"?"USD":"ARS";
      var hayPosterior=oA(DATA.cob).some(function(x){
        return x.id_ac===c.id_ac&&x.mes&&x.mes>c.mes&&!x.archivado_hist&&esCobroAlq(x)&&((x.moneda==="USD"?"USD":"ARS")===monC);
      });
      if(hayPosterior)return false;
    }
    return true;
  });
  var allCob=cobMesActual.concat(saldosVencidos);
  // ESPERADO del mes: cargo real del mes (semanal = semanas reales x valor; el resto = monto_total). Sin arrastre.
  var esp=cobMesActual.reduce(function(s,c){
    if(c.moneda==="USD")return s;
    var iqR=iqDeCobro(c);
    var esSem=iqR&&iqR.frecuencia==="semanal"&&Number(iqR.alq_semanal||0)>0;
    var cargo=(esSem&&esCobroAlq(c))?diasPagoMes(c.mes,(iqR.dia_sem!=null?Number(iqR.dia_sem):3)).length*Number(iqR.alq_semanal):Number(c.monto_total||0);
    return s+cargo;
  },0);
  // COBRADO del mes: pagos hechos sobre los cobros de este mes.
  var cob=cobMesActual.reduce(function(s,c){return s+(c.moneda==="USD"?0:pTpesos(c));},0);
  // PENDIENTE (deuda vieja): saldo real acumulado hasta el mes ANTERIOR, por el MOTOR ÚNICO
  // (incluye semanal bien contado, ej. OT). Nada queda escondido.
  var _yr=parseInt(_cobMes.split("-")[0]),_mo=parseInt(_cobMes.split("-")[1]);
  var _mesPrev=_mo===1?(_yr-1)+"-12":_yr+"-"+String(_mo-1).padStart(2,"0");
  var pendAnt=0,nVenc=0;
  oA(DATA.iq).filter(function(i){return i.estado==="activo"&&i.id_ac;}).forEach(function(i){
    var sp=saldoInq(i.id_ac,_mesPrev).ars;
    if(sp>1){pendAnt+=sp;nVenc++;}
  });

  // Apply filters
  var edFil=localStorage.getItem("gp_cob_ed")||"";
  var sortFil=localStorage.getItem("gp_cob_sort")||"unidad";
  var cobA=allCob.slice();
  if(edFil) cobA=cobA.filter(function(c){return c.unidad&&c.unidad.startsWith(edFil+"-");});
  cobA.sort(function(a,b){
    if(sortFil==="estado"){var ord={pendiente:0,parcial:1,pagado:2};return(ord[a.estado]||0)-(ord[b.estado]||0);}
    if(sortFil==="monto") return b.monto_total-a.monto_total;
    return (a.unidad||"").localeCompare(b.unidad||"");
  });

  var edOpts=Object.keys(ED).map(function(k){return "<option"+(k===edFil?" selected":"")+">"+k+"</option>";}).join("");

  var html="<div style='display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px'>";
  html+="<div><h2 style='font-size:20px;font-weight:800'>Cobranzas</h2><p style='color:#06B6D4;font-size:12px;font-weight:600'>📅 "+mesLabel(_cobMes)+"</p><p style='color:#64748B;font-size:11px'>"+cobA.length+" de "+allCob.length+" registros</p></div>";
  html+="<div style='display:flex;gap:6px;flex-wrap:wrap'>"+mesSelect('cob-mes-inp',_cobMes,"_cobMes=this.value;rCob()")+"<button class='btn bok bsm' onclick='estadoCuentas()'>📊 Estado de cuentas (todos)</button><button class='btn bg bsm' onclick='genCob()'>Generar</button>"+((USER.r==="admin"||USER.r==="lector")?"<button class='btn bsm' style='background:#EF444422;color:#EF4444;border:1px solid #EF444444' onclick='limpiarDuplicadosCob()'>Limpiar duplicados</button><button class='btn bg bsm' onclick='imprimirVista(this.dataset.t)' data-t='Cobranzas'>🖨 Imprimir</button>":"")+"</div></div>";

  html+="<div style='display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px'>";
  html+="<select class='inp' style='max-width:110px' id='cob-ed'><option value=''>Todos</option>"+edOpts+"</select>";
  html+="<select class='inp' style='max-width:140px' id='cob-sort'><option value='unidad'"+(sortFil==="unidad"?" selected":"")+">Por unidad</option><option value='estado'"+(sortFil==="estado"?" selected":"")+">Por estado</option><option value='monto'"+(sortFil==="monto"?" selected":"")+">Por monto</option></select>";
  html+="</div>";

  html+="<div style='display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-bottom:12px'>";
  html+=sc("$","Esperado",fmt(esp),"del mes","#3B82F6")+sc("V","Cobrado",fmt(cob),"del mes","#10B981")+sc("X","Falta del mes",fmt(esp-cob),"","#F59E0B")+sc("⏰","Pendiente",fmt(pendAnt),(nVenc?nVenc+" con deuda anterior":"deuda anterior"),"#EF4444");
  var tcCob=Number(localStorage.getItem("gp_tc_"+_cobMes)||0);
  if(tcCob>0) html+=sc("U$S","Cobrado USD",fusd(cob,tcCob),"TC $"+tcCob,"#06B6D4");
  html+="</div>";
  // TC input for this month
  html+="<div style='display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:12px'>";
  html+="<span style='color:#64748B'>TC del mes (para ver en U$S):</span>";
  html+="<input class='inp' type='text' style='max-width:100px;padding:4px 8px' id='cob-tc' value='"+(tcCob>0?tcCob:"")+"'  placeholder='Ej: 1400' onchange='_setCobTC(this.value)'/>"
  html+="</div>";

  if(!cobA.length){
    html+="<div style='text-align:center;padding:32px;color:#64748B'><p>Sin cobranzas"+(edFil?" para "+edFil:"")+".</p><button class='btn bp' onclick='genCob()' style='margin-top:8px'>Generar</button></div>";
    G("main").innerHTML=html;
    return;
  }

  var CE={pagado:"#10B981",parcial:"#F59E0B",pendiente:"#EF4444"};
  var rows=[];
  cobA.forEach(function(c){
    var pg=pT(c),tot=c.monto_total+Number(c.sal_ant||0);
    var cod=(c.unidad||"").split("-")[0],ec=COL[cod]||"#64748B";
    var ps=pA(c).map(function(p){return fmt(p.monto)+" ("+p.cuenta+")";}).join(" + ");
    var concepto=c.concepto||"Alquiler";
    if(c.mes&&c.mes!==_cobMes) concepto+=" ["+esc(c.mes)+" vencido]";
    var ki=kpush(c._key);
    var row="<div class='card' style='display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:12px'>";
    row+="<div style='display:flex;gap:9px;align-items:center;flex:1'>";
    row+="<div style='background:"+ec+"22;color:"+ec+";border-radius:9px;padding:5px 8px;font-weight:800;font-size:11px;min-width:44px;text-align:center'>"+c.unidad+"</div>";
    row+="<div><div style='font-weight:600;font-size:13px'>"+esc(c.inq||"")+"</div>";
    var montoLabel=c.moneda==="USD"?"U$S "+Number(c.monto_total).toLocaleString():fmt(c.monto_total);
    var iqRow=iqDeCobro(c),sem=iqRow?infoSemanal(iqRow,c):null;
    if(sem)concepto=(c.concepto_extra||"Alquiler semanal")+" · "+fmt(sem.monto)+" los "+DIAS_SEM[sem.dow];
    row+="<div style='color:#64748B;font-size:10px'>"+esc(concepto)+" — "+montoLabel+(c.sal_ant>0?" <span style='color:#F59E0B' title='Saldo del mes anterior'>+Ant.:"+fmt(c.sal_ant)+"</span>":(Number(c.sal_ant||0)<0?" <span style='color:#10B981' title='Saldo a favor del mes anterior'>a favor:"+fmt(-c.sal_ant)+"</span>":""))+"</div>";
    if(sem)row+="<div style='color:#94A3B8;font-size:9px'>Semana "+Math.min(sem.venc||1,sem.total)+"/"+sem.total+" del mes · pagadas: "+sem.pagadas+"</div>";

    if(sem){

      else if(sem.adelanto)row+="<div style='color:#06B6D4;font-weight:700;font-size:12px'>Adelantado ("+sem.pagadas+"/"+sem.total+" sem.)</div>";
      else row+="<div style='color:#10B981;font-weight:700;font-size:12px'>Al día esta semana ✓</div>";
    } else {
      row+="<div style='color:"+(pg>tot?"#06B6D4":pg>=tot?"#10B981":"#EF4444")+";font-weight:700;font-size:12px'>"+(pg>tot?"A favor "+fmt(pg-tot):pg>=tot?"Al dia":"Debe "+fmt(tot-pg))+"</div>";

  });

  html+=rows.join("");
  G("main").innerHTML=html;

function limpiarDuplicadosCob(){
  // Para cada unidad+mes, si hay mas de un cobro con concepto "Alquiler" (o sin concepto especial),
  // conservar el que tiene pagos y/o el creado por saveNA (tiene sal_ant=0 y concepto="Alquiler")
  // Eliminar los generados de mas (sin pagos)
  var cobsArr=oA(DATA.cob);
  var grupos={};
  cobsArr.forEach(function(c){
    // Agrupar cobros de alquiler por unidad+mes (los de deposito/gastos tienen concepto distinto)
    var esAlq=!c.concepto||c.concepto==="Alquiler"||c.concepto==="Alquiler USD"||(c.concepto_extra!==undefined&&!c.concepto);
    if(!esAlq)return;
    var k=c.unidad+"|"+c.mes;
    if(!grupos[k])grupos[k]=[];
    grupos[k].push(c);
  });
  var aBorrar=[];
  Object.values(grupos).forEach(function(grp){
    if(grp.length<=1)return;
    // Ordenar: los que tienen pagos primero, luego por monto_total desc
    grp.sort(function(a,b){
      var pa=pT(a),pb=pT(b);
      if(pa!==pb)return pb-pa; // más pagado primero
      return (b.monto_total||0)-(a.monto_total||0);
    });
    // Conservar el primero, marcar el resto para borrar (solo si no tienen pagos)
    for(var i=1;i<grp.length;i++){
      if(pT(grp[i])===0){
        aBorrar.push(grp[i]._key);
      }
    }
  });
  if(!aBorrar.length){alert("No se encontraron duplicados de alquiler sin pagos.");return;}
  if(!confirm("Se encontraron "+aBorrar.length+" cobro(s) duplicado(s) sin pagos. ¿Eliminarlos?"))return;
  aBorrar.forEach(function(k){DB.ref("cob/"+k).remove();});
  setTimeout(rCob,700);
  alert("Listo. Se eliminaron "+aBorrar.length+" cobro(s) duplicado(s).");
}
function genCob(){
  var iqA=oA(DATA.iq).filter(function(i){return i.estado==="activo";});
  // Unidades que ya tienen cobro de ALQUILER este mes (los extras como Gastos de gestion NO bloquean)
  var ya=oA(DATA.cob).filter(function(c){return c.mes===_cobMes&&esCobroAlq(c);}).map(function(c){return c.unidad;});
  // También excluir por id_ac cuando el acuerdo ya tiene su alquiler generado este mes
  var yaIdAc=oA(DATA.cob).filter(function(c){return c.mes===_cobMes&&esCobroAlq(c);}).map(function(c){return c.id_ac;});
  var ns=iqA.filter(function(i){return !ya.includes(i.unidad)&&!yaIdAc.includes(i.id_ac);});
  if(!ns.length){alert("Todas las unidades activas ya tienen cobranza este mes");return;}
  // NUEVO: elegir si se generan todas las cobranzas o solo una unidad (ej: pago adelantado)
  var o="<p style='color:#94A3B8;font-size:12px;margin-bottom:10px'>Mes: <b>"+_cobMes+"</b>. Podés generar todas las cobranzas pendientes o solo la de una unidad (por ejemplo, un pago adelantado).</p>";
  o+="<div class='fld'><label class='lbl'>Unidad</label><select class='inp' id='gc-u'><option value=''>Todas las pendientes ("+ns.length+")</option>"+ns.sort(function(a,b){return(a.unidad||"").localeCompare(b.unidad||"");}).map(function(i){return "<option value='"+esc(i.unidad)+"'>"+esc(i.unidad)+" — "+esc(i.nombre||"")+"</option>";}).join("")+"</select></div>";
  o+="<div style='display:flex;justify-content:flex-end;gap:7px;margin-top:12px'><button class='btn bg bsm' onclick='closeModal()'>Cancelar</button><button class='btn bok bsm' onclick='_genCobExec()'>Generar</button></div>";
  openModal("Generar cobranzas "+_cobMes,o);

function _genCobExec(){
  var sel=(G("gc-u")||{value:""}).value;
  closeModal();
  var iqA=oA(DATA.iq).filter(function(i){return i.estado==="activo";});
  var ya=oA(DATA.cob).filter(function(c){return c.mes===_cobMes&&esCobroAlq(c);}).map(function(c){return c.unidad;});
  var yaIdAc=oA(DATA.cob).filter(function(c){return c.mes===_cobMes&&esCobroAlq(c);}).map(function(c){return c.id_ac;});
  var ns=iqA.filter(function(i){return !ya.includes(i.unidad)&&!yaIdAc.includes(i.id_ac);});
  if(sel) ns=ns.filter(function(i){return i.unidad===sel;});
  if(!ns.length){alert("Nada para generar");return;}
  var yr=parseInt(_cobMes.split("-")[0]),mo=parseInt(_cobMes.split("-")[1]);
  var mPrev=mo===1?(yr-1)+"-12":yr+"-"+String(mo-1).padStart(2,"0");
  var cobP=oA(DATA.cob).filter(function(c){return c.mes===mPrev;});
  ns.forEach(function(i){
    // Solo arrastrar saldo si el cobro anterior pertenece al MISMO acuerdo (mismo inquilino)
    var prev=cobP.filter(function(c){return c.unidad===i.unidad&&c.id_ac===i.id_ac;})[0];
    var sal=0;if(prev){var pg=pT(prev),tot=prev.monto_total+Number(prev.sal_ant||0);sal=Math.round(tot-pg);} // puede ser negativo (a favor)
    var esUSD=i.moneda==="USD"&&Number(i.alquiler_usd||0)>0;
    if(esUSD){
      // Cobro en dolares: monto_total en USD, moneda="USD"
      DB.ref("cob").push({id_ac:i.id_ac||"",unidad:i.unidad,inq:i.nombre,mes:_cobMes,
        monto_total:Number(i.alquiler_usd),moneda:"USD",pagos:{},sal_ant:sal,
        estado:sal>0?"parcial":"pendiente",concepto:"Alquiler USD"});
    } else {
      var extra=aplicarAdicionales(i.unidad,i.alquiler,_cobMes);
      var totalMes=i.alquiler+extra;
      var concepto=extra>0?"Alquiler + adicionales ("+fmt(extra)+" extra)":"";
      // Acuerdo semanal: el mes vale (cantidad de dias de pago del mes) x monto semanal
      if(i.frecuencia==="semanal"&&Number(i.alq_semanal||0)>0){
        var fsm=diasPagoMes(_cobMes,(i.dia_sem!=null?Number(i.dia_sem):3));
        totalMes=fsm.length*Number(i.alq_semanal)+extra;
        concepto="Alquiler semanal ("+fsm.length+" x "+fmt(Number(i.alq_semanal))+")"+(extra>0?" + adicionales":"");
      }
      DB.ref("cob").push({id_ac:i.id_ac||"",unidad:i.unidad,inq:i.nombre,mes:_cobMes,monto_total:totalMes,pagos:{},sal_ant:sal,estado:sal>0?"parcial":"pendiente",concepto_extra:concepto});
    }
  });
  setTimeout(rCob,600);
}

// ── ARRASTRE DINAMICO (+Ant) ─────────────────────────────────────────────────
// El arrastre de cada mes se recalcula siempre desde el saldo REAL del mes anterior.
// Puede ser negativo (pago de mas = queda a favor y descuenta el mes siguiente).
// Cadena: cobros mensuales de alquiler del mismo acuerdo y misma moneda,
// ordenados por mes. El mes mas viejo conserva su Ant historico.
function esCobroAlq(c){
  var con=String(c.concepto||"").trim();
  if(con==="Alquiler"||con==="Alquiler USD")return true;
  if(con==="Cambio de depto - diferencia")return true; // forma parte de la cuenta corriente del inquilino: su saldo arrastra
  if(!con)return true; // generados mensualmente (llevan concepto_extra o nada)
  return false;
}
function calcCambiosSalAnt(id_ac){
  var out=[];
  if(!id_ac)return out;
  var chainAll=oA(DATA.cob).filter(function(c){return c.id_ac===id_ac&&c.mes&&esCobroAlq(c);});
  ["ARS","USD"].forEach(function(mon){
    var chain=chainAll.filter(function(c){return (c.moneda==="USD"?"USD":"ARS")===mon;})
      .sort(function(a,b){return (a.mes||"").localeCompare(b.mes||"")||a._key.localeCompare(b._key);});
    var vistos={},carry=0,first=true;
    chain.forEach(function(c){
      if(vistos[c.mes])return; // duplicados: usar la herramienta de duplicados de Limpieza
      vistos[c.mes]=1;
      var ant=first?Number(c.sal_ant||0):Math.round(carry);
      first=false;
      var pg=pT(c),tot=Number(c.monto_total||0)+ant;
      var estado=pg>=tot?"pagado":(pg>0||ant>0)?"parcial":"pendiente";
      if(Number(c.sal_ant||0)!==ant||c.estado!==estado){
        out.push({key:c._key,unidad:c.unidad,inq:c.inq,mes:c.mes,antViejo:Number(c.sal_ant||0),antNuevo:ant,estViejo:c.estado,estNuevo:estado});
      }
      carry=tot-pg;
    });
  });
  return out;
}
function recalcSalAnt(id_ac){
  if(!USER||USER.r==="lector")return 0;
  var cs=calcCambiosSalAnt(id_ac);
  cs.forEach(function(x){DB.ref("cob/"+x.key).update({sal_ant:x.antNuevo,estado:x.estNuevo});});
  return cs.length;
}
function recalcTodosPreview(){

  var all=[];Object.keys(ids).forEach(function(id){all=all.concat(calcCambiosSalAnt(id));});
  if(!all.length){alert("Todos los arrastres (+Ant) estan correctos ✓");return;}
  var o="<p style='color:#94A3B8;font-size:12px;margin-bottom:8px'>"+all.length+" cobro(s) con arrastre desactualizado. Revisá y aplicá:</p><div style='max-height:320px;overflow:auto'>";
  all.sort(function(a,b){return (a.unidad||"").localeCompare(b.unidad||"")||(a.mes||"").localeCompare(b.mes||"");}).forEach(function(x){
    o+="<div style='font-size:11px;padding:4px 0;border-bottom:1px solid #1E293B'><b>"+esc(x.unidad||"")+"</b> "+esc(x.inq||"")+" · "+x.mes+" — Ant: "+fmt(x.antViejo)+" → <b style='color:"+(x.antNuevo<0?"#10B981":"#F59E0B")+"'>"+fmt(x.antNuevo)+"</b>"+(x.estViejo!==x.estNuevo?" · estado: "+x.estViejo+" → <b>"+x.estNuevo+"</b>":"")+"</div>";
  });
  o+="</div><div style='display:flex;justify-content:flex-end;gap:7px;margin-top:12px'><button class='btn bg bsm' onclick='closeModal()'>Cancelar</button><button class='btn bok bsm' onclick='_recalcTodosExec()'>Aplicar todo</button></div>";

function _mvPagoExec(spec){
  var pp=spec.split("|"),ck=pp[0],pk=pp[1];
  var dest=(G("mvp-dest")||{value:""}).value;if(!dest)return;
  var c=DATA.cob[ck],d=DATA.cob[dest];if(!c||!d||!c.pagos||!c.pagos[pk])return;
  var p=c.pagos[pk];
  var pagosC=Object.assign({},c.pagos);delete pagosC[pk];
  var pagosD=Object.assign({},d.pagos||{});pagosD[pk]=p;
  function estOf(cob,pagos){
    var esU=cob.moneda==="USD";
    var pg=Object.values(pagos).reduce(function(s,q){return s+(esU?Number(q.usd||0):Number(q.monto||0));},0);
    var tot=Number(cob.monto_total||0)+Number(cob.sal_ant||0);
    return pg>=tot?"pagado":(pg>0||Number(cob.sal_ant||0)>0)?"parcial":"pendiente";
  }
  var ups={};
  ups["cob/"+ck+"/pagos/"+pk]=null;
  ups["cob/"+dest+"/pagos/"+pk]=p;
  ups["cob/"+ck+"/estado"]=estOf(c,pagosC);
  ups["cob/"+dest+"/estado"]=estOf(d,pagosD);
  DB.ref("/").update(ups);
  closeModal();closeModal(); // cerrar tambien la ficha, que quedo desactualizada
  var ida=c.id_ac;
  setTimeout(function(){recalcSalAnt(ida);if(typeof rCob==="function"&&SEC==="cobros")rCob();},500);
  alert("Pago de "+fmt(p.monto)+" movido de "+c.mes+" a "+d.mes+". Arrastres recalculados.");
}

    return true;
  });
  var totP=cstA.filter(function(c){return c.pagado;}).reduce(function(s,c){return s+Number(c.monto||0);},0);
  var totPend=cstA.filter(function(c){return !c.pagado;}).reduce(function(s,c){return s+Number(c.monto||0);},0);
  var sinF=cstA.filter(function(c){return !c.pagado&&!c.nro_fact&&Number(c.monto||0)>0;}).length;

function saveCosto(ckey){
  var m=fmtInputVal(G("ec-m"));
  var f=G("ec-f").value;
  var checkboxPagado=G("ec-p").checked;
  var pm=fmtInputVal(G("ec-pm")||{value:"0",dataset:{raw:"0"}});
  var pc=(G("ec-pc")||{value:"Efectivo"}).value;
  // Fecha de pago: siempre usar el campo ec-fp
  var fechaPago=G("ec-fp")?(G("ec-fp").value||hoy()):hoy();
  var c=DATA.cst[ckey];
  var pagosExist=c&&c.pagos?Object.values(c.pagos):[];
  var totalYaPagado=pagosExist.reduce(function(s,x){return s+Number(x.monto||0);},0);
  var ups={};
  ups["cst/"+ckey+"/monto"]=m;
  ups["cst/"+ckey+"/nro_fact"]=f;
  ups["cst/"+ckey+"/fec_venc"]=(G("ec-v")||{value:""}).value;
  ups["cst/"+ckey+"/cuenta"]=pc;
  ups["cst/"+ckey+"/fecha_pago"]=fechaPago;
  if(G("ec-obs")) ups["cst/"+ckey+"/obs"]=G("ec-obs").value||"";
  // Guardar asignacion (General / Edificio / Unidad)
  var asigTipo=G("ec-asig-tipo")?G("ec-asig-tipo").value:"general";
  var asigVal=G("ec-asig-val")?G("ec-asig-val").value:"";
  if(asigTipo==="edificio"&&asigVal) ups["cst/"+ckey+"/ed_pago"]=asigVal;
  else if(asigTipo==="unidad"&&asigVal) ups["cst/"+ckey+"/unidad_pago"]=asigVal;
  else ups["cst/"+ckey+"/ed_pago"]="General";
  // Registrar pago parcial si se ingreso monto
  if(pm>0){
    var ts=Date.now();
    ups["cst/"+ckey+"/pagos/"+ts]={fecha:fechaPago,monto:pm,cuenta:pc};
    totalYaPagado+=pm;
  }
  // Si checkbox marcado sin pagos previos, registrar monto total con fecha correcta
  if(checkboxPagado&&totalYaPagado===0&&m>0){
    var ts2=Date.now()+1;
    ups["cst/"+ckey+"/pagos/"+ts2]={fecha:fechaPago,monto:m,cuenta:pc};
    totalYaPagado=m;
  }
  ups["cst/"+ckey+"/pagado"]=totalYaPagado>=m||(checkboxPagado&&totalYaPagado>0);
  DB.ref("/").update(ups);
  _editC=null;setTimeout(rCostos,400);
}

function revCosto(ckey){
  var c=DATA.cst[ckey];if(!c)return;
  var pagos=c.pagos?Object.values(c.pagos):[];
  var fechaPagoUnica=c.fecha_pago;
  var fechasAfectadas=pagos.length?pagos.map(function(p){return p.fecha;}):(fechaPagoUnica?[fechaPagoUnica]:[]);
  var cajaCerrada=fechasAfectadas.find(function(f){return f&&oA(DATA.subc).filter(function(s){return s.fecha===f;}).length>0;});
  if(cajaCerrada){
    alert("La caja del "+fecDisp(cajaCerrada)+" ya fue cerrada. No se puede revertir este pago porque dejaría el monto registrado en la caja sin respaldo en Costos. Contactá al admin si hay un error real.");
    return;
  }
  if(!confirm("Revertir pago? Se borraran todos los pagos registrados."))return;
  DB.ref("cst/"+ckey).update({pagado:false,fecha_pago:null});DB.ref("cst/"+ckey+"/pagos").remove();setTimeout(rCostos,400);
}
