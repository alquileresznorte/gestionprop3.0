function rAlertas(){
  var h=new Date(),dia=h.getDate(),m=mes();
  var iqA=oA(DATA.iq).filter(function(i){return i.estado==="activo";});
  var cobA=oA(DATA.cob).filter(function(c){return c.mes===m&&!c.archivado_hist;});
  var evA=oA(DATA.ev); // agenda events
  
  // Load sent status from Firebase (compartido entre usuarios)
  var sent={}; try{sent=JSON.parse((DATA.cfg_alertas_ok||{})[m]||"{}");} catch(e){sent={}; }
  
  var grupos={mora:[],pronto:[],ajuste:[],renovacion:[],agenda:[],morosos:[],servicios:[]};
  
  var cr=getCfgRec();
  iqA.forEach(function(inq){
    var cobsU=cobA.filter(function(x){return x.unidad===inq.unidad;});
    var cobsAlq=cobsU.filter(function(x){return !x.concepto||x.concepto==="Alquiler"||x.concepto==="Alquiler USD"||(x.concepto_extra!==undefined&&!x.concepto);});
    var pg=cobsAlq.reduce(function(s,x){return s+pT(x);},0);if(!cobsAlq.length&&cobsU.length)pg=pT(cobsU[0]);
    var cobAlqRef=cobsAlq[0]||cobsU[0];
    var alq=cobAlqRef?(cobAlqRef.monto_total+Number(cobAlqRef.sal_ant||0)):inq.alquiler;
    var ok=pg>=alq,nom=inq.nombre.split(",")[0].trim();



    var descPct=cr.desc_pronto;
    var descMonto=Math.round(alq*(1-descPct/100));
    var key=inq.unidad;

    // Pronto pago dias 1-4
    if(dia>=1&&dia<=4&&!ok){
      grupos.pronto.push({key:key+"_pronto",u:inq.unidad,nom:inq.nombre,tel:inq.tel,
        msg:"Hola "+nom+"! Recordatorio alquiler "+m.replace("-","/")+". Con descuento pronto pago ("+descPct+"%, hasta dia 5): "+fmt(descMonto)+". Sin descuento: "+fmt(alq)+". Adm: 1555787641"});
    }
    // Pago tardio dia 5-9
    if(dia>=5&&dia<cr.dias_mora&&!ok){
      var recPct=cr.rec_d5;
      var recMonto=recPct>0?Math.round(alq*(1+recPct/100)):alq;
      var recTxt=recPct>0?" (recargo "+recPct+"%: "+fmt(recMonto)+")":"";
      grupos.morosos.push({key:key+"_tard",u:inq.unidad,nom:inq.nombre,tel:inq.tel,
        msg:"Hola "+nom+"! Tu alquiler de "+m.replace("-","/")+": "+fmt(alq)+" vencio el dia 5"+recTxt+". Adm: 1555787641"});
    }
    // Mora dia 10+
    if(dia>=cr.dias_mora&&!ok){
      var atraso=dia-cr.dias_mora;
      var recPct2=dia>=20?cr.rec_d20:cr.rec_d10;
      var recMonto2=Math.round(alq*(1+recPct2/100));
      grupos.mora.push({key:key+"_mora",u:inq.unidad,nom:inq.nombre,tel:inq.tel,
        msg:"Hola "+nom+". Tu alquiler de "+m.replace("-","/")+" esta en mora ("+atraso+" dia"+(atraso!==1?"s":"")+" de atraso). Total con recargo "+recPct2+"%: "+fmt(recMonto2)+". Adm: 1555787641"});
    }
    // Renovacion proximos 30 dias
    if(inq.egreso){
      var d=Math.round((new Date(inq.egreso)-h)/86400000);
      if(d>=0&&d<=30){
        grupos.renovacion.push({key:key+"_ren",u:inq.unidad,nom:inq.nombre,tel:inq.tel,
          msg:"Hola "+nom+"! Tu contrato vence el "+fecDisp(inq.egreso)+" (en "+d+" dia"+(d!==1?"s":"")+"). Contactanos para gestionar la renovacion. Adm: 1555787641"});
      }
    }
    // Ajuste cuatrimestral
    var mesN=h.getMonth()+1,diaN=h.getDate();
    var esPreAj=(mesN===3||mesN===7||mesN===11)&&diaN>=16;
    var esMesAj=(mesN===4||mesN===8||mesN===12)&&diaN<=15;
    if(esPreAj||esMesAj){
      var nv=inq.nuevo_alq||Math.round(inq.alquiler*1.12);
      var mesesAj={4:"Abril",8:"Agosto",12:"Diciembre"};
      var mesAjN=esMesAj?mesesAj[mesN]:mesesAj[mesN===3?4:mesN===7?8:12];
      grupos.ajuste.push({key:key+"_aj",u:inq.unidad,nom:inq.nombre,tel:inq.tel,
        msg:"Hola "+nom+"! Ajuste cuatrimestral "+mesAjN+": "+fmt(inq.alquiler)+" → "+fmt(nv)+". Aplica desde el dia 1. Adm: 1555787641"});
    }
  });
  
  // Alertas de servicios/costos proximos a vencer
  var cr2=getCfgRec();
  var diasAviso=cr2.dias_aviso_costo;
  var hoyDate=new Date(h.getFullYear(),h.getMonth(),h.getDate());
  oA(DATA.cst).forEach(function(c){
    if(c.pagado||!c.fec_venc) return;
    var venc=new Date(c.fec_venc+"T00:00:00");
    var diffDias=Math.round((venc-hoyDate)/86400000);
    if(diffDias>=0&&diffDias<=diasAviso){
      var label=diffDias===0?"HOY":diffDias===1?"manana":"en "+diffDias+" dias";
      grupos.servicios.push({
        key:"svc_"+c._key,
        u:c.ed||"General",
        nom:esc(c.desc||""),
        tel:"",
        msg:"Servicio a vencer "+label+": "+esc(c.desc||"")+" — "+fmt(c.monto||0)+" (vence "+fecDisp(c.fec_venc)+")"
      });
    }
    // Vencido sin pagar
    if(diffDias<0){
      grupos.servicios.push({
        key:"svc_venc_"+c._key,
        u:c.ed||"General",
        nom:esc(c.desc||"")+" ⚠ VENCIDO",
        tel:"",
        msg:"Servicio VENCIDO: "+esc(c.desc||"")+" — "+fmt(c.monto||0)+" (vencio "+fecDisp(c.fec_venc)+")"
      });
    }
  });

  // Agenda events for today and next 7 days
  var hoy7=new Date(h); hoy7.setDate(hoy7.getDate()+7);
  var hoyStr=hoy();
  var hoy7Str=hoy7.getFullYear()+"-"+String(hoy7.getMonth()+1).padStart(2,"0")+"-"+String(hoy7.getDate()).padStart(2,"0");
  evA.filter(function(ev){return ev.fecha>=hoyStr&&ev.fecha<=hoy7Str;})
    .sort(function(a,b){return a.fecha.localeCompare(b.fecha);})
    .forEach(function(ev){
      grupos.agenda.push({key:"ev_"+ev._key,u:ev.unidad||"",nom:ev.nombre||ev.titulo,tel:ev.tel||"",
        fecha:ev.fecha,tipo:ev.tipo,titulo:ev.titulo,
        msg:ev.tel?"Hola "+esc(ev.nombre||"")+"! Recordatorio: "+ev.titulo+" el "+ev.fecha+(ev.unidad?" en "+ev.unidad:"")+". Adm: 1555787641":""});
    });
  
  window._als_grupos=grupos;
  window._als_sent=sent;
  
  var total=Object.values(grupos).reduce(function(s,g){return s+g.length;},0);
  var pendientes=Object.values(grupos).reduce(function(s,g){return s+g.filter(function(a){return !sent[a.key];}).length;},0);
  
  var o="<div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px'>";
  o+="<div><h2 style='font-size:20px;font-weight:800'>Alertas</h2>";
  o+="<p style='color:#64748B;font-size:11px'>Dia "+dia+" — "+pendientes+" pendientes de "+total+" total</p></div>";
  o+="<div style='display:flex;gap:6px;flex-wrap:wrap'><button class='btn bp bsm' onclick='openEv()'>+ Recordatorio</button><button class='btn bsm' style='background:#06B6D4;color:#000' onclick='verRenovacionesMes()'>Renovaciones</button><button class='btn bg bsm' onclick='limpiarOk()'>Limpiar OK</button></div></div>";
  
  // Render each group
  var grupos_config=[
    {id:"mora",label:"Mora (dia 10+)",color:"#EF4444"},
    {id:"morosos",label:"Pago tardio (dia 5-9)",color:"#F97316"},
    {id:"pronto",label:"Pronto pago (dia 1-4)",color:"#10B981"},
    {id:"ajuste",label:"Ajuste cuatrimestral",color:"#8B5CF6"},
    {id:"renovacion",label:"Renovacion de contrato",color:"#06B6D4"},
    {id:"agenda",label:"Agenda proximos 7 dias",color:"#3B82F6"},
    {id:"servicios",label:"Servicios/costos por vencer",color:"#F59E0B"}
  ];
  
  var hayAlgo=false;
  grupos_config.forEach(function(gc){
    var lista=grupos[gc.id].filter(function(a){return !sent[a.key];});
    if(!lista.length)return;
    hayAlgo=true;
    o+="<div style='margin-bottom:14px'>";
    o+="<div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:6px'>";
    o+="<h3 style='font-size:12px;font-weight:700;color:"+gc.color+"'>"+gc.label+" ("+lista.length+")</h3>";
    o+="<button class='btn bsm bg' data-okgroup='"+gc.id+"'>✓ Marcar todas OK</button></div>";
    lista.forEach(function(a){
      var msgId="msg_"+a.key.replace(/[^a-z0-9]/gi,"_");
      o+="<div class='card' style='border-left:4px solid "+gc.color+";margin-bottom:6px;padding:10px'>";
      o+="<div style='display:flex;justify-content:space-between;align-items:flex-start;gap:8px'>";
      o+="<div style='flex:1'>";
      o+="<div style='font-size:12px;font-weight:700;margin-bottom:6px'>"+bdg(a.u,gc.color)+" "+esc(a.nom)+"</div>";
      if(a.msg){
        o+="<textarea id='"+msgId+"' style='width:100%;background:#0F172A;border:1px solid #334155;border-radius:7px;padding:8px;font-size:11px;color:#CBD5E1;line-height:1.6;min-height:70px;font-family:inherit;resize:vertical'>"+esc(a.msg)+"</textarea>";
      } else {
        o+="<div style='font-size:11px;color:#94A3B8'>"+esc(a.titulo||"")+" — "+esc(a.fecha||"")+"</div>";
      }
      o+="<div style='color:#64748B;font-size:9px;margin-top:3px'>"+(a.tel||"Sin telefono")+"</div></div>";
      o+="<div style='display:flex;flex-direction:column;gap:4px;min-width:70px'>";
      if(a.msg&&a.tel) o+="<a class='wa' style='font-size:10px;text-align:center;display:block;padding:4px 0' href='https://wa.me/"+a.tel+"?text="+encodeURIComponent(a.msg)+"' target='_blank' id='wa_"+msgId+"'>WA</a>";
      if(a.msg) o+="<button class='btn bp bsm' data-cp='"+msgId+"' style='font-size:10px'>Copiar</button>";
      o+="<button class='btn bok bsm' data-ok='"+a.key+"' style='font-size:10px'>OK ✓</button>";
      o+="</div></div></div>";
    });
    o+="</div>";
  });
  
  if(!hayAlgo) o+="<div class='card' style='text-align:center;padding:32px'><p style='color:#10B981;font-size:18px;font-weight:700'>Sin alertas pendientes</p><p style='color:#64748B;font-size:12px;margin-top:8px'>Dia "+dia+" — todo en orden</p></div>";
  
  G("main").innerHTML=o;
  G("main").onclick=function(e){
    // Copy button
    var cp=e.target.closest("[data-cp]");
    if(cp){
      var ta=G(cp.dataset.cp);
      var txt=ta?ta.value:"";
      navigator.clipboard.writeText(txt).then(function(){alert("Copiado!");});
      // Update WA link
      var wa=G("wa_"+cp.dataset.cp);
      if(wa) wa.href="https://wa.me/"+wa.href.split("wa.me/")[1].split("?")[0]+"?text="+encodeURIComponent(txt);
      return;
    }
    // OK single
    var ok=e.target.closest("[data-ok]");
    if(ok){
      sent[ok.dataset.ok]=true;
      DB.ref("cfg_alertas_ok/"+m).set(JSON.stringify(sent));
      rAlertas();return;
    }
    // OK group
    var og=e.target.closest("[data-okgroup]");
    if(og){
      var g=grupos[og.dataset.okgroup]||[];
      g.forEach(function(a){sent[a.key]=true;});
      DB.ref("cfg_alertas_ok/"+m).set(JSON.stringify(sent));
      rAlertas();return;
    }
  };
}

var _cajaMes=mes(),_cajaF=hoy(),_cajaV="dia";

// Helper: get cumulative balance for an account up to a date (inclusive)
function saldoAcumulado(cta, hastaFecha, hastaM){
  // All payments in this account up to date
  var ing=0,egr=0;
  oA(DATA.cob).forEach(function(c){
    pA(c).forEach(function(p){
      if(p.cuenta===cta&&p.fecha<=hastaFecha) ing+=p.monto;
    });
  });
  oA(DATA.aj).forEach(function(a){
    if(a.cuenta===cta&&a.fecha<=hastaFecha){
      if(a.tipo==="ingreso") ing+=Number(a.monto||0);
      else egr+=Number(a.monto||0);
    }
  });
  oA(DATA.cst).forEach(function(c){
    if(c.pagos&&Object.keys(c.pagos).length>0){
      // Pagos individuales: usar fecha real de cada pago
      Object.values(c.pagos).forEach(function(pg){
        if(pg.cuenta===cta&&pg.fecha&&pg.fecha<=hastaFecha) egr+=Number(pg.monto||0);
      });
    } else if(c.pagado&&c.cuenta===cta){
      // Sin pagos individuales: SOLO usar fecha_pago (no fec_venc como fallback)
      // Si no tiene fecha_pago, no se puede saber cuándo se pagó - no incluir
      var fp=c.fecha_pago||"";
      if(fp&&fp<=hastaFecha) egr+=Number(c.monto||0);
    }
  });
  // Subtract withdrawals, add deposits (movs)
  oA(DATA.movs).forEach(function(mv){
    if(mv.fecha<=hastaFecha){
      // Solo usar cuenta_caja explícita - NO asumir Efectivo si no está definida
      var ctaCajaDelMov=mv.cuenta_caja||"";
      if(ctaCajaDelMov&&ctaCajaDelMov===cta){
        if(mv.tipo==="retiro") egr+=Number(mv.monto||0);
        else ing+=Number(mv.monto||0);
      }
    }
  });
  return ing-egr;
}

    // Build all movements for this day
    var movimientosD=[];

    // Cobros de CUALQUIER mes que tengan pagos con fecha de hoy (adelantos, atrasos, etc.)

      pA(c).filter(function(p){return p.fecha===_cajaF;}).forEach(function(p){
        // Pago recibido FUERA DE CAJA (ej. a la cuenta personal de un tercero): salda el cobro
        // del inquilino pero NO entra a la caja del negocio.
        if(p.cuenta==="Fuera de caja")return;
        // Si el pago fue en billetera/tarjeta PERSONAL del socio (MP Loli, MP Hugo, Visa/Master),

// ── INMUTABILIDAD DE CIERRES ────────────────────────────────────────────────
// Al cerrar un mes se guarda una FOTO FIJA del informe (edificios, reparto, deuda,
// reserva). Un mes cerrado muestra esa foto y NO se recalcula nunca más, aunque
// después se edite algo de un mes anterior. Es la "regla de oro".
function snapshotInforme(m){
  var cobM=oA(DATA.cob).filter(function(c){return c.mes===m;});
  var cstFij=oA(DATA.cst).filter(function(c){return c.mes===m&&c.pagado&&c.tipo!=="eventual_caja";});
  var tcVal=Number(localStorage.getItem("gp_tc_"+m)||0);
  var occU={};cobM.forEach(function(c){if(c.unidad&&esCobroAlq(c))occU[c.unidad]=true;});
  var eds=[],util={loli:0,hugo:0,reserva:0},espAlq=0,cobAlq=0;
  Object.keys(ED).forEach(function(cod){
    var occEd=Object.keys(occU).filter(function(u){return u.indexOf(cod+"-")===0;}).length;
    var alqEd=cobM.filter(function(c){return c.unidad&&c.unidad.indexOf(cod+"-")===0&&esCobroAlq(c);});
    var rentaPot=alqEd.reduce(function(s,c){return s+(c.moneda==="USD"?Number(c.monto_total||0)*tcVal:cargoMesCobro(c));},0);
    var cobEd=alqEd.reduce(function(s,c){return s+cobradoMesPesos(c,tcVal);},0);
    var cstEd=cstFij.filter(function(c){return c.ed===cod;}).reduce(function(s,c){return s+Number(c.monto||0);},0);
    var resEd=cobEd-cstEd;
    util[ED_DUENO[cod]||"reserva"]+=resEd;
    espAlq+=rentaPot;cobAlq+=cobEd;
    eds.push({cod:cod,dueno:duenoLbl(cod),ocup:occEd+"/"+ED[cod].u,rentaPot:Math.round(rentaPot),cobrado:Math.round(cobEd),costos:Math.round(cstEd),resultado:Math.round(resEd)});
  });
  var cstGen=cstFij.filter(function(c){return !ED[c.ed];}).reduce(function(s,c){return s+Number(c.monto||0);},0);
  var scAcumCob=oA(DATA.cob).filter(function(c){return c.unidad&&c.unidad.indexOf("SC-")===0&&c.mes&&c.mes>=RESERVA_DESDE&&c.mes<=m;}).reduce(function(s,c){return s+pTpesos(c);},0);
  var scAcumCst=oA(DATA.cst).filter(function(c){return c.ed==="SC"&&c.pagado&&c.tipo!=="eventual_caja"&&c.mes&&c.mes>=RESERVA_DESDE&&c.mes<=m;}).reduce(function(s,c){return s+Number(c.monto||0);},0);
  var rot=rotacionMes(m);
  var yr=parseInt(m.split("-")[0]),mo=parseInt(m.split("-")[1]);
  var mesPrev=mo===1?(yr-1)+"-12":yr+"-"+String(mo-1).padStart(2,"0");
  var deudaVieja=0;
  oA(DATA.iq).filter(function(i){return i.estado==="activo"&&i.id_ac;}).forEach(function(i){var sp=saldoInq(i.id_ac,mesPrev).ars;if(sp>1)deudaVieja+=sp;});
  return {mes:m,ts:hoy(),edificios:eds,reparto:{loli:Math.round(util.loli),hugo:Math.round(util.hugo),reserva_mes:Math.round(util.reserva),reserva_acum:Math.round(reservaAcumSC(m))},generales:Math.round(cstGen),esperado:Math.round(espAlq),cobrado:Math.round(cobAlq),rotacion:{altas:rot.altas.length,bajas:rot.bajas.length},deuda_vieja:Math.round(deudaVieja)};
}

function cerrarMes(){
  if(!confirm("Cerrar el mes "+_cajaMes+"? Esta accion es definitiva."))return;
  // Ask for exchange rate if not set
  var tcActual=Number(localStorage.getItem("gp_tc_"+_cajaMes)||0);
  if(!tcActual){
    var tcInput=prompt("Ingresa el tipo de cambio USD promedio del mes "+_cajaMes+" (ej: 1250):");
    if(tcInput&&Number(tcInput)>0){
      localStorage.setItem("gp_tc_"+_cajaMes,tcInput);
    }
  }
  var m=_cajaMes;
  var cobM=oA(DATA.cob).filter(function(c){return c.mes===m;});
  var cstM=oA(DATA.cst).filter(function(c){return c.mes===m&&c.pagado;});
  var cstFijosCierre=cstM.filter(function(c){return c.tipo!=="eventual_caja";});
  var cstVarCierre=cstM.filter(function(c){return c.tipo==="eventual_caja";});
  var ajM=oA(DATA.aj).filter(function(a){return a.fecha&&a.fecha.startsWith(m)&&!a.auto;});
  var iM=cobM.reduce(function(s,c){return s+pTpesos(c);},0)+ajM.filter(function(a){return a.tipo==="ingreso";}).reduce(function(s,a){return s+Number(a.monto||0);},0);
  var eM=cstFijosCierre.reduce(function(s,c){return s+Number(c.monto||0);},0)+ajM.filter(function(a){return a.tipo==="egreso";}).reduce(function(s,a){return s+Number(a.monto||0);},0);
  var eMVar=cstVarCierre.reduce(function(s,c){return s+Number(c.monto||0);},0);
  var tc=Number(localStorage.getItem("gp_tc_"+m)||0);
  // Save saldos por cuenta at month end

function saveSubc(sendWA){
  var saldos={},ups={};
  CTAS.forEach(function(cta){
    var sistema=saldoAcumulado(cta,_cajaF,_cajaMes);
    var inp=G("sc-"+cta.replace(/ /g,"-"));
    var real=inp&&inp.value.trim()?Number(inp.value):sistema; // if empty, no difference
    var dif=real-sistema;
    saldos[cta]={sistema:sistema,real:real,dif:dif};
    // Register difference as adjustment only if non-zero
    if(dif!==0){
      var nk=DB.ref("aj").push().key;
      ups["aj/"+nk]={fecha:_cajaF,tipo:dif>0?"ingreso":"egreso",sub:"Diferencia de caja",
        cuenta:cta,concepto:"Diferencia subcierre "+_cajaF,monto:Math.abs(dif),auto:true};
    }
  });
  var sk=DB.ref("subc").push().key;
  ups["subc/"+sk]={fecha:_cajaF,cerradoPor:USER.n,saldos:saldos};
  DB.ref("/").update(ups);
  closeModal();
  if(sendWA){
    // Build WA summary message
    var msg="Cierre de caja "+_cajaF+"\n";
    msg+="Sistema | Real | Diferencia\n";
    Object.entries(saldos).forEach(function(e){
      var s=e[1];
      msg+=e[0]+": "+fmt(s.sistema)+" | "+fmt(s.real)+(s.dif!==0?" | "+(s.dif>0?"+":"")+fmt(s.dif):"")+"\n";
    });
    msg+="\nCerrado por: "+USER.n;
    var waUrl="https://wa.me/?text="+encodeURIComponent(msg);
    window.open(waUrl,"_blank");
  } else {
    alert("Cierre registrado para "+_cajaF+".");
  }
  setTimeout(rCaja,300);
}

var _respFoto=null;
function compressImgResp(file,cb){
  var reader=new FileReader();
  reader.onload=function(e){var img=new Image();img.onload=function(){
    var MAX=700,scale=Math.min(1,MAX/Math.max(img.width,img.height));
    var c=document.createElement("canvas");c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",0.55));
  };img.src=e.target.result;};
  reader.readAsDataURL(file);
}
function onRespFoto(inp){

var _cfgTab = "propiedades"; // propiedades | costos | ingresos

function rConfig(){
  if(USER.r!=="admin"){G("main").innerHTML="<p style='color:#EF4444;padding:20px'>Solo el administrador puede acceder.</p>";return;}

  var tabs = [["propiedades","Propiedades"],["costos","Costos"],["ingresos","Ingresos extras"],["categorias","Categorias"],["usuarios","Usuarios"],["recargos","% Recargos"],["acuerdo","📄 Acuerdo"],["respaldo","💾 Respaldo"],["limpieza","🗑 Limpieza"]];
  var o = "<h2 style='font-size:20px;font-weight:800;margin-bottom:12px'>Configuracion</h2>";
  o += "<div style='display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap'>";
  tabs.forEach(function(t){
    var cls="btn bsm "+(_cfgTab===t[0]?"bp":"bg");
    var btn=document.createElement("button");
    btn.className=cls;
    btn.textContent=t[1];
    btn.dataset.tab=t[0];
    o += "<button class='"+cls+"' data-cfgtab='"+t[0]+"'>"+t[1]+"</button>";
  });
  o += "</div><div id='cfg-body'></div>";
  G("main").innerHTML = o;
  G("main").addEventListener("click",function(e){var b=e.target.closest("[data-cfgtab]");if(b){_cfgTab=b.dataset.cfgtab;rConfig();}},true);

  if(_cfgTab==="propiedades") renderCfgProp();
  else if(_cfgTab==="costos") renderCfgCostos();
  else if(_cfgTab==="ingresos") renderCfgIngresos();
  else if(_cfgTab==="categorias") renderCfgCats();
  else if(_cfgTab==="recargos") renderCfgRecargos();
  else if(_cfgTab==="acuerdo") renderCfgAcuerdo();
  else if(_cfgTab==="respaldo") renderCfgRespaldo();
  else if(_cfgTab==="limpieza") renderCfgLimpieza();
  else if(_cfgTab==="usuarios") renderCfgUsuarios();
}
function _ultimoRespaldo(){ return localStorage.getItem("gp_ultimo_respaldo")||""; }
function descargarRespaldo(){
  try{
    var snap={};
    ["iq","hist","cob","cst","aj","subc","cierres","movs","cfg","fin_movs","fin_usd","aho"].forEach(function(n){ if(DATA[n])snap[n]=DATA[n]; });
    var blob=new Blob([JSON.stringify(snap)],{type:"application/json"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url; a.download="AdminUdo-respaldo-"+hoy()+".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    localStorage.setItem("gp_ultimo_respaldo",hoy());
    setTimeout(renderCfgRespaldo,300);
  }catch(e){ alert("Error al generar el respaldo: "+e.message); }
}
function renderCfgRespaldo(){
  var el=G("cfg-body"); if(!el) return;
  var ult=_ultimoRespaldo();
  var diasDesde=ult?Math.floor((new Date(hoy())-new Date(ult))/86400000):999;
  var alerta=(!ult||diasDesde>=7);
  var o="<div class='card'>";
  o+="<h3 style='font-size:14px;font-weight:700;margin-bottom:6px'>💾 Copia de seguridad</h3>";
  o+="<p style='color:#94A3B8;font-size:12px;margin-bottom:10px'>Descargá una copia completa de todos tus datos (inquilinos, cobros, costos, caja, cierres). Guardala en tu compu o Drive. Si algo se edita mal, con esta copia se puede recuperar todo.</p>";
  if(ult){
    o+="<div style='background:"+(alerta?"#F59E0B22":"#10B98122")+";border:1px solid "+(alerta?"#F59E0B55":"#10B98155")+";border-radius:8px;padding:10px;margin-bottom:10px;font-size:12px'>";
    o+="Último respaldo: <b>"+fecDisp(ult)+"</b> (hace "+diasDesde+" día"+(diasDesde===1?"":"s")+"). ";
    o+=alerta?"<span style='color:#F59E0B'>⚠ Pasó una semana o más — conviene hacer uno nuevo.</span>":"<span style='color:#10B981'>✓ Al día.</span>";
    o+="</div>";
  } else {
    o+="<div style='background:#F59E0B22;border:1px solid #F59E0B55;border-radius:8px;padding:10px;margin-bottom:10px;font-size:12px;color:#F59E0B'>⚠ Todavía no hiciste ningún respaldo. Hacé el primero ahora.</div>";
  }
  o+="<button class='btn bp' onclick='descargarRespaldo()'>⬇ Descargar respaldo ahora</button>";
  o+="<p style='color:#64748B;font-size:11px;margin-top:10px'><b>Rutina recomendada:</b> hacé un respaldo <b>todos los lunes</b> (o cada vez que cierres un mes). AdminUdo te avisa acá cuando pasó una semana.</p>";
  o+="</div>";
  el.innerHTML=o;
}

function saveRecatMasivo(catOrigen){
  var dest=G("recat-dest")?G("recat-dest").value:"";

  if(!confirm("¿Cambiar todos los registros de '"+catOrigen+"' a '"+dest+"'? No se puede deshacer."))return;
  var ups={};
  // Costos del mes actual e históricos
  oA(DATA.cst).filter(function(c){return c.cat===catOrigen;}).forEach(function(c){ups["cst/"+c._key+"/cat"]=dest;});
  // Costos en cfg (costos fijos extra)
  oA(DATA.cfg).filter(function(c){return c.cat===catOrigen;}).forEach(function(c){ups["cfg/"+c._key+"/cat"]=dest;});
  if(Object.keys(ups).length===0){alert("No hay registros con esa categoría");closeModal();return;}
  DB.ref("/").update(ups,function(){
    closeModal();
    alert("✅ "+Object.keys(ups).length+" registros recategorizados a '"+dest+"'.");
    setTimeout(rConfig,300);
  });
}

// ── AJUSTE CUATRIMESTRAL (Abril, Agosto, Diciembre) ──────────────────────────
function openAjusteCuat(){
  var iqA=oA(DATA.iq).filter(function(i){return i.estado==="activo";});
  if(!iqA.length){alert("No hay acuerdos activos");return;}
  var hoy_mes=new Date().getMonth()+1;
  var prox=hoy_mes<4?"Abril":hoy_mes<8?"Agosto":hoy_mes<12?"Diciembre":"Abril";
  // Historial: ultimos 3 meses (incluye el actual), tomados de las cobranzas de alquiler
  var mesesAj=(function(){
    var d=new Date(),yr=d.getFullYear(),mo=d.getMonth()+1,out=[];
    for(var k=0;k<3;k++){out.unshift(yr+"-"+String(mo).padStart(2,"0"));mo--;if(mo<1){yr--;mo=12;}}
    return out; // ascendente: mas viejo a la izquierda
  })();
  var MN={"01":"Ene","02":"Feb","03":"Mar","04":"Abr","05":"May","06":"Jun","07":"Jul","08":"Ago","09":"Sep","10":"Oct","11":"Nov","12":"Dic"};
  var cobAll=oA(DATA.cob);
  var _alqDe=function(u,m){
    return cobAll.filter(function(c){
      return c.unidad===u&&c.mes===m&&(!c.concepto||String(c.concepto).indexOf("Alquiler")===0);
    })[0]||null;
  };
  var o="<p style='color:#94A3B8;font-size:12px;margin-bottom:4px'>Ajuste cuatrimestral (<b style='color:#8B5CF6'>"+prox+"</b>) — modificacion discrecional por inquilino.</p>";
  o+="<p style='color:#64748B;font-size:11px;margin-bottom:4px'>Ingresa el nuevo valor para cada uno. Deja igual los que no cambian. El sistema enviara alertas WA 15 dias antes desde la seccion Alertas.</p>";
  o+="<p style='color:#F59E0B;font-size:10px;margin-bottom:10px'>Valores en <b>naranja</b> = eran de otro inquilino (cambio de inquilino desde ese ajuste).</p>";
  o+="<div style='overflow-x:auto'><table class='tbl'><thead><tr><th>Unidad</th><th>Inquilino</th>";
  mesesAj.forEach(function(m){o+="<th style='color:#64748B'>"+(MN[m.slice(5,7)]||m.slice(5,7))+" "+m.slice(0,4)+"</th>";});
  o+="<th>Alquiler actual</th><th>Nuevo valor $ (editable)</th><th>Diferencia</th></tr></thead><tbody id='aj-tbody'></tbody></table></div>";
  o+="<div style='display:flex;gap:8px;margin:10px 0;flex-wrap:wrap'>";
  o+="<div class='fld' style='margin:0;flex:1'><label class='lbl'>Aplicar % a todos</label><div style='display:flex;gap:5px'><input class='inp' type='number' id='aj-pct' placeholder='ej: 15' style='max-width:90px'/><button class='btn bg bsm' onclick='aplicarPct()'>Aplicar %</button></div></div>";
  o+="</div>";
  o+="<div style='display:flex;justify-content:flex-end;gap:7px;margin-top:12px'><button class='btn bg bsm' onclick='closeModal()'>Cancelar</button><button class='btn bok bsm' onclick='saveAjusteCuat()'>Guardar Ajuste</button></div>";
  openModal("Ajuste Cuatrimestral",o,true);
  // Populate table
  setTimeout(function(){
    var tbody=G("aj-tbody"); if(!tbody) return;
    iqA.sort(function(a,b){return a.unidad.localeCompare(b.unidad);}).forEach(function(i){
      var histTd="";
      mesesAj.forEach(function(m){
        var c=_alqDe(i.unidad,m);
        if(!c){histTd+="<td style='color:#475569;font-size:11px'>--</td>";return;}
        var otro=(c.id_ac&&i.id_ac&&c.id_ac!==i.id_ac)||(!c.id_ac&&c.inq&&c.inq!==i.nombre);
        var esU=c.moneda==="USD";
        var val=esU?("U$S "+Number(c.monto_total||0).toLocaleString()):fmt(Number(c.monto_total||0));
        histTd+="<td style='font-size:11px;color:"+(otro?"#F59E0B":"#94A3B8")+"'"+(otro?" title='Otro inquilino: "+esc(c.inq||"")+"'":"")+">"+val+(otro?"<div style='font-size:9px;color:#F59E0B'>"+esc((c.inq||"").split(",")[0])+"</div>":"")+"</td>";
      });
      var tr=document.createElement("tr");
      tr.innerHTML="<td style='font-weight:600'>"+i.unidad+"</td><td style='font-size:11px'>"+esc(i.nombre.split(",")[0])+"</td>"+histTd+"<td style='color:#10B981'>"+fmt(i.alquiler)+"</td><td><input class='inp' type='number' id='ajv-"+i._key+"' value='"+i.alquiler+"' style='padding:4px 8px;font-size:12px'/></td><td id='ajd-"+i._key+"' style='color:#94A3B8;font-size:11px'>--</td>";
      tbody.appendChild(tr);
      G("ajv-"+i._key).oninput=function(){
        var nuevo=Number(this.value||0);
        var dif=nuevo-i.alquiler;
        var pct=i.alquiler>0?Math.round((dif/i.alquiler)*100):0;
        var el=G("ajd-"+i._key);
        if(el)el.innerHTML="<span style='color:"+(dif>0?"#10B981":dif<0?"#EF4444":"#64748B")+"'>"+(dif>0?"+":"")+fmt(dif)+" ("+pct+"%)</span>";
      };
    });
    window._iqAjuste=iqA;
  },50);
}
window.aplicarPct=function(){
  var pct=fmtInputVal(G("aj-pct")); if(!pct) return;
  (window._iqAjuste||[]).forEach(function(i){
    var inp=G("ajv-"+i._key); if(!inp) return;
    var nuevo=Math.round(i.alquiler*(1+pct/100));
    inp.value=nuevo;
    inp.dispatchEvent(new Event("input"));
  });
};
function saveAjusteCuat(){
  var iqA=oA(DATA.iq).filter(function(i){return i.estado==="activo";});
  var cambios=0;
  iqA.forEach(function(i){
    var inp=G("ajv-"+i._key); if(!inp) return;
    var nuevo=Number(inp.value||0);
    if(nuevo>0&&nuevo!==i.alquiler){

      DB.ref("aj_hist").push({fecha:hoy(),mes:mes(),unidad:i.unidad,id_ac:i.id_ac||"",inq:i.nombre||"",anterior:i.alquiler,nuevo:nuevo});

      cambios++;

}

function guardarClave(usuario){
  var nueva=G("cp-nueva").value;
  var conf=G("cp-conf").value;
  if(!nueva){alert("La nueva clave es obligatoria");return;}
  if(nueva.length<4){alert("La clave debe tener al menos 4 caracteres");return;}
  if(nueva!==conf){alert("Las claves no coinciden");return;}
  var u=USUARIOS.filter(function(x){return x.u===usuario;})[0];
  if(!u){alert("Usuario no encontrado");return;}
  u.p=nueva;
  // Save to Firebase so all devices get the update
  DB.ref("usuarios/"+usuario).set({clave:nueva});
  // Clear saved session for this user so they need to re-login
  var saved=JSON.parse(localStorage.getItem("gp_rem")||"null");
  if(saved&&saved.u===usuario){localStorage.removeItem("gp_rem");}
  closeModal();
  alert("Clave de "+u.n+" actualizada a: "+nueva+". Avisa al empleado que borre el icono y vuelva a instalar la app.");

}

function saveCambiarDepto(key){
  var i=DATA.iq[key]; if(!i) return;
  var nuevaUnidad=(G("cd-u")||{value:""}).value;
  var nuevoAlq=fmtInputVal(G("cd-alq")||{value:"0",dataset:{raw:"0"}});
  var dif=fmtInputVal(G("cd-dif")||{value:"0",dataset:{raw:"0"}});
  var fechaDif=(G("cd-fecha")||{value:hoy()}).value||hoy();
  var obs=(G("cd-obs")||{value:""}).value.trim();
  if(!nuevaUnidad){alert("Elegí el nuevo depto");return;}
  if(!nuevoAlq){alert("El nuevo alquiler es obligatorio");return;}
  var ocupado=oA(DATA.iq).filter(function(x){return x.unidad===nuevaUnidad&&x.estado==="activo"&&x._key!==key;}).length>0;
  if(ocupado){alert("El depto "+nuevaUnidad+" ya tiene un contrato activo.");return;}
  var unidadVieja=i.unidad;
  var alqViejo=i.alquiler;
  var deptoHist=Array.isArray(i.historial_deptos)?i.historial_deptos.slice():[];
  deptoHist.push(unidadVieja+" (hasta "+hoy()+")");
  DB.ref("iq/"+key).update({unidad:nuevaUnidad,alquiler:nuevoAlq,historial_deptos:deptoHist},function(err){
    if(err){alert("Error al mover: "+err.message);return;}
    // Registrar el evento en el historial del inquilino
    DB.ref("cfg").push({
      tipo:"evento_iq",id_ac:i.id_ac,unidad:nuevaUnidad,
      texto:"Cambio de depto: "+unidadVieja+" ("+fmt(alqViejo)+") \u2192 "+nuevaUnidad+" ("+fmt(nuevoAlq)+")"+(dif>0?". Diferencia a cobrar: "+fmt(dif):"")+(obs?". "+obs:""),
      fecha:hoy(),usuario:USER.n,fecha_ts:Date.now()
    });
    // Cobro pendiente de la diferencia, si corresponde
    if(dif>0){
      DB.ref("cob").push({
        id_ac:i.id_ac||"",unidad:nuevaUnidad,inq:i.nombre,
        mes:fechaDif.slice(0,7),monto_total:dif,sal_ant:0,estado:"pendiente",pagos:{},
        concepto:"Cambio de depto - diferencia"
      });
    }
    // Generar el ALQUILER del mes en el depto nuevo (si se pidió y no existe ya)
    var genAlq=(G("cd-genalq")||{checked:false}).checked;
    var alqMes=(G("cd-alqmes")||{value:mes()}).value||mes();
    var msgAlq="";
    if(genAlq){
      var yaAlq=oA(DATA.cob).filter(function(c){return c.id_ac===i.id_ac&&c.mes===alqMes&&esCobroAlq(c);}).length>0;
      if(yaAlq){
        msgAlq=" El alquiler de "+alqMes+" ya estaba generado (no se duplicó).";
      } else {
        DB.ref("cob").push({
          id_ac:i.id_ac||"",unidad:nuevaUnidad,inq:i.nombre,
          mes:alqMes,monto_total:nuevoAlq,sal_ant:0,estado:"pendiente",pagos:{},
          concepto:"Alquiler"
        });
        msgAlq=" Alquiler de "+alqMes+" ("+fmt(nuevoAlq)+") generado como pendiente.";
      }
    }
    closeModal();closeModal();
    alert("Listo. "+esc(i.nombre)+" se movió de "+unidadVieja+" a "+nuevaUnidad+". "+unidadVieja+" quedó libre."+(dif>0?" Diferencia de "+fmt(dif)+" cargada como cobro pendiente.":"")+msgAlq);
    setTimeout(function(){go("acuerdos");},300);
  });
}

function saveAdicional(key){
  var i=DATA.iq[key];
  var con=G("adl-con").value; if(!con){alert("El concepto es obligatorio");return;}
  var tipo=G("adl-tipo").value;
  var val=fmtInputVal(G("adl-val")); if(!val){alert("El valor es obligatorio");return;}
  var monto=tipo==="pct"?Math.round(i.alquiler*(val/100)):val;
  var desde=G("adl-desde").value||mes();
  var hasta=G("adl-hasta").value||"";
  DB.ref("cfg").push({
    tipo:"adicional_iq",unidad:i.unidad,id_ac:i.id_ac||"",
    concepto:con,tipo_calculo:tipo,valor:val,monto:monto,
    desde:desde,hasta:hasta,activo:true,fecha_alta:hoy()
  });
  // If current month is in range, add to cobranza
  var m=mes();
  if(m>=desde&&(!hasta||m<=hasta)){
    var cobActual=oA(DATA.cob).filter(function(c){return c.mes===m&&c.unidad===i.unidad;})[0];
    if(cobActual){
      DB.ref("cob/"+cobActual._key+"/monto_total").set(cobActual.monto_total+monto);
    }
  }
  closeModal();closeModal();
  alert("Adicional registrado: "+fmt(monto)+"/mes por "+con+(tipo==="pct"?" ("+val+"% del alquiler)":"")+(hasta?" hasta "+hasta:"")+". Aplica desde "+desde+".");
}
function quitarAdicional(key){
  if(!confirm("Quitar este adicional?"))return;
  DB.ref("cfg/"+key).update({activo:false,fecha_baja:hoy()});
  closeModal();
  setTimeout(function(){go("acuerdos");},300);
}

// Apply additionals when generating cobranzas
function aplicarAdicionales(unidad, montoBase, mesC){
  var m=mesC||mes();
  var adicionales=oA(DATA.cfg).filter(function(x){
    return x.tipo==="adicional_iq"&&x.unidad===unidad&&x.activo!==false&&
      m>=x.desde&&(!x.hasta||m<=x.hasta);
  });
  var extra=adicionales.reduce(function(s,a){return s+a.monto;},0);
  return extra;
}

function deletePago(ckey,pagoKey){
  var c=DATA.cob[ckey]; if(!c) return;
  var pago=(c.pagos||{})[pagoKey];
  if(pago&&pago.fecha){
    var subcCheck=oA(DATA.subc).filter(function(s){return s.fecha===pago.fecha;});
    if(subcCheck.length>0){
      alert("La caja del "+fecDisp(pago.fecha)+" ya fue cerrada por "+esc(subcCheck[0].cerradoPor||"")+". No se puede borrar este pago porque dejaría el monto registrado en la caja sin respaldo en Cobros. Si hay un error, contactá al admin para revertirlo desde Config.");
      return;
    }
    // Pagos de dias anteriores: la caja de ese dia ya conto esa plata.
    // Borrarlos la descuadra retroactivamente, asi que no se permite.
    if(pago.fecha!==hoy()){
      if(!USER||USER.r!=="admin"){
        alert("Este pago es del "+fecDisp(pago.fecha)+". Los pagos de dias anteriores no se pueden borrar: la caja de ese dia ya los conto y quedaria descuadrada.\n\n• Si esta imputado al mes equivocado: usa 🔀 mes en la ficha (mueve el pago sin tocar la caja).\n• Si el monto esta mal o el pago no existio: pedile al admin que lo revise.");
        return;
      }
      var conf=prompt("⚠ SOLO ADMIN — Este pago es del "+fecDisp(pago.fecha)+" por "+fmt(pago.monto)+".\nBorrarlo modifica la caja de ese dia retroactivamente.\n\nSi solo esta en el mes equivocado, cancela y usa 🔀 mes (no descuadra nada).\n\nPara borrar igual, escribi BORRAR:");
      if(conf===null)return;
      if(String(conf).trim().toUpperCase()!=="BORRAR"){alert("No se borro nada.");return;}
    }
  }
  var ups={};
  ups["cob/"+ckey+"/pagos/"+pagoKey]=null;
  // Recalculate state
  var pagosRestantes=Object.assign({},c.pagos||{});
  delete pagosRestantes[pagoKey];
  var tot=c.monto_total+Number(c.sal_ant||0);
  var pg=Object.values(pagosRestantes).reduce(function(s,p){return s+p.monto;},0);
  ups["cob/"+ckey+"/estado"]=pg>=tot?"pagado":pg>0?"parcial":"pendiente";
  DB.ref("/").update(ups);
  closeModal();
  alert("Pago eliminado.");
  var ida=c.id_ac;
  setTimeout(function(){recalcSalAnt(ida);rCob();},400);
}

function enviarCajaWA(){
  // Build message like the Excel sheet
  var m=_cajaMes;
  var cobM2=oA(DATA.cob).filter(function(c){return c.mes===m;});
  var cstM2=oA(DATA.cst).filter(function(c){return c.mes===m&&c.pagado;});
  var ajM2=oA(DATA.aj).filter(function(a){return a.fecha&&a.fecha.startsWith(m)&&!a.auto;});

  var lines=["Caja del dia "+_cajaF];
  var totIng=0,totEgr=0;

  cobM2.forEach(function(c){
    pA(c).filter(function(p){return p.fecha===_cajaF;}).forEach(function(p){
      lines.push((c.unidad||"")+" "+c.inq.split(",")[0]+": +"+fmt(p.monto)+" ("+p.cuenta+")");
      totIng+=p.monto;
    });
  });
  cstM2.filter(function(c){return c.fec_venc===_cajaF;}).forEach(function(c){
    lines.push(c.desc+": -"+fmt(c.monto)+" ("+c.cuenta+")");
    totEgr+=Number(c.monto||0);
  });
  ajM2.filter(function(a){return a.fecha===_cajaF;}).forEach(function(a){
    lines.push(a.concepto+": "+(a.tipo==="ingreso"?"+":"-")+fmt(a.monto)+" ("+a.cuenta+")");
    if(a.tipo==="ingreso") totIng+=Number(a.monto||0);
    else totEgr+=Number(a.monto||0);
  });

  lines.push("─────────────────");
  lines.push("Total ingresado: "+fmt(totIng));
  lines.push("Total egresado: -"+fmt(totEgr));
  lines.push("Resultado del dia: "+fmt(totIng-totEgr));

  var msg=lines.join("\n");
  if(!lines.length||lines.length===1){alert("No hay movimientos en este dia.");return;}
  var url="https://wa.me/?text="+encodeURIComponent(msg);
  var a=document.createElement("a");a.href=url;a.target="_blank";a.click();
}

function fusionarUnidadDuplicada(idx){
  var info=kget(idx); if(!info)return;
  var u=info.unidad,keepKey=info.keepKey;
  var keep=DATA.iq[keepKey]; if(!keep){alert("No encontrado");return;}
  var grupo=oA(DATA.iq).filter(function(x){return x.unidad===u&&x.estado==="activo";});
  var descartar=grupo.filter(function(x){return x._key!==keepKey;});
  if(!descartar.length){alert("No hay duplicados para fusionar en esta unidad.");return;}

  // Verificar que ninguno de los que se van a descartar tenga pagos reales
  var conPagos=[];
  descartar.forEach(function(d){
    var cobsD=oA(DATA.cob).filter(function(c){return c.id_ac===d.id_ac;});
    var totalPagado=cobsD.reduce(function(s,c){return s+pT(c);},0);
    if(totalPagado>0) conPagos.push({nombre:d.nombre,id_ac:d.id_ac,total:totalPagado});
  });
  if(conPagos.length){
    var msg="⚠ No se puede fusionar automáticamente: el/los otro(s) registro(s) tienen pagos reales:\n";
    conPagos.forEach(function(cp){msg+="- "+cp.nombre+" (ID #"+(cp.id_ac||"--")+"): "+fmt(cp.total)+" pagado\n";});
    msg+="\nNo los borro para no perder esos pagos. Revisalo manualmente (por ejemplo, con \"Dividir cobro en cuotas correctas\" para mover el pago al acuerdo correcto, y después cerrá el que sobra).";
    alert(msg);
    return;
  }

  if(!confirm("Vas a mantener el acuerdo de "+esc(keep.nombre)+" (ID #"+(keep.id_ac||keepKey)+") en "+u+".\n\nSe van a copiar los datos que le falten (trabajo, documentos, firma, etc.) desde el/los otro(s) registro(s), y esos otros se van a eliminar junto con sus cobros pendientes sin pagos (son duplicados de carga, no acuerdos reales).\n\n¿Confirmás?")) return;

  var camposAFusionar=["trabajo","trabajo1","trabajo_dir","trabajo_tel","trabajo_jefe",
    "doc_dni_f","doc_dni_d","doc_sueldo","firma","firma2","fecha_firma",
    "nom2","dni2","tel2","trabajo2","trabajo2_dir","trabajo2_tel","trabajo2_jefe",
    "foto_dni2f","foto_dni2d","foto_sue2",
    "ct_emerg","tel_emerg","rel_emerg","fecha_posesion","obs_ingreso"];
  var ups={};
  descartar.forEach(function(d){
    camposAFusionar.forEach(function(campo){
      if(!keep[campo]&&d[campo]){
        ups["iq/"+keepKey+"/"+campo]=d[campo];
        keep[campo]=d[campo]; // para no pisarse si hay más de un descartado
      }
    });
    // Borrar los cobros del descartado (ya confirmamos que no tienen pagos)
    oA(DATA.cob).filter(function(c){return c.id_ac===d.id_ac;}).forEach(function(c){
      ups["cob/"+c._key]=null;
    });
    ups["iq/"+d._key]=null;
  });
  DB.ref("/").update(ups,function(err){
    if(err){alert("Error al fusionar: "+err.message);return;}
    alert("Listo. Quedó un solo acuerdo activo en "+u+" (#"+(keep.id_ac||keepKey)+"), con los datos combinados.");
    setTimeout(function(){go("config");},400);
  });
}

  var costos=oA(DATA.cst).filter(function(c){
    var matchDesc=!desc||(c.desc||"").toLowerCase().includes(desc);
    var matchMes=!mes||c.mes===mes;
    return matchDesc&&matchMes;
  });
  if(!costos.length){res.innerHTML="<p style='color:#64748B;font-size:12px;margin-top:8px'>Sin resultados.</p>";return;}
  var html="<div style='margin-top:8px'>";
  costos.forEach(function(c){
    var ki=kpush(c._key);
    var pagosArr=c.pagos?Object.values(c.pagos):[];
    html+="<div style='padding:8px;background:#0F172A;border-radius:6px;margin-bottom:4px'>";
    html+="<div style='display:flex;justify-content:space-between;align-items:center'>";

function recalcSemanal(){
  var sem=oA(DATA.iq).filter(function(i){return i.estado==="activo"&&i.frecuencia==="semanal"&&Number(i.alq_semanal||0)>0;});
  if(!sem.length){alert("No hay inquilinos con alquiler semanal.");return;}
  var batch={},msg=[];
  sem.forEach(function(i){
    var cobs=oA(DATA.cob).filter(function(c){return c.id_ac===i.id_ac&&!c.archivado_hist&&c.moneda!=="USD"&&esCobroAlq(c);}).sort(function(a,b){return String(a.mes).localeCompare(String(b.mes));});
    var prevSaldo=0;
    cobs.forEach(function(c,idx){
      var fsm=diasPagoMes(c.mes,(i.dia_sem!=null?Number(i.dia_sem):3));
      var nuevoMonto=fsm.length*Number(i.alq_semanal);
      var salAnt=idx===0?Number(c.sal_ant||0):prevSaldo;
      if(Math.round(Number(c.monto_total||0))!==nuevoMonto){
        batch["cob/"+c._key+"/monto_total"]=nuevoMonto;
        msg.push(i.unidad+" "+c.mes+": "+fmt(Number(c.monto_total||0))+" → "+fmt(nuevoMonto)+" ("+fsm.length+" sem)");
      }
      if(Math.round(Number(c.sal_ant||0))!==Math.round(salAnt)){
        batch["cob/"+c._key+"/sal_ant"]=Math.round(salAnt);
      }
      prevSaldo=Math.round(nuevoMonto+salAnt-pT(c));
    });
  });
  if(!msg.length){alert("Todos los cobros semanales ya están correctos (4 o 5 semanas según el mes).");return;}
  if(!confirm("Se van a corregir "+msg.length+" cobro(s) semanal(es) a la cantidad real de semanas:\n\n"+msg.join("\n")+"\n\nNo se tocan los pagos, solo el monto del mes y el arrastre. ¿Continuar?"))return;
  DB.ref("/").update(batch,function(err){
    if(err){alert("Error: "+err.message);return;}
    alert("Listo. "+msg.length+" cobro(s) corregido(s). El saldo de OT ahora refleja las semanas reales.");
    setTimeout(rCob,500);
  });
}

function completarCuotasRenovacion(ki){
  var cobKey=kget(ki);
  var c=DATA.cob[cobKey]; if(!c){alert("Cobro no encontrado");return;}
  var m=(c.concepto||c.concepto_extra||"").match(/cuota\s*(\d+)\s*\/\s*(\d+)/i);
  if(!m){alert("Este cobro no tiene formato 'cuota X/Y'.");return;}
  var idx=parseInt(m[1]),total=parseInt(m[2]);
  var descBase=(c.concepto||c.concepto_extra||"").replace(/\s*cuota\s*\d+\s*\/\s*\d+/i,"").trim()||"Gastos renovacion";
  var monto=Number(c.monto_total||0);
  function getMesN(start,n){var yr=parseInt(start.slice(0,4)),mo=parseInt(start.slice(5,7))+n;while(mo>12){mo-=12;yr++;}while(mo<1){mo+=12;yr--;}return yr+"-"+String(mo).padStart(2,"0");}
  // Qué cuotas de este mismo grupo ya existen (misma unidad + mismo id_ac + mismo total de cuotas)
  var existentes={};
  oA(DATA.cob).forEach(function(x){
    if(x.unidad!==c.unidad)return;
    if((c.id_ac||"")&&(x.id_ac||"")&&x.id_ac!==c.id_ac)return;
    var mm=(x.concepto||x.concepto_extra||"").match(/cuota\s*(\d+)\s*\/\s*(\d+)/i);
    if(mm&&parseInt(mm[2])===total)existentes[parseInt(mm[1])]=true;
  });
  var aCrear=[];
  for(var j=1;j<=total;j++){if(!existentes[j])aCrear.push(j);}
  if(!aCrear.length){alert("Ya están todas las cuotas 1.."+total+". No falta ninguna.");return;}
  if(!confirm("Crear "+aCrear.length+" cuota(s) faltante(s): "+aCrear.map(function(j){return j+"/"+total;}).join(", ")+"\nMonto: "+fmt(monto)+" c/u, como pendientes.\n¿Continuar?"))return;
  var batch={};
  aCrear.forEach(function(j){
    var k=DB.ref("cob").push().key;
    batch["cob/"+k]={id_ac:c.id_ac||"",unidad:c.unidad,inq:c.inq,mes:getMesN(c.mes,j-idx),monto_total:monto,sal_ant:0,estado:"pendiente",pagos:{},concepto:descBase+" cuota "+j+"/"+total};
  });
  DB.ref("/").update(batch,function(err){
    if(err){alert("Error: "+err.message);return;}
    alert("Listo. Se crearon "+aCrear.length+" cuota(s) faltante(s).");
    buscarCobroDividir();
  });
}
function dividirCobroEnCuotas(ki){
  var cobKey=kget(ki);
  var c=DATA.cob[cobKey]; if(!c){alert("Cobro no encontrado");return;}
  var cant=parseInt((G("div-cant-"+ki)||{value:"3"}).value)||0;
  var mesIni=(G("div-mesini-"+ki)||{value:c.mes}).value||c.mes;
  var descBase=(G("div-desc-"+ki)||{value:"Gastos renovacion"}).value.trim()||"Gastos renovacion";
  if(cant<2){alert("La cantidad de cuotas debe ser 2 o más (si es 1 no hay nada que dividir)");return;}
  var totalOriginal=Number(c.monto_total||0);
  var cuotaMonto=Math.round(totalOriginal/cant);
  var pg=pT(c);
  if(pg>cuotaMonto){
    if(!confirm("Lo ya pagado ("+fmt(pg)+") es MAYOR al valor de una cuota ("+fmt(cuotaMonto)+"). Esto puede significar que ese pago cubre más de una cuota.\n\n¿Igual querés continuar? La cuota 1 va a quedar con ese pago completo asignado (puede figurar en verde aunque el monto de la cuota sea menor a lo pagado) y las demás cuotas se crean sin pagos, para que las repartas vos manualmente si hace falta."))return;
  }
  var estado1 = pg>=cuotaMonto ? "pagado" : (pg>0 ? "parcial" : "pendiente");
  var ups={};
  ups["cob/"+cobKey+"/mes"]=mesIni;
  ups["cob/"+cobKey+"/monto_total"]=cuotaMonto;
  ups["cob/"+cobKey+"/concepto"]=descBase+" cuota 1/"+cant;
  ups["cob/"+cobKey+"/estado"]=estado1;
  DB.ref("/").update(ups,function(err){
    if(err){alert("Error al actualizar la cuota 1: "+err.message);return;}
    function getMesN(start,n){
      var yr=parseInt(start.slice(0,4)),mo=parseInt(start.slice(5,7))+n;
      while(mo>12){mo-=12;yr++;}return yr+"-"+String(mo).padStart(2,"0");
    }
    var totalCrear=cant-1;
    if(totalCrear<=0){alert("Cobro actualizado como cuota 1/"+cant+".");return;}
    var creaciones=0,huboError=false;
    for(var i=1;i<cant;i++){
      DB.ref("cob").push({
        id_ac:c.id_ac||"",
        unidad:c.unidad,
        inq:c.inq,
        mes:getMesN(mesIni,i),
        monto_total:cuotaMonto,
        sal_ant:0,
        estado:"pendiente",
        pagos:{},
        concepto:descBase+" cuota "+(i+1)+"/"+cant
      },function(err2){
        creaciones++;
        if(err2) huboError=true;
        if(creaciones===totalCrear){
          if(huboError) alert("Se actualizó la cuota 1, pero hubo un error creando alguna de las cuotas siguientes. Revisá manualmente.");
          else alert("Listo. Cuota 1/"+cant+" = "+fmt(cuotaMonto)+" ("+estado1+"), y "+totalCrear+" cuota(s) más creadas como pendientes en los meses siguientes.");
        }
      });
    }
  });
}

function verDiaUnificado(){
  var cont=G("dia-uni-res");if(!cont)return;
  var F=G("dia-uni-fecha")?G("dia-uni-fecha").value:hoy();
  if(!F){cont.innerHTML="<p style='color:#64748B;font-size:11px;margin-top:8px'>Elegí una fecha.</p>";return;}
  var cerrada=oA(DATA.subc).some(function(s){return s.fecha===F;});
  var items=[];
  // Cobros (por pago del día)
  oA(DATA.cob).forEach(function(c){
    var pgs=c.pagos||{};
    Object.keys(pgs).forEach(function(pk){
      var p=pgs[pk];if((p.fecha||"")!==F)return;
      items.push({tipo:"cobro",label:esc((c.unidad||"")+" · "+(c.inq||c.concepto||"Alquiler")),monto:Number(p.monto||0),ckey:c._key,pk:pk});
    });
  });
  // Costos (por pago del día + legacy pagado)
  oA(DATA.cst).forEach(function(c){
    var pgs=c.pagos||{};
    if(Object.keys(pgs).length>0){
      Object.keys(pgs).forEach(function(pk){
        var p=pgs[pk];if((p.fecha||"")!==F)return;
        items.push({tipo:"costo",label:esc(c.desc||"Costo"),monto:-Number(p.monto||0),ckey:c._key,pk:pk});
      });
    } else if(c.pagado&&((c.fecha_pago||c.fec_venc||"")===F)){
      items.push({tipo:"costo_legacy",label:esc(c.desc||"Costo"),monto:-Number(c.monto||0),ckey:c._key});
    }
  });
  // Ajustes manuales (no auto)
  oA(DATA.aj).forEach(function(a){
    if((a.fecha||"")!==F||a.auto)return;
    items.push({tipo:"ajuste",label:esc(a.concepto||"Ajuste")+(a.esVale?" (vale)":"")+(a.foto?" 📎":""),monto:(a.tipo==="ingreso"?1:-1)*Number(a.monto||0),ajkey:a._key});
  });
  // Movimientos de socios
  oA(DATA.movs).forEach(function(mv){
    if((mv.fecha||"")!==F)return;
    items.push({tipo:"mov",label:esc((mv.tipo||"")+(mv.nota?" - "+mv.nota:"")+" ("+(mv.cuenta||"")+")"),monto:Number(mv.monto||0),mvkey:mv._key});
  });
  // Compras USD
  oA(DATA.aho).forEach(function(a){
    if((a.fecha||"")!==F)return;
    items.push({tipo:"usd",label:"Compra USD U$S "+Number(a.usd||0).toLocaleString()+" @ "+Number(a.tc||0).toLocaleString(),monto:-Number(a.pesos||0),ahokey:a._key});
  });

  if(!items.length){cont.innerHTML="<p style='color:#64748B;font-size:11px;margin-top:8px'>No hay nada cargado el "+fecDisp(F)+".</p>";return;}

  var meta={cobro:{ic:"💰",cl:"#10B981",t:"Cobro"},costo:{ic:"🏷",cl:"#F59E0B",t:"Costo"},costo_legacy:{ic:"🏷",cl:"#F59E0B",t:"Costo"},ajuste:{ic:"🧾",cl:"#EF4444",t:"Ajuste"},mov:{ic:"🔄",cl:"#8B5CF6",t:"Movimiento"},usd:{ic:"💵",cl:"#06B6D4",t:"USD"}};
  var o="<div style='margin-top:10px'>";
  o+="<p style='color:#94A3B8;font-size:11px;margin-bottom:6px'>"+items.length+" registro(s) del "+fecDisp(F)+":</p>";
  if(cerrada) o+="<div style='background:#3B0E0E;border:1px solid #EF444488;border-radius:8px;padding:9px 12px;font-size:12px;color:#FCA5A5;margin-bottom:8px'>🔒 La caja del "+fecDisp(F)+" está CERRADA. No se puede borrar nada de este día.</div>";
  items.forEach(function(it,idx){
    var mt=meta[it.tipo];
    o+="<div style='background:#0F172A;border-left:3px solid "+mt.cl+";border-radius:8px;padding:8px 10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px'>";
    o+="<div style='font-size:11px;flex:1'>";
    o+="<span style='background:"+mt.cl+"22;color:"+mt.cl+";border-radius:4px;padding:1px 6px;font-weight:700;font-size:10px'>"+mt.ic+" "+mt.t+"</span> ";
    o+="<span style='color:#F1F5F9'>"+it.label+"</span> · ";
    o+="<span style='color:"+(it.monto>=0?"#10B981":"#EF4444")+";font-weight:700'>"+(it.monto>=0?"+":"")+fmt(it.monto)+"</span>";
    o+="</div>";
    if(!cerrada) o+="<button class='btn bsm' style='background:#EF4444;color:#fff;font-size:10px' data-uni='"+idx+"'>Borrar</button>";
    o+="</div>";
  });
  o+="</div>";
  cont.innerHTML=o;
  window._diaUniItems=items;window._diaUniFecha=F;
  cont.onclick=function(e){
    var b=e.target.closest("[data-uni]");if(!b)return;
    var it=window._diaUniItems[parseInt(b.dataset.uni)];if(it)borrarUnoDelDia(it);

function borrarUnoDelDia(it){
  var F=window._diaUniFecha;
  if(oA(DATA.subc).some(function(s){return s.fecha===F;})){alert("La caja del "+fecDisp(F)+" está cerrada. No se puede borrar.");return;}
  if(it.tipo==="cobro"){
    // Función oficial: chequea cierre y día anterior, recalcula estado y arrastre
    deletePago(it.ckey,it.pk);
    setTimeout(verDiaUnificado,700);
    return;
  }
  if(it.tipo==="costo"){
    if(!confirm("Borrar este pago de costo?\n"+it.label+" "+fmt(it.monto)))return;
    var c=DATA.cst[it.ckey];if(!c){alert("No encontrado");return;}
    var rest=Object.assign({},c.pagos||{});delete rest[it.pk];
    var pg=Object.values(rest).reduce(function(s,p){return s+Number(p.monto||0);},0);
    var ups={};ups["cst/"+it.ckey+"/pagos/"+it.pk]=null;ups["cst/"+it.ckey+"/pagado"]=(pg>0&&pg>=Number(c.monto||0));
    DB.ref("/").update(ups,function(){setTimeout(verDiaUnificado,400);});
    return;
  }
  if(it.tipo==="costo_legacy"){
    if(!confirm("Este costo figura pagado el "+fecDisp(F)+". Marcarlo como NO pagado (lo saca de la caja de ese día)?\n"+it.label+" "+fmt(it.monto)))return;
    var u={};u["cst/"+it.ckey+"/pagado"]=false;u["cst/"+it.ckey+"/fecha_pago"]=null;
    DB.ref("/").update(u,function(){setTimeout(verDiaUnificado,400);});
    return;
  }
  if(it.tipo==="ajuste"){
    if(!confirm("Borrar este ajuste de caja?\n"+it.label+" "+fmt(it.monto)))return;
    DB.ref("aj/"+it.ajkey).remove(function(){setTimeout(verDiaUnificado,400);});
    return;
  }
  if(it.tipo==="mov"){
    if(!confirm("Borrar este movimiento?\n"+it.label+" "+fmt(it.monto)))return;
    DB.ref("movs/"+it.mvkey).remove(function(){setTimeout(verDiaUnificado,400);});
    return;
  }
  if(it.tipo==="usd"){
    if(!confirm("Borrar esta compra de USD?\n"+it.label))return;
    DB.ref("aho/"+it.ahokey).remove(function(){setTimeout(verDiaUnificado,400);});
    return;
  }
}

function limpiarDuplicadosCostos(){
  if(!confirm("Limpiar costos duplicados del mes seleccionado?"))return;
  var mesSel=G("limp-mes-cst")?G("limp-mes-cst").value:mes();
  var cstMes=oA(DATA.cst).filter(function(c){return c.mes===mesSel;});
  var ups={};
  // Agrupar por cfid y descripcion, conservar el primero, borrar el resto
  var vistos={};
  cstMes.forEach(function(c){
    var key=c.cfid||(c.desc||"").trim().toLowerCase();
    if(vistos[key]){
      // Duplicado — borrar
      ups["cst/"+c._key]=null;
    } else {
      vistos[key]=true;
      // Tambien limpiar pagos duplicados dentro del costo
      if(c.pagos){
        var fechasVistas={};
        Object.entries(c.pagos).forEach(function(entry){
          var pk=entry[0],pg=entry[1];
          var fecha=pg.fecha||"";
          if(fechasVistas[fecha]){
            ups["cst/"+c._key+"/pagos/"+pk]=null;
          } else {
            fechasVistas[fecha]=true;
          }
        });
      }
    }
  });
  if(!Object.keys(ups).length){alert("No se encontraron duplicados en "+mesSel+".");return;}
  DB.ref("/").update(ups,function(){

function rCtaCte(){
  if(USER.r!=="admin"){G("main").innerHTML="<p style='color:#EF4444;padding:20px'>Solo el administrador puede acceder.</p>";return;}
  var movs=oA(DATA.movs||{});
  var cobA=oA(DATA.cob);
  var cstA=oA(DATA.cst||{});
  var movLoli=[],movHugo=[];

  // Manual aportes/retiros
  movs.forEach(function(mv){
    var socio=mv.cuenta||"";
    var entry={fecha:mv.fecha,tipo:mv.tipo,
      concepto:(mv.tipo==="retiro"?"Retiro":"Aporte")+(mv.nota?" — "+mv.nota:""),
      medio:mv.cuenta_caja||mv.cuentaCaja||"",
      monto:mv.tipo==="retiro"?Number(mv.monto||0):-Number(mv.monto||0)};
    if(socio==="Cuenta Loli") movLoli.push(entry);
    else if(socio==="Cuenta Hugo") movHugo.push(entry);
  });

  // Cobros via socio accounts - el socio SE QUEDA con esta plata (retiro), resta de su posicion
  cobA.forEach(function(c){
    pA(c).forEach(function(p){
      var socio=CTAS_SOCIO_MAP[p.cuenta]||"";
      if(!socio) return;
      var entry={fecha:p.fecha,tipo:"retiro",
        concepto:"Cobro "+c.unidad+" "+(c.inq||"").split(",")[0]+" (retirado por el socio)",
        medio:p.cuenta,monto:-p.monto};
      if(socio==="Cuenta Loli") movLoli.push(entry);
      else if(socio==="Cuenta Hugo") movHugo.push(entry);
    });
  });

  // Costs paid via socio accounts - el socio pone de su bolsillo (aporte), suma a su posicion
  oA(DATA.cst||{}).forEach(function(c){
    if(c.pagos&&Object.keys(c.pagos).length>0){
      Object.values(c.pagos).forEach(function(p){
        var socio=CTAS_SOCIO_MAP[p.cuenta||c.cuenta]||"";
        if(!socio) return;
        var entry={fecha:p.fecha||c.fecha_pago||c.mes+"-01",tipo:"aporte",
          concepto:"Pago "+(c.desc||"")+" (pagado de su bolsillo)",medio:p.cuenta||c.cuenta,
          monto:Number(p.monto||0)};
        if(socio==="Cuenta Loli") movLoli.push(entry);
        else if(socio==="Cuenta Hugo") movHugo.push(entry);
      });
    } else if(c.pagado&&c.cuenta){
      var socio=CTAS_SOCIO_MAP[c.cuenta]||"";
      if(!socio) return;
      var entry={fecha:c.fecha_pago||c.fec_venc||c.mes+"-01",tipo:"aporte",
        concepto:"Pago "+(c.desc||"")+" (pagado de su bolsillo)",medio:c.cuenta,
        monto:Number(c.monto||0)};
      if(socio==="Cuenta Loli") movLoli.push(entry);
      else if(socio==="Cuenta Hugo") movHugo.push(entry);
    }
  });

  movLoli.sort(function(a,b){return(a.fecha||"").localeCompare(b.fecha||"");});
  movHugo.sort(function(a,b){return(a.fecha||"").localeCompare(b.fecha||"");});

  o+="<select class='inp' style='max-width:180px' id='cts-mes-sel' onchange='_ctsMesChange(this.value)'>";

  var nowD=new Date();

  } else {

  o+="</p>";

  o+="</div>";

  o+="<button class='btn bsm' style='background:#EF444422;color:#EF4444;border:1px solid #EF444466' onclick='openVenderUSD()'>💵 Vender USD</button></div>";

  var o="<p style='color:#94A3B8;font-size:12px;margin-bottom:12px'>Stock disponible: <b style='color:#06B6D4'>U$S "+stockActual.toLocaleString()+"</b></p>";
  o+="<div class='g2'>";
  o+=fld("vusd-f","Fecha",hoy(),"date");
  o+=fld("vusd-usd","Cantidad USD a vender","","money");
  o+=fld("vusd-tc","TC (pesos por dolar)","","money");
  o+=sld("vusd-cta","Acreditar en cuenta",CTAS,"Efectivo");
  o+="</div>";
  o+="<div id='vusd-preview' style='background:#0F172A;border-radius:8px;padding:10px;font-size:12px;color:#94A3B8;margin:8px 0'>Ingresa USD y TC para ver el total en pesos</div>";
  o+="<button class='btn bok' onclick='saveVenderUSD()' style='width:100%;margin-top:8px'>Registrar venta</button>";
  openModal("💵 Vender USD",o,false);
  setTimeout(function(){
    ["vusd-usd","vusd-tc"].forEach(function(id){
      var el=G(id);if(el)el.oninput=function(){
        var usd=fmtInputVal(G("vusd-usd")),tc=fmtInputVal(G("vusd-tc"));
        var t=G("vusd-preview");
        if(t&&usd>0&&tc>0) t.innerHTML="<b style='color:#10B981'>Total: "+fmt(usd*tc)+"</b> (U$S "+usd.toLocaleString()+" × $"+tc.toLocaleString()+")";
      };
    });
  },100);
}
function saveVenderUSD(){
  var f=G("vusd-f").value;
  var usd=fmtInputVal(G("vusd-usd"));
  var tc=fmtInputVal(G("vusd-tc"));
  var cta=G("vusd-cta")?G("vusd-cta").value:"Efectivo";
  if(!usd||!tc){alert("Ingresa USD y TC");return;}
  var pesos=usd*tc;
  var m=f.slice(0,7);
  // Register as ahorro with negative value (venta)
  DB.ref("aho").push({fecha:f,mes:m,usd:-usd,tc:tc,pesos:-pesos,cuenta:cta,tipo:"venta"});
  // Register pesos income in caja
  DB.ref("aj").push({fecha:f,mes:m,tipo:"ingreso",concepto:"Venta USD U$S "+usd.toLocaleString()+" (TC $"+tc.toLocaleString()+")",monto:pesos,cuenta:cta,auto:false,esAhorro:true});
  // Update stock
  var stockActual=Number((DATA.cfg_aho||{}).stock_usd||0);
  if(stockActual>0) DB.ref("cfg_aho").update({stock_usd:Math.max(0,stockActual-usd),stock_fecha:f});
  closeModal();
  alert("Venta registrada. Se acreditaron "+fmt(pesos)+" en "+cta);
  setTimeout(rCtaCte,400);
}
function openStockUSD(){
  var actual=Number((DATA.cfg_aho||{}).stock_usd||0);
  var o="<p style='color:#64748B;font-size:12px;margin-bottom:12px'>Ingresa el stock real de dolares que tienen hoy. Esto no afecta la caja, es solo para llevar el control del ahorro.</p>";
  o+="<div class='g2'>";
  o+=fld("su-usd","Stock actual U$S",actual||"","number");
  o+=fld("su-f","Fecha",hoy(),"date");
  o+="</div>";
  o+="<div style='display:flex;justify-content:flex-end;gap:7px;margin-top:12px'><button class='btn bg bsm' onclick='closeModal()'>Cancelar</button><button class='btn bok bsm' onclick='saveStockUSD()'>Guardar</button></div>";
  openModal("Actualizar stock de dolares",o);
}

function saveStockUSD(){
  var usd=fmtInputVal(G("su-usd"));
  var f=G("su-f").value;
  if(!f){alert("Ingresa la fecha");return;}
  DB.ref("cfg_aho").update({stock_usd:usd,stock_fecha:f});
  closeModal();
  setTimeout(rCtaCte,400);
}

// ── FORMULARIOS RECIBIDOS ─────────────────────────────────────────────────────
function openVerForm(fKey){
  var f=(DATA.forms||{})[fKey];if(!f)return;
  var docs=[
    {label:"DNI Frente",key:"doc_dni_f"},
    {label:"DNI Dorso",key:"doc_dni_d"},
    {label:"Recibo de sueldo",key:"doc_sueldo"},
    {label:"DNI Frente 2do inquilino",key:"foto_dni2f"},
    {label:"DNI Dorso 2do inquilino",key:"foto_dni2d"},
    {label:"Recibo sueldo 2do inquilino",key:"foto_sue2"},
  ];
  var o="<div class='g2' style='margin-bottom:12px'>";
  o+="<div><div class='lbl'>Nombre</div><div style='font-size:13px;font-weight:700'>"+esc(f.nombre||"--")+"</div></div>";
  o+="<div><div class='lbl'>DNI</div><div style='font-size:13px'>"+esc(f.dni||"--")+"</div></div>";
  o+="<div><div class='lbl'>Teléfono</div><div style='font-size:13px'>"+esc(f.tel||"--")+"</div></div>";
  o+="<div><div class='lbl'>Trabajo</div><div style='font-size:13px'>"+esc(f.trabajo||"--")+"</div></div>";
  o+="<div><div class='lbl'>Contacto emergencia</div><div style='font-size:13px'>"+esc(f.ct_emerg||"--")+"</div></div>";
  o+="<div><div class='lbl'>Tel emergencia</div><div style='font-size:13px'>"+esc(f.tel_emerg||"--")+"</div></div>";
  o+="</div>";
  o+="<div class='ibox' style='margin-bottom:10px'>Unidad: <b>"+esc(f.unidad||"")+"</b> · Alq: <b>"+fmt(f.alquiler||0)+"</b> · Dep: <b>"+fmt(f.deposito||0)+"</b> · Enviado: "+fecDisp(f.fecha_envio||"")+"</div>";
  var hayDocs=false;
  docs.forEach(function(d){
    if(!f[d.key])return;
    hayDocs=true;
    o+="<div style='margin-bottom:10px'><div style='color:#94A3B8;font-size:11px;margin-bottom:4px'>"+d.label+"</div>";
    o+="<img src='"+f[d.key]+"' style='max-width:100%;max-height:260px;border-radius:8px;border:1px solid #334155'/></div>";
  });
  if(!hayDocs) o+="<p style='color:#64748B;font-size:12px'>Sin documentos adjuntos.</p>";
  o+="<div style='display:flex;justify-content:flex-end;gap:7px;margin-top:12px'>";
  o+="<button class='btn bg bsm' onclick='closeModal()'>Cerrar</button>";
  o+="<button class='btn bok bsm' onclick='closeModal();convertirForm("+JSON.stringify(fKey)+")'>Crear acuerdo con estos datos</button>";
  o+="</div>";
  openModal("📋 Formulario — "+esc(f.unidad||"")+" "+esc(f.nombre||""),o,true);
}

function convertirForm(fKey){
  var f=(DATA.forms||{})[fKey];if(!f)return;
  // Si es un form de RENOVACIÓN, actualizar el inquilino directamente
  if(f.modo==="renovar"&&f.iq_key){
    if(!confirm("Aplicar datos de renovación a "+esc(f.nombre||f.unidad||"")+"?"))return;
    var upd={};
    if(f.trabajo1) upd.trabajo1=f.trabajo1;
    if(f.trabajo_dir) upd.trabajo_dir=f.trabajo_dir;
    if(f.trabajo_tel) upd.trabajo_tel=f.trabajo_tel;
    if(f.trabajo_jefe) upd.trabajo_jefe=f.trabajo_jefe;
    upd.nom2=f.nom2||""; upd.dni2=f.dni2||""; upd.tel2=f.tel2||""; upd.trabajo2=f.trabajo2||"";
    if(f.ct_emerg) upd.ct_emerg=f.ct_emerg;
    if(f.tel_emerg) upd.tel_emerg=f.tel_emerg;
    if(f.rel_emerg) upd.rel_emerg=f.rel_emerg;
    if(f.doc_sueldo) upd.doc_sueldo=f.doc_sueldo;
    if(f.foto_sue2) upd.foto_sue2=f.foto_sue2;
    if(f.firma) upd.firma=f.firma;
    if(f.fecha_firma) upd.fecha_firma=f.fecha_firma;
    DB.ref("iq/"+f.iq_key).update(upd,function(err){
      if(err){alert("Error al actualizar: "+err.message);return;}
      DB.ref("forms/"+fKey).update({estado:"convertido",fecha_conversion:hoy()});
      _formsConvertidosLocal[fKey]=true;
      alert("Datos de renovación aplicados correctamente a "+esc(f.nombre||"")+".");
      setTimeout(rAcuerdos,300);
    });
    return;
  }
  _formsConvertidosLocal[fKey]=true;
  if(DATA.forms&&DATA.forms[fKey]) DATA.forms[fKey].estado="procesando";
  rShell();
  window._resConvert={
    unidad:f.unidad||"",
    nombre:f.nombre||"",
    dni:f.dni||"",
    tel:f.tel||"",
    alquiler:f.alquiler||0,
    deposito:f.deposito||0,
    gastos:f.gastos||0,
    fecha_ingreso:f.ingreso||"",
    fecha_egreso:f.egreso||"",
    senia:f.senia||0,
    ct_emerg:f.ct_emerg||"",
    tel_emerg:f.tel_emerg||"",
    cta_senia:f.cta_senia||""
  };
  window._resConvertKey=null;
  window._formConvertKey=fKey; // para marcarlo como convertido al guardar
  openNA();
}

// Registrar la seña de un FORMULARIO firmado (aún sin acuerdo). Cae en caja ahora;
// al crear el acuerdo se aplica sola como pago a cuenta ("ya en caja"), sin volver a cobrarla.
var _senaFormKey=null;
function openSenaForm(fKey){
  var f=(DATA.forms||{})[fKey];if(!f)return;
  _senaFormKey=fKey;
  var o="<p style='color:#94A3B8;font-size:12px;margin-bottom:10px'>Seña que "+esc(f.nombre||"")+" pagó para reservar "+esc(f.unidad||"")+". Queda en la caja ahora. Cuando crees el acuerdo (al tomar posesión) se aplica sola, sin volver a cobrarla.</p>";
  o+="<div class='g2'>"+fld("sf-monto","Monto seña $",f.senia||"","money")+sld("sf-cta","Cuenta donde entró la plata",CTAS_RECIBO,f.cta_senia||"Efectivo")+"</div>";
  o+="<div style='display:flex;justify-content:flex-end;gap:7px;margin-top:12px'><button class='btn bg bsm' onclick='closeModal()'>Cancelar</button><button class='btn bsm' style='background:#F59E0B;color:#000;font-weight:700' onclick='saveSenaForm()'>Registrar seña</button></div>";
  openModal("Registrar seña — "+esc(f.unidad||""),o);
}
function saveSenaForm(){
  var fKey=_senaFormKey;var f=(DATA.forms||{})[fKey];if(!f){alert("Formulario no encontrado");return;}
  var monto=fmtInputVal(G("sf-monto")||{value:"0",dataset:{raw:"0"}});
  var cta=(G("sf-cta")||{value:"Efectivo"}).value||"Efectivo";
  if(!monto||monto<=0){alert("Ingresá el monto de la seña");return;}
  var nom=f.nombre||"";var u=f.unidad||"";var fecha=hoy();
  var tag="Seña reserva "+u;
  // Borrar registro anterior de esta seña (evita duplicar al editar / corrige cargas viejas)
  oA(DATA.movs).forEach(function(mv){if((mv.nota||"").indexOf(tag)>=0&&(mv.nota||"").indexOf(nom)>=0)DB.ref("movs/"+mv._key).remove();});
  oA(DATA.aj).forEach(function(a){if(a.sub==="Seña reserva"&&(a.concepto||"").indexOf(tag)>=0&&(a.concepto||"").indexOf(nom)>=0)DB.ref("aj/"+a._key).remove();});
  // Registrar en caja: cuenta de socio -> RETIRO de ese socio; empresa -> ingreso
  if(CTAS_SOCIOS.indexOf(cta)>=0){
    DB.ref("movs").push({fecha:fecha,mes:fecha.slice(0,7),tipo:"retiro",cuenta:CTAS_SOCIO_MAP[cta]||"Cuenta Loli",cuenta_caja:cta,monto:monto,nota:tag+" - "+nom});
  } else {
    DB.ref("aj").push({fecha:fecha,tipo:"ingreso",sub:"Seña reserva",cuenta:cta,concepto:tag+" - "+nom,monto:monto});
  }
  // Guardar en el formulario para aplicarla automáticamente al crear el acuerdo
  DB.ref("forms/"+fKey).update({senia:monto,cta_senia:cta,senia_fecha:fecha});
  closeModal();
  alert("✅ Seña de "+fmt(monto)+" registrada en "+cta+".\nAl crear el acuerdo se aplica sola (no se vuelve a cobrar).");
  setTimeout(rAcuerdos,300);
}

render();
</script>
